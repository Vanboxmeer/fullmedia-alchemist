/* ── Tokens ──────────────────────────────────────────────────────────── */
:root{
  --ground:#12160f; --surface:#181d15; --surface-2:#1f251b; --surface-3:#262d21;
  --line:#2c3428; --line-2:#3a4434;
  --ink:#ece6d6; --ink-2:#c9c5b5; --muted:#949d8d;

  --blue:#6aa7e8; --blue-soft:rgba(106,167,232,.14);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --shadow-sm:0 4px 16px rgba(0,0,0,.28);

  --body:"IBM Plex Sans",-apple-system,system-ui,sans-serif;
  --r:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){

    --ground:#f3f0e7; --surface:#fffdf8; --surface-2:#f0ece1; --surface-3:#e6e1d3;
    --line:#ddd6c5; --line-2:#cbc3af;
    --ink:#1c2018; --ink-2:#3a4034; --muted:#666d5e;
    --gold:#c07f17; --gold-ink:#fffaf0; --gold-soft:rgba(192,127,23,.12);
    --green:#23805f; --green-soft:rgba(35,128,95,.12);
    --red:#b8452f; --red-soft:rgba(184,69,47,.1);
    --blue:#2f6db0; --blue-soft:rgba(47,109,176,.1);
    --shadow:0 18px 50px rgba(40,34,20,.18);
    --shadow-sm:0 4px 16px rgba(40,34,20,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ground:#f3f0e7; --surface:#fffdf8; --surface-2:#f0ece1; --surface-3:#e6e1d3;
  --line:#ddd6c5; --line-2:#cbc3af;
  --ink:#1c2018; --ink-2:#3a4034; --muted:#666d5e;
  --gold:#c07f17; --gold-ink:#fffaf0; --gold-soft:rgba(192,127,23,.12);

}

/* ── Base ────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ── Buttons & fields ────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;line-height:1.2;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s,opacity .2s;background:var(--surface-2);color:var(--ink)}

.btn-gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 6px 20px -8px var(--gold)}
.btn-gold:hover{filter:brightness(1.07);border-color:transparent}

.icon-btn svg{width:20px;height:20px}
.field{display:grid;gap:6px}
.field label,.label{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.field .hint{font-size:12.5px;color:var(--muted)}
.input,.textarea,.select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
.textarea{resize:vertical;min-height:84px;line-height:1.5}
.input:focus,.textarea:focus,.select:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.input.err{border-color:var(--red)}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.muted{color:var(--muted)}
.small{font-size:13px}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;background:var(--surface);cursor:pointer;transition:background .2s,border-color .2s,color .2s;user-select:none}

/* ── Sheets (drawers & dialogs) ──────────────────────────────────────── */
.backdrop{position:fixed;inset:0;z-index:80;background:rgba(6,8,5,.55);backdrop-filter:blur(3px);animation:fade .25s ease both}
.backdrop.closing{animation:fadeOut .22s ease both}

.sheet{position:fixed;z-index:81;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slideIn .38s var(--ease) both}

@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}

.sheet.dialog{top:50%;left:50%;right:auto;bottom:auto;width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 40px);border:1px solid var(--line);border-radius:16px;transform:translate(-50%,-50%);animation:dialogIn .28s var(--ease) both}
.sheet.dialog.closing{animation:dialogOut .2s ease both}
@keyframes dialogIn{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes dialogOut{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-48%) scale(.97)}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px 14px 22px;border-bottom:1px solid var(--line)}

/* lightbox */

/* ── Brew overlay (the Alchemist at work) ────────────────────────────── */
.brew{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:blur(8px);animation:fade .3s ease both}

.brew-orb{width:180px;height:180px;margin:0 auto 26px;position:relative}
.brew-orb svg{width:100%;height:100%;overflow:visible}
.brew-orb .r1{transform-origin:90px 90px;animation:spin 9s linear infinite}
.brew-orb .r2{transform-origin:90px 90px;animation:spin 14s linear infinite reverse}
.brew-orb .r3{transform-origin:90px 90px;animation:spin 5s linear infinite}
.brew-orb .core{transform-origin:90px 90px;animation:breathe 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.88);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.brew-card h2{font-size:28px;margin-bottom:10px}
.brew-stage{color:var(--ink-2);min-height:26px;font-size:16px;transition:opacity .3s}

.brew-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:99px;transition:width .8s var(--ease)}
.brew-note{font-size:13px;color:var(--muted)}

/* ── Toasts ──────────────────────────────────────────────────────────── */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:grid;gap:10px;width:min(440px,calc(100vw - 32px));pointer-events:none}

@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* ── The Alchemist ───────────────────────────────────────────────────── */
.alch-fab{position:fixed;right:22px;bottom:22px;z-index:70;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-weight:700;font-size:15px;transition:transform .25s var(--ease),box-shadow .25s}
.alch-fab:hover{transform:translateY(-3px) scale(1.02)}
.alch-fab .av{width:44px;height:44px;border-radius:50%;background:var(--gold-soft) center/cover no-repeat;flex:none;position:relative}.alch-fab .av::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--gold);opacity:.6;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@media (max-width:560px){.alch-fab{right:14px;bottom:14px;padding:6px}.alch-fab .lbl{display:none}}
.alch{position:fixed;z-index:85;right:20px;bottom:20px;width:min(440px,calc(100vw - 24px));height:min(680px,calc(100vh - 40px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;animation:alchIn .38s var(--ease) both}
.alch.closing{animation:alchOut .24s ease both}
@keyframes alchIn{from{opacity:0;transform:translateY(20px) scale(.92)}to{opacity:1;transform:none}}
@keyframes alchOut{to{opacity:0;transform:translateY(16px) scale(.94)}}
@media (max-width:560px){.alch{right:0;bottom:0;width:100vw;height:100dvh;border-radius:0;border:0}}
.alch-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--gold-soft),transparent)}
.alch-head .av{width:46px;height:46px;border-radius:50%;background:var(--surface-2) center/cover no-repeat;flex:none}
/* Face close-up: the source image is the full-body Alchemist (1024×1536), head near the top centre. */
.alch-fab .av,.alch-head .av{background-size:250% auto;background-position:45.6% 6.2%}
.alch-head b{font-family:var(--display);font-size:19px;display:block}
.alch-head small{color:var(--muted);font-size:12.5px}
.alch-log{flex:1;overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.bubble{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;animation:viewIn .3s var(--ease)}
.bubble.me{justify-self:end;background:var(--gold);color:var(--gold-ink);border-bottom-right-radius:5px}
.bubble.ai{justify-self:start;background:var(--surface-2);border-bottom-left-radius:5px}
.bubble.ai .use{margin-top:10px}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
.alch-quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 10px}
.alch-opts{display:grid;gap:8px;margin-top:12px;white-space:normal}
.slot-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.slot-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.slot-list li span{min-width:0}
.slot-det{margin:10px 0}.slot-det summary{cursor:pointer;color:var(--ink-2)}
.alch-opt{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.alch-opt div{flex:1;min-width:0}
.alch-opt b{display:block;font-size:14px;line-height:1.3}
.alch-opt small{color:var(--muted);font-size:12px}
.start-idea{font-size:13.5px;color:var(--ink-2);background:var(--gold-soft);border-radius:10px;padding:10px 12px}
.alch-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.alch-form .input{border-radius:12px}

/* suggestion compare */
.suggest{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:var(--gold-soft);border-radius:12px;padding:14px;display:grid;gap:10px;animation:viewIn .35s var(--ease)}
.suggest .t{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.suggest p{white-space:pre-wrap;font-size:14.5px}

/* ── Transmutation circle ────────────────────────────────────────────── */
.tc{width:100%;height:100%;overflow:visible;display:block}
.tc .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:tcDraw 1.6s var(--ease) forwards}
.tc .d2{animation-delay:.25s}.tc .d3{animation-delay:.5s}.tc .d4{animation-delay:.75s}
@keyframes tcDraw{to{stroke-dashoffset:0}}
.tc .spin-slow{transform-origin:100px 100px;animation:spin 40s linear infinite}
.tc .spin-rev{transform-origin:100px 100px;animation:spin 26s linear infinite reverse}
.tc .spin-fast{transform-origin:100px 100px;animation:spin 14s linear infinite}
.tc .core{transform-origin:100px 100px;animation:breathe 2.6s ease-in-out infinite}
.tc .node{animation:nodeGlow 2.4s ease-in-out infinite}
.tc .node:nth-of-type(2n){animation-delay:.6s}.tc .node:nth-of-type(3n){animation-delay:1.2s}
@keyframes nodeGlow{0%,100%{opacity:.55}50%{opacity:1}}
.brew .tc .spin-slow{animation-duration:9s}.brew .tc .spin-rev{animation-duration:6s}.brew .tc .spin-fast{animation-duration:3.5s}
.brew-orb{width:240px;height:240px;position:relative}
.brew-orb::after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,var(--gold-soft),transparent 70%);filter:blur(8px);animation:breathe 2.6s ease-in-out infinite;pointer-events:none}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:converge 2.2s ease-in infinite;opacity:0}
@keyframes converge{0%{opacity:0;transform:rotate(var(--a)) translateX(150px) scale(1)}15%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(0) scale(.2)}}
.exchange{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 14px;font-size:14px;color:var(--ink-2)}
.exchange b{font-family:var(--display);font-size:20px;color:var(--ink)}
.exchange .arrow{color:var(--gold);font-size:20px}

/* ── Equivalent exchange line in the composer ────────────────────────── */
.ex-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin-top:12px;position:relative}
.ex-line .give,.ex-line .get{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-weight:600}
.ex-line .give{background:var(--gold-soft);color:var(--gold)}
.ex-line .get{background:var(--green-soft);color:var(--green)}
.ex-line .eq{font-family:var(--display);font-size:18px;color:var(--muted)}
.ex-line .short{color:var(--red);font-weight:600}
.ex-line .left{color:var(--muted)}

/* ── Rank chip + profile ─────────────────────────────────────────────── */
.rank-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:border-color .2s,transform .2s var(--ease)}
.rank-chip:hover{border-color:var(--gold);transform:translateY(-1px)}
.xp-ring{width:30px;height:30px;flex:none}
.xp-ring circle{fill:none;stroke-width:3}
.xp-ring .bg{stroke:var(--surface-3)}
.xp-ring .fg{stroke:var(--gold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s var(--ease)}
.xp-ring text{font:700 11px var(--body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
@media (max-width:720px){.rank-chip span{display:none}.rank-chip{padding:3px}}
.prof-head{display:flex;gap:18px;align-items:center}
.prof-head .sig{width:96px;height:96px;flex:none}
.prof-head h3{font-size:26px}
.xp-bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 6px}
.xp-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--gold));transition:width 1.2s var(--ease)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.stat-row div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat-row b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat-row span{font-size:12px;color:var(--muted)}
@media (max-width:480px){.stat-row{grid-template-columns:repeat(2,1fr)}}

/* ── Plan & credits ─────────────────────────────────────────────────── */
.plan-now{display:flex;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(135deg,var(--gold-soft),transparent 70%)}
.plan-now .sig{width:64px;height:64px;flex:none}
.plan-now h3{font-size:22px;margin:2px 0 4px}
.cred-big{display:flex;align-items:baseline;gap:8px;margin:18px 0 6px}
.cred-big b{font-family:var(--display);font-size:44px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.cred-meter{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cred-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--green));transition:width 1s var(--ease)}
.plan-rows{display:grid;gap:2px;margin:14px 0 4px}
.plan-rows div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-rows div span:last-child{color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.plan-tile{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.plan-tile.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.plan-tile h4{font-size:17px;margin:0}
.plan-tile .price{font-family:var(--display);font-size:28px;line-height:1.1}
.plan-tile .price span{font-family:var(--body);font-size:13px;color:var(--muted)}
.plan-tile ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);display:grid;gap:3px;flex:1}
.plan-tile .acts{display:grid;gap:6px;margin-top:6px}
.badge-cur{font-size:12.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.sec-h{font-size:18px;margin:26px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ── Admin ──────────────────────────────────────────────────────────── */
.adm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}
.adm-stats div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.adm-stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.adm-stats span{font-size:12px;color:var(--muted)}
@media (max-width:480px){.adm-stats{grid-template-columns:repeat(2,1fr)}}
.acct{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--surface)}
.acct + .acct{margin-top:10px}
.acct-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.acct-top b{font-size:16px}
.acct .pills{display:flex;gap:6px;flex-wrap:wrap}
.acct .comp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acct .comp-row .select{width:auto;flex:1 1 120px;padding:8px 10px}
.grant{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.grant span{min-width:0;overflow-wrap:anywhere}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--surface);position:relative;overflow:hidden}
.badge .sig{width:52px;height:52px;margin:0 auto 6px;opacity:.35;filter:grayscale(1)}
.badge b{display:block;font-size:13.5px;line-height:1.25}
.badge small{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.badge .bp{height:4px;border-radius:99px;background:var(--surface-3);margin-top:8px;overflow:hidden}
.badge .bp i{display:block;height:100%;background:var(--gold)}
.badge.earned{border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:linear-gradient(160deg,var(--gold-soft),transparent 70%)}
.badge.earned .sig{opacity:1;filter:none}
.strength{border:1px solid var(--line);border-radius:14px;padding:14px;margin:18px 0}
.strength .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.strength .meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0}
.strength .meter i{display:block;height:100%;background:var(--green);transition:width 1s var(--ease)}

/* ── Unlock celebration ──────────────────────────────────────────────── */
.unlock{position:fixed;inset:0;z-index:96;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--ground) 78%,transparent);backdrop-filter:blur(6px);animation:fade .3s ease both;cursor:pointer}
.unlock.closing{animation:fadeOut .3s ease both}
.unlock-card{text-align:center;max-width:380px;animation:unlockPop .6s var(--ease) both}
@keyframes unlockPop{0%{opacity:0;transform:scale(.7) rotate(-6deg)}60%{opacity:1;transform:scale(1.05) rotate(1deg)}100%{transform:none}}
.unlock-card .sig{width:170px;height:170px;margin:0 auto 18px;filter:drop-shadow(0 0 24px var(--gold))}
.unlock-card .eyebrow{color:var(--gold)}
.unlock-card h2{font-size:32px;margin:8px 0}
.unlock-card p{color:var(--ink-2)}
.burst{position:fixed;left:50%;top:45%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--gold);pointer-events:none;z-index:97;animation:burst 1.2s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d))}}
.posted-plats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
/* setup review + knowledge (2026-10-09) */
.sheet.wide{width:min(920px,100vw)}
.lede-sm{margin:0;font-size:14.5px;color:var(--ink-2)}
.review{gap:22px}
.rv-sec,.kb-group{margin:0;padding:18px 0 0;border:0;border-top:1px solid var(--line);background:none;box-shadow:none}
.rv-sec{display:grid;gap:14px}
.rv-sec h3,.kb-group h3{font-family:var(--display);font-size:18px;font-weight:600;margin:0}
.look-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.look-grid{grid-template-columns:1fr}}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;cursor:pointer;color:var(--ink-2);font:inherit;font-size:13px}
.pick .pick-none{padding:0 14px;height:64px}
.pick .pick-img{width:64px;height:64px;padding:4px;background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface-3) 0 50%) 50%/12px 12px}
.pick .pick-img img{width:100%;height:100%;object-fit:contain;display:block}
.pick button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.find-list{display:grid;gap:8px}
.find-row{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);cursor:pointer}
.find-row input{margin-top:4px;accent-color:var(--gold);flex:none;width:16px;height:16px}
.find-main,.kb-main{display:grid;gap:3px;min-width:0}
.find-main b,.kb-main b{font-weight:600;font-size:14.5px}
.find-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.find-date{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.find-ev{font-size:12.5px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.tag.green{color:var(--green);background:var(--green-soft)}
.tag.red{color:var(--red);background:var(--red-soft)}
.tag.blue{color:var(--blue);background:var(--blue-soft)}
.kb-stats{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.kb-stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.kb-stats .btn{margin-left:auto}
.chip.static{cursor:default}
.chip .up{color:var(--green);font-weight:600}.chip .down{color:var(--red);font-weight:600}
.kb-add{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px}
@media(max-width:560px){.kb-add{grid-template-columns:1fr 1fr}.kb-add #kbText{grid-column:1/-1;order:-1}}
.kb-group{display:grid;gap:8px}
.kb-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 8px 10px 12px;background:var(--surface-2)}
.kb-row.pinned{border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.kb-main{flex:1}
.kb-meta{font-size:12px;color:var(--muted)}
.kb-acts{display:flex;gap:2px;flex:none}
.kb-acts .icon-btn{width:32px;height:32px;font-size:15px}
.model-seg{margin-right:6px}
.model-seg button{padding:6px 10px;font-size:12.5px}
.model-seg small{margin-left:4px;font-size:11px;color:var(--muted);font-weight:600}
.rd-cost{color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* ── Together: the user brings the materials and breaks the seal (2026-10-10) ── */
.materials{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--ink-2)}
.materials .lbl{font-weight:600;color:var(--ink);margin-right:2px}
.materials .mat{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:99px;padding:4px 11px;color:var(--muted)}
.materials .mat.on{border-style:solid;border-color:color-mix(in srgb,var(--green) 45%,var(--line));color:var(--ink);background:var(--green-soft)}
.materials .mat.on::before{content:"✓";color:var(--green);font-weight:700}
.post.sealed .media img{filter:blur(16px) saturate(.5);transform:scale(1.06)}
.post.sealed .caption,.post.sealed .tags,.post.sealed .post-idea{filter:blur(4px);opacity:.6;user-select:none}
.post.sealed .post-actions,.post.sealed [data-pr]{opacity:.45;pointer-events:none}
.seal-veil{position:absolute;inset:0;z-index:3;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:24px;background:color-mix(in srgb,var(--ground) 62%,transparent);color:var(--ink);transition:opacity .5s ease}
.seal-veil b{font-family:var(--display);font-size:20px}
.seal-veil small{font-size:13px;color:var(--ink-2);max-width:240px;line-height:1.45}
.seal-veil .btn{margin-top:6px}
.seal-sig{width:86px;height:86px;color:var(--gold);filter:drop-shadow(0 0 14px color-mix(in srgb,var(--gold) 45%,transparent));transition:transform .6s ease,opacity .6s ease}
.seal-sig svg{width:100%;height:100%;animation:finspin 24s linear infinite}
.post.revealing .seal-veil{opacity:0;pointer-events:none}
.post.revealing .seal-sig{transform:scale(2.4);opacity:0}
.post.revealing .media img,.post.revealing .caption,.post.revealing .tags,.post.revealing .post-idea{filter:none;opacity:1;transform:none;transition:filter .7s ease,opacity .7s ease,transform .7s ease}
.seal-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px;padding:12px 16px;border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));border-radius:14px;background:var(--gold-soft);font-size:14px}
.seal-bar b{font-weight:600}
.seal-bar .btn{margin-left:auto}
.xp-gain{position:fixed;z-index:120;pointer-events:none;font:700 13px/1 var(--body,inherit);color:var(--gold-ink);background:var(--gold);border-radius:99px;padding:6px 11px;box-shadow:0 8px 24px -10px var(--gold);animation:xpUp 1.8s ease forwards}
@keyframes xpUp{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
@media (prefers-reduced-motion:reduce){.seal-sig svg{animation:none}.xp-gain{animation:none}.post.revealing .seal-sig{transform:none}}
.funnel .fn-row{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr 44px minmax(90px,auto);gap:10px;align-items:center;padding:5px 0;font-size:14px;font-variant-numeric:tabular-nums}
.funnel .fn-bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.funnel .fn-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--green))}

    .then((r) => { if (r.ok) saveSession(r.session); return r; })
    .catch(() => ({ ok: false, rejected: false }))
    .finally(() => { refreshInFlight = null; });
  return refreshInFlight;
}
const tokenExpiringSoon = () => !!(session && session.expires_at && session.expires_at < Date.now() + TOKEN_MARGIN_MS);
function scheduleRefresh() {
  if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
  if (!session || !session.expires_at) return;
  const due = Math.max(15000, session.expires_at - Date.now() - TOKEN_MARGIN_MS);
  refreshTimer = setTimeout(async () => {
    const r = await refreshSessionOnce();
    if (r.ok) { scheduleRefresh(); return; }
    if (r.rejected) { sessionExpired(); return; }
    refreshTimer = setTimeout(scheduleRefresh, 30000);
  }, due);
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !session || !tokenExpiringSoon()) return;
  const r = await refreshSessionOnce();
  if (r.ok) scheduleRefresh(); else if (r.rejected) sessionExpired();
});
function consumeAuthRedirect() {
  if (!location.hash || location.hash.indexOf('access_token') === -1) return null;
  const p = new URLSearchParams(location.hash.slice(1));
  const access_token = p.get('access_token');
  const refresh_token = p.get('refresh_token');
  const expires_in = parseInt(p.get('expires_in') || '3600', 10);
  history.replaceState(null, '', location.pathname + location.search);
  if (!access_token) return null;
  return { access_token, refresh_token, expires_at: Date.now() + expires_in * 1000, email: null };
}
function consumeAuthError() {
  const h = location.hash || '';
  if (h.indexOf('error') === -1 || h.indexOf('access_token') !== -1) return null;
  const p = new URLSearchParams(h.slice(1));
  if (!p.get('error') && !p.get('error_code') && !p.get('error_description')) return null;
  history.replaceState(null, '', location.pathname + location.search);
  return p.get('error_code') === 'otp_expired'
    ? 'That sign-in link has expired or was already used. Enter your email for a fresh one.'
    : 'That sign-in link did not work. Enter your email for a fresh one.';
}
function sessionExpired() { clearSession(); closeAllOverlays(); renderLogin('Your session ended. Sign in again to carry on.', 'err'); }
function closeAllOverlays() { while (sheetStack.length) sheetStack[sheetStack.length - 1].close(); alch.close(true); closeMenus(); }

/* ── API ─────────────────────────────────────────────────────────────── */
async function api(name, { method = 'POST', body, query } = {}) {
  if (session && tokenExpiringSoon()) {
    const r = await refreshSessionOnce();
    if (r.ok) scheduleRefresh(); else if (r.rejected) { sessionExpired(); throw Object.assign(new Error('Your session ended.'), { status: 401 }); }
  }
  const url = FN(name) + (query ? '?' + new URLSearchParams(query).toString() : '');
  let res;
  try {
    res = await fetch(url, {
      method,
      headers: Object.assign(body ? { 'Content-Type': 'application/json' } : {}, authHeaders()),
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    throw Object.assign(new Error("Couldn't reach the server. Check your connection and try again."), { status: 0 });
  }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = Object.assign(new Error(friendlyGate(j.error) || `Something went wrong (${res.status}).`), { status: res.status, body: j });
    if (res.status === 401) sessionExpired();
    throw err;
  }
  return j;
}

/* ── Terms (2026-10-10) ────────────────────────────────────────────────
   Clickwrap: every signed-in user accepts the current Terms + Privacy Policy
   once per version, recorded in cc_terms_acceptance. Closing the sheet
   without agreeing signs out. If the check itself fails we let the app open
   rather than lock everyone out. */
const TERMS_VERSION = '2026-10-25';
async function termsRpc(fn, args) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()), body: JSON.stringify(args) });
  if (!r.ok) throw new Error('terms check failed');
  return r.json();
}
// An RPC whose error message is meant for the user.
async function rpc(fn, args) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()), body: JSON.stringify(args) });
  const j = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error((j && j.message) || 'That didn’t save. Try again.'); e.status = r.status; throw e; }
  return j;
}
async function termsGate() {
  try { if (await termsRpc('cc_terms_status', { p_version: TERMS_VERSION }) === true) return true; } catch (_e) { return true; }
  return new Promise((resolve) => {
    let agreed = false;
    const s = openSheet({
      title: 'Before you start', dialog: true,
      body: `<div class="stack terms-gate">
        <p>Fullmedia Alchemist reads the websites, logos, mascots, photos and other brand material you give it, and uses them to write and design your posts.</p>
        <p class="small muted">Please read the <a href="/terms/" target="_blank" rel="noopener">Terms</a> and <a href="/privacy/" target="_blank" rel="noopener">Privacy Policy</a>. The short version: you only add brands you own or are allowed to use, you check posts before they go out, and you can ask us to delete your brands and account at any time.</p>
        <label class="check-row"><input type="checkbox" id="tgAgree"><span>I agree to the Terms and Privacy Policy, and I confirm I own, or have permission to use, every brand name, logo, mascot, image and piece of content I add.</span></label>
      </div>`,
      foot: `<span class="msg"></span><button type="button" class="btn btn-gold" id="tgOk">Agree and continue</button>`,
      onClose: () => { if (!agreed) { clearSession(); renderLogin('You need to agree to the Terms to use the app.', 'err'); resolve(false); } },
    });
    s.el.querySelector('#tgOk').onclick = async () => {
      if (!s.el.querySelector('#tgAgree').checked) return s.msg('Tick the box to agree.', 'err');
      const b = s.el.querySelector('#tgOk'); b.disabled = true;
      try { await termsRpc('cc_terms_accept', { p_version: TERMS_VERSION, p_user_agent: navigator.userAgent }); agreed = true; s.close(); resolve(true); }
      catch (_e) { b.disabled = false; s.msg('That didn’t save. Please try again.', 'err'); }
    };
  });
}

function renderLogin(msg = '', kind = '') {
  hideAlchFab();
  $('#app').innerHTML = `
    <div class="login">
      <div class="card login-card">
        <img src="/assets/logo-mark.svg" alt="">
        <h1>Fullmedia <em style="color:var(--gold)">Alchemist</em></h1>

        <form id="loginForm" novalidate>
          <div class="field"><label for="loginEmail">Email</label>
            <input class="input" id="loginEmail" type="email" autocomplete="email" placeholder="you@company.com" required></div>
          <button class="btn btn-gold btn-lg" id="loginBtn" type="submit">Send my sign-in link</button>
          <p class="small muted login-legal">By continuing you agree to the <a href="/terms/" target="_blank" rel="noopener">Terms</a> and <a href="/privacy/" target="_blank" rel="noopener">Privacy Policy</a>.</p>
          <div class="login-msg" id="loginMsg"></div>
        </form>
      </div>
    </div>`;
  const m = $('#loginMsg'); m.textContent = msg; m.className = 'login-msg ' + kind;
  const q = new URLSearchParams(location.search).get('email'); if (q) $('#loginEmail').value = q;
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('#loginEmail').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { m.textContent = 'That doesn’t look like an email address.'; m.className = 'login-msg err'; return; }
    const btn = $('#loginBtn'); btn.disabled = true; m.textContent = 'Sending…'; m.className = 'login-msg';
    try {
      // 2026-10-09: Auth reads the return address from the redirect_to query
      // parameter (the body's options.emailRedirectTo is a supabase-js name it
      // ignores). It also tells the themed email hook this is an Alchemist
      // sign-in; signup_app marks new accounts made here.
      const res = await fetch(SUPABASE_URL + '/auth/v1/otp?redirect_to=' + encodeURIComponent(location.origin + '/dashboard/'), {
        method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, create_user: true, data: { signup_app: 'alchemist', fma_sid: (function () { try { return sessionStorage.getItem('fma-sid') || ''; } catch (_e) { return ''; } })(), terms_version: TERMS_VERSION, terms_shown_at: new Date().toISOString() }, options: { emailRedirectTo: location.origin + '/dashboard/' } }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        const code = body.error_code || body.code || '';
        if (code === 'email_address_invalid' || /is invalid/i.test(body.msg || '')) throw new Error('We couldn’t send a sign-in email to that address. Check it, or use a different email.');
        // 2026-10-09: tell the two limits apart. A per-address cooldown means a
        // link was just sent; the project-wide cap is ours, not the user's.
        const secs = ((body.msg || '').match(/after (\d+) seconds?/i) || [])[1];
        if (secs || code === 'over_request_rate_limit') throw new Error(`A sign-in link was just sent to ${email} — check your inbox and spam folder. You can ask for another in ${secs || 60} seconds.`);
        if (code === 'over_email_send_rate_limit' || res.status === 429) throw new Error('Our sign-in emails are busy right now. If a link already came through, use that one; otherwise try again in a few minutes.');
        throw new Error(body.error_description || body.msg || 'Could not send the link.');
      }
      m.textContent = `Check ${email} — the link signs you straight in.`; m.className = 'login-msg ok';
    } catch (err) { m.textContent = err.message; m.className = 'login-msg err'; }
    finally { btn.disabled = false; }
  };
}

    api('list-campaigns', { method: 'GET', query: { brand } }).catch(() => ({ campaigns: [] })),
  ]);
  S.brandData = bd;
  applyFreeDefaults();
  S.posts = (bd.posts || []).filter((p) => String(p.status || '').toLowerCase() !== 'archived');
  S.campaigns = (camps.campaigns || []).filter((c) => String(c.status || '').toLowerCase() !== 'archived');
  // 2026-10-11: Brad: "the calendar is showing old content that was deleted".
  // Posts of archived campaigns (and old posts with no campaign) are kept in
  // the database but leave the app: calendar, reminders, export, quests.
  { const live = new Set(S.campaigns.map((c) => c.id)); S.posts = S.posts.filter((p) => p.campaign_id && live.has(p.campaign_id)); }
  // 2026-10-12: captions saved for one network (Captions for each account).
  S.platCopy = await termsRpc('cc_platform_copy_get', { p_brand: brand }).catch(() => ({})) || {};

  S.mentions = (await termsRpc('cc_mentions_get', { p_brand: brand }).catch(() => null)) || { campaigns: {}, posts: {} };
  // 2026-10-13: campaigns whose accounts were picked on purpose (a subset of

  { const ch = await termsRpc('cc_campaigns_platforms_chosen', { p_brand: brand }).catch(() => []); S.campChosen = new Set(Array.isArray(ch) ? ch : []); }

async function createBrandRecord(name, extra, clientId) {

        if (!ok) throw Object.assign(new Error('cancelled'), { cancelled: true });

  // 2026-10-29: a website and a name are all that is asked. The scan runs, and

/* ── Making posts in the background (2026-10-29) ─────────────────────────
   Brad, on his phone: the screen went dark mid-batch and the posts were not made, 3 or 4 tries each time.
   Making posts used to be one long request from this page, so a sleeping phone, a closed tab or a shut laptop
   killed it. Now the page only STARTS the job (alchemist-generate) and the server does the work, so closing
   everything changes nothing. The page asks "done yet?" every few seconds, asks again the moment the phone
   wakes up, and after a reload it picks the job up again (resumeGenJob). If the new function isn't there,
   it falls back to the old direct request. */
const GEN_JOB_KEY = 'ccb-gen-job';
function genJobSave(o) { try { if (o) localStorage.setItem(GEN_JOB_KEY, JSON.stringify(o)); else localStorage.removeItem(GEN_JOB_KEY); } catch (e) {} }
function genJobLoad() { try { return JSON.parse(localStorage.getItem(GEN_JOB_KEY) || 'null'); } catch (e) { return null; } }

  return new Promise((res) => {
    let done = false; const fin = () => { if (done) return; done = true; clearTimeout(t); document.removeEventListener('visibilitychange', h); window.removeEventListener('online', fin); res(); };
    const h = () => { if (!document.hidden) fin(); };

async function genWait(jobId) {

      catch (e) { if (e.status === 401) throw e; if (e.status === 404) { genJobSave(null); throw Object.assign(new Error('That batch could not be found. Check the campaign, then try again.'), { status: 404 }); } r = null; /* a network blip or a sleeping phone: keep waiting */ }

async function resumeGenJob() {
  const j = genJobLoad(); if (!j || !j.id) return;

  if (window.__genWaiting === j.id) return;

   How can I easily give the links to each event, and description of each

   and description. "Read" asks read-event-link to draft the description

const MAX_ITEMS = 10;
const URL_IN_LINE = /(https?:\/\/[^\s]+|\b(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+\/[^\s]*)/i;
const LINK_USES = [['', 'Let the Alchemist decide'], ['event', 'Upcoming event'], ['news', 'News story to include'], ['replicate', 'Make something like this'], ['product', 'Product, place or offer'], ['background', 'Background only']];
const LINK_USE_HINT = { '': 'The Alchemist works out what the page is.', event: 'Uses the name, date and place, and times the post for the event.', news: 'Reports the facts and credits the source. Past dates are fine.', replicate: 'Copies the format, structure and tone, in your brand\u2019s style. Never the wording or images.', product: 'Uses the real details and benefits. Nothing invented.', background: 'Informs the facts. Not featured or linked.' };
function newItem(o = {}) { return { link: o.link || '', date: o.date || '', brief: o.brief || '', extra: o.extra || '', note: '', noteKind: '', warn: '', sendTo: !!o.sendTo, use: o.use || '' }; }
function parseItemLines(text) {
  return String(text || '').split(/\n+/).map((l) => l.trim()).filter(Boolean).map((line) => {
    const m = line.match(URL_IN_LINE);
    const link = m ? m[1].replace(/[),.;]+$/, '') : '';
    const brief = (m ? line.replace(m[1], '') : line).replace(/^[\s\-–—•*·|:,]+|[\s\-–—•*·|:,]+$/g, '').trim();
    // Text next to a link is kept as a note and added to what the page says.
    return link ? newItem({ link, extra: brief }) : newItem({ brief });

}

const CAMP_FILTERS = [['all', 'All'], ['finishing', 'Finishing'], ['due', 'Due soon'], ['draft', 'Needs review'], ['ready', 'Ready to post'], ['partial', 'Partly posted'], ['complete', 'Complete']];
function campMatches(c, f) {
  if (f === 'all') return true;
  const posts = postsFor(c.id);
  const complete = posts.length > 0 && posts.every((p) => stageOf(p)[0] === 'Posted' && allPosted(p));
  if (f === 'complete') return complete;
  if (f === 'finishing') return posts.some(isFinishing);
  if (f === 'due') return posts.some(isDueSoon);
  if (f === 'draft') return posts.some((p) => isDraft(p) && !isFinishing(p));
  if (f === 'ready') return posts.some((p) => stageOf(p)[0] === 'Ready to post');
  // out on some posts or some accounts, but not everything yet
  if (f === 'partial') return !complete && posts.some((p) => postMatches(p, 'partial') || postMatches(p, 'posted'));
  return true;
}

  if (!counts[S.campFilter]) S.campFilter = 'all';
  const shown = camps.filter((c) => campMatches(c, S.campFilter));

  const fmt = isCar(comp.format) ? `${carN(comp.format)}-slide carousels` : { single: 'one image each', mixed: 'mixed slides' }[comp.format] || 'mixed slides';
  const li = $('#compLink'); const h = li ? hostOf(normalizeUrl(li.value)) : '';
  const n = compCount();
  el.textContent = comp.listOn
    ? `${n} post${n === 1 ? '' : 's'} from your list · ${fmt}`
    : `${n} post${n === 1 ? '' : 's'} · ${fmt}${h ? ' · → ' + h : ''}`;
  const ex = $('#exLine'); if (ex) ex.innerHTML = n ? exchangeHtml(n, comp.format) : '<span class="left">Add at least one item to the list.</span>';
  paintMaterials();
  const st = $('#cntStep'); if (st) st.hidden = comp.listOn;
  const cl = $('#cntList'); if (cl) { cl.hidden = !comp.listOn; cl.textContent = `${n} from your list`; }
}
function paintCompList() {
  const box = $('#compList'); if (!box) return;
  const t = $('#plistToggle');
  if (t) { t.textContent = '☰ ' + (comp.listOn ? 'Back to one brief for all posts' : 'One post per event, product or link'); t.setAttribute('aria-expanded', String(comp.listOn)); }
  const pr = $('#compPrompt');
  if (pr) pr.placeholder = comp.listOn
    ? 'What ties these posts together? e.g. Five Halloween events worth a spin this month — pick one with friends.'
    : 'e.g. Our autumn menu launches Oct 20 — pumpkin cold brew and two new pastries. Get people in for opening weekend.';
  if (!comp.listOn) { box.innerHTML = ''; optSummary(); return; }
  if (!comp.items.length) comp.items.push(newItem());
  mountPostList(box, comp.items, optSummary);
  optSummary();
}
function wireComposer(prefill) {
  const seg = $('#fmtSeg');
  const paintFmt = () => { paintFmtField(seg.parentElement, comp.format); optSummary(); };
  wireFmtField(seg.parentElement, () => comp.format, (f) => { comp.format = f; paintFmt(); });
  paintFmt();
  const out = $('#cnt');
  $('#cntMinus').onclick = () => { comp.count = Math.max(1, comp.count - 1); out.textContent = comp.count; optSummary(); };
  $('#cntPlus').onclick = () => { comp.count = Math.min(10, comp.count + 1); out.textContent = comp.count; optSummary(); };
  const cl2 = $('#compLink'); if (cl2) cl2.addEventListener('input', optSummary);
  $$('#compPlats .chip').forEach((c) => c.onclick = () => c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'));
  $('#ideasBtn').onclick = () => loadIdeas();
  $('#topBtn').onclick = () => openTopReview();
  $('#recapNew').onclick = () => openRecap({});
  $('#plistToggle').onclick = () => { comp.listOn = !comp.listOn; paintCompList(); if (comp.listOn) { const f = $('#compList .pitem-link'); if (f) f.focus(); } };
  paintCompList();
  comp.endState = {}; wireEndingField({}, $('#compFine'), comp.endState, 'cp');
  $('#compGo').onclick = () => createCampaignFromComposer();
  $('#compPrompt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) createCampaignFromComposer(); });
  if (prefill) $('#compPrompt').value = prefill;
}

async function loadIdeas() {
  const box = $('#ideas');
  box.innerHTML = `<div class="ideas">${'<div class="idea"><div class="skel" style="height:18px;width:70%;margin-bottom:10px"></div><div class="skel" style="height:44px"></div></div>'.repeat(3)}</div>`;
  try {
    const r = await api('alchemist-assist', { body: { mode: 'ideas', brand: S.brand } });
    box.innerHTML = `<div class="ideas">${r.ideas.map((i, n) => `<button type="button" class="idea" style="animation-delay:${n * 70}ms" data-n="${n}"><b>${esc(i.title)}</b><span>${esc(i.prompt)}</span><em>${esc(i.why)}</em></button>`).join('')}</div>`;
    $$('.idea', box).forEach((el) => el.onclick = () => openStartIdea(r.ideas[+el.dataset.n]));
    return r.ideas;
  } catch (e) {
    box.innerHTML = '';

  }

// The campaign name is drawn on every card as the eyebrow, so it must read
// like a title, not the first words of an instruction ("Show three ways...").
function nameFromPrompt(p) {
  let t = String(p).split(/[\n.!?:;—–]/)[0].trim();
  t = t.replace(/^(please\s+)?(make|create|write|show|post|posts|share|promote|announce|tell (people|everyone|followers)( about)?|get people (to|in for)|let people know( about)?|i want( to)?|we want( to)?|help (me|us)( to)?|do|a campaign (about|for)|campaign (about|for)|content (about|for)|posts? (about|for|on))\s+/i, '');
  t = t.replace(/^(about|for|on|that|how)\s+/i, '');
  t = t.split(/\s+(?:to|so|so that|because|and then|which|that|for|with|by)\s+/i)[0];
  let words = t.split(/\s+/).filter(Boolean);
  if (words.length > 5) words = words.slice(0, 5);
  while (words.length > 1 && /^(the|a|an|of|and|or|in|on|at|to|for|with|our|your|my)$/i.test(words[words.length - 1])) words.pop();
  const n = words.join(' ').slice(0, 48);
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : 'New campaign';
}
function slidesParam(fmt) { return fmt === 'single' ? 1 : isCar(fmt) ? carN(fmt) : 'mixed'; }
/* 2026-10-14: a carousel is 2, 3 or 4 slides ('carousel2'..'carousel4'; plain 'carousel' = 3). */
function isCar(f) { return /^carousel/.test(String(f || '')); }
function carN(f) { const n = parseInt(String(f || '').replace('carousel', ''), 10); return n >= 2 && n <= 4 ? n : 3; }
function carNHtml() { return '<div class="seg car-n" data-carn role="group" aria-label="Slides in each carousel" hidden><button type="button" data-n="2">2 slides</button><button type="button" data-n="3">3 slides</button><button type="button" data-n="4">4 slides</button></div>'; }
function paintFmtField(field, fmt) {
  if (!field) return;
  $$('[data-f]', field).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === 'carousel' ? isCar(fmt) : b.dataset.f === fmt)));
  const cn = $('[data-carn]', field);
  if (cn) { cn.hidden = !isCar(fmt); $$('[data-n]', cn).forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.n === carN(fmt)))); }
}
function wireFmtField(field, get, set) {
  if (!field) return;
  let last = carN(get());   // the carousel size comes back after picking One image or Mixed
  $$('[data-f]', field).forEach((b) => b.onclick = () => set(b.dataset.f === 'carousel' ? 'carousel' + last : b.dataset.f));
  $$('[data-carn] [data-n]', field).forEach((b) => b.onclick = () => { last = +b.dataset.n; set('carousel' + last); });
}

async function createCampaignFromComposer() {
  const prompt = $('#compPrompt').value.trim();
  let link = normalizeUrl($('#compLink').value);
  const msg = $('#compMsg');
  const err = (t) => { msg.innerHTML = '<div class="notice bad" style="margin-top:14px"></div>'; msg.firstChild.textContent = t; };
  $$('.field-warn').forEach((x) => x.remove());
  const under = (el, t) => { const d = document.createElement('div'); d.className = 'field-warn'; d.textContent = t; el.insertAdjacentElement('afterend', d); el.focus(); };
  msg.innerHTML = '';
  const useList = comp.listOn && comp.items.length > 0;
  if (comp.listOn && !comp.items.length) return err('Add at least one item to the list, or switch back to one brief for all posts.');
  if (prompt.length < 8) return under($('#compPrompt'), useList ? 'Add a line that ties the posts together — e.g. "Halloween events worth a spin this month".' : 'Tell me what the posts are about — a sentence or two is plenty.');
  if (useList) { const pb = await itemsProblem(comp.items, link, (t) => { msg.innerHTML = '<div class="notice" style="margin-top:14px"></div>'; msg.firstChild.textContent = t; }); if (pb) { msg.innerHTML = ''; return pb === ITEM_INLINE ? undefined : err(pb); } msg.innerHTML = ''; }
  if (!link && !(useList && comp.items.every((it) => normalizeUrl(it.link)))) {
    $('#compLink').classList.add('err');
    return under($('#compLink'), 'Add the link these posts should send people to.');
  }
  $('#compLink').classList.remove('err');
  let start = $('#compStart').value || todayYmd();
  const lastEvent = useList ? comp.items.map((it) => it.date).filter(Boolean).sort().pop() : '';
  let end = $('#compEnd').value || (lastEvent && lastEvent > start ? lastEvent : addDaysYmd(start, Math.max(14, compCount() * 3)));
  if (end < start) return err('Check the dates — the finish date needs to be after the start.');
  let plats = $$('#compPlats .chip[aria-pressed="true"]').map((c) => c.dataset.p);
  if (!plats.length) return err('Pick at least one platform.');
  const tags = normTags($('#compTags').value).split(' ').filter(Boolean);
  // 2026-10-14: Brad: "no templates, 0 templates". The old card-style picker
  // is gone; every post gets its own design (your own uploaded template is
  // the only fixed look).
  const scene = '';
  const loc = $('#compLoc').value.trim();
  const locCard = $('#compLocCard').checked;
  const compResOn = readResearch('compRes');
  const compAssetIds = readAssetIds('compAssets');
  const compEndS = endingFromState($('#compFine'), comp.endState || {}, 'cp');
  if (compEndS.error) return err(compEndS.error);
  let count = compCount();
  let cost = costOf(count, comp.format);
  const left = creditsLeft();
  { const sm0 = shortText(cost); if (sm0) return err(sm0); }
  const sl = campSlots();
  if (sl && sl.limit != null && sl.running.length >= sl.limit) {
    msg.innerHTML = campLimitNotice(sl);
    wireCampSlots(msg, sl, () => { msg.innerHTML = '<div class="notice ok" style="margin-top:14px">A slot is free. Press Transmute again.</div>'; });
    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const btn = $('#compGo'); btn.disabled = true;
  const b = brew('Transmuting', [
    'Reading your request…', 'Reading your brand…', 'Choosing a different angle for each post…', 'Writing captions…',
    'Picking 4–5 hashtags each…', 'Checking for filler and fixing it…', 'Designing the images…', 'Adding your link and QR code…', 'Almost there…',
  ], 'Takes about a minute. Keep this tab open.', { give: `${materialsShort()} + ✦ ${cost}`, get: `${count} post${count === 1 ? '' : 's'}` });
  let campaign = null;
  try {
    // 2026-10-11: read the request first -- how many posts, which days, which
    // link, which platforms -- so what the user asked for is what gets made.
    let title = nameFromPrompt(prompt);
    let plan = null;
    if (!useList) plan = await readRequest(prompt, link, count, plats);
    if (plan) {
      if (plan.title) title = plan.title;
      if (plan.post_count && plan.post_count !== count) {
        count = plan.post_count; cost = costOf(count, comp.format);
        if (shortText(cost)) throw Object.assign(new Error(`You asked for ${count} posts. ` + shortText(cost)), { planStop: true });
      }
      if (plan.post_dates && plan.post_dates.length) {
        if (plan.post_dates[0] < start) start = plan.post_dates[0];
        const lastD = plan.post_dates[plan.post_dates.length - 1];
        if (lastD > end) end = lastD;
      }
      if (plan.platforms && plan.platforms.length) plats = plan.platforms;
      if (plan.link) link = plan.link;
      if (planBriefs(plan).length && planBriefs(plan).length !== count) {
        count = planBriefs(plan).length; cost = costOf(count, comp.format);
        if (shortText(cost)) throw Object.assign(new Error(`That makes ${count} posts. ` + shortText(cost)), { planStop: true });
      }
      b.update({ give: `${materialsShort()} + ✦ ${cost}`, get: `${count} post${count === 1 ? '' : 's'}`});
    } else {
      try {
        const tr = await Promise.race([api('alchemist-assist', { body: { mode: 'title', brand: S.brand, prompt } }), sleep(7000).then(() => null)]);
        if (tr && tr.title) title = tr.title;
      } catch (e) { if (e.status === 401) throw e; }
    }
    const compTone = $('#compTone') ? $('#compTone').value : '';
    const compCapLen = $('#compCapLen') ? $('#compCapLen').value : '';
    const c = await api('create-campaign', { body: {
      brand: S.brand, name: title, goal: prompt.slice(0, 500),
      startDate: start, endDate: end, targetPlatforms: plats, targetContentCount: count,
      sourceNotes: prompt, requiredLink: link || null, requiredHashtags: tags,
      ...(compTone ? { tone: compTone } : {}), ...(compCapLen ? { captionLength: compCapLen } : {}),
    } });
    campaign = c.campaign;
    if (compEndS.set && compEndS.value) {
      try { await api('alchemist-edit', { body: { action: 'update_campaign', brand: S.brand, campaignId: campaign.id, fields: { ending: compEndS.value } } }); campaign.ending_slide = compEndS.value; }
      catch (e) { if (e.status === 401) throw e; toast('The campaign was made, but the ending slide could not be saved: ' + e.message + ' Add it in Edit campaign.', 'err', 9000); }
    }
    if (brandPlatformNames()) await termsRpc('cc_campaign_set_platforms', { p_campaign: campaign.id, p_platforms: plats }).catch(() => {});
    // First link a brand uses becomes its default, so the next campaign is prefilled.
    if (link && !(S.brandData && S.brandData.default_wheel_url)) {
      api('update-brand-settings', { body: { brand: S.brand, defaultWheelUrl: link, ...(brandPlatformNames() ? {} : { defaultPlatforms: plats }) } }).catch(() => {});
    }
    const toneInstr = [toneInstruction(compTone), captionLengthInstruction(compCapLen)].filter(Boolean);
    const baseInstr = plan ? (plan.instructions || []) : [];
    const g = await genApi('generate-campaign-content', { body: {
      brand: S.brand, campaignId: campaign.id, count, slidesPerPost: slidesParam(comp.format), model: curModel(),
      template: scene, locationTag: loc, includeLocationTag: locCard,
      ...(useList ? { postBriefs: itemsPayload(comp.items) } : planBriefs(plan).length ? { postBriefs: planBriefs(plan) } : {}),
      userRequest: prompt, feedKind: 'brief', today: todayYmd(),
      ...researchParam('compRes'), ...assetParam('compAssets'),
      includeQr: !!($('#compQr') ? $('#compQr').checked : qrDefault()), artStyle: $('#compArt') ? $('#compArt').value : '',
      ...(compTone ? { tone: compTone } : {}), ...(compCapLen ? { captionLength: compCapLen } : {}),
      ...(plan ? { postDates: plan.post_dates || [], instructions: [...baseInstr, ...toneInstr], planHeard: plan.heard || '' } : toneInstr.length ? { instructions: toneInstr } : {}),
    } });
    if (useList) { comp.items = []; comp.listOn = false; }
    b.stop(true);
    researchToast(g);
    sealPosts(g.skus);
    if (g.scenes_queued) markFinishing(g.skus);
    if (campaign.ending_slide && g.skus && g.skus.length) { try { await applyEnding(campaign, g.skus); } catch (e) { if (e.status === 401) throw e; } }
    await loadBrand(S.brand); setBrandChrome();
    openCampaign(campaign.id);
    const failed = g.media_failed ? ` ${g.media_failed} image${g.media_failed === 1 ? '' : 's'} didn’t render — use Redo on those posts.` : '';
    const spent = g.credits_used != null ? g.credits_used : cost;
    toast(`Your transmutation worked: ✦ ${spent} credit${spent === 1 ? '' : 's'} → ${g.created} post${g.created === 1 ? '' : 's'}${g.scenes_queued ? '. The pictures are still in the crucible — reveal each post as it finishes (about a minute).' : '. Break the seals to reveal them.'}${failed ? failed + ' Those credits were returned.' : ''}`, failed ? 'info' : 'ok', 8000);
    loadProgress(true);
  } catch (e) {
    b.stop(false);
    btn.disabled = false;
    if (e.status === 401) return;
    if (e.planStop) return err(e.message);
    if (campaign) {
      if (maybeStillMaking(e) && await postsAppeared(campaign.id, 0, 4)) {
        setBrandChrome(); openCampaign(campaign.id);
        toast(STILL_MAKING_TOAST, 'ok', 8000);
        loadProgress(true);
        return;
      }
      await loadBrand(S.brand).catch(() => {});
      openCampaign(campaign.id);
      // 2026-10-14: Brad: "if it fails there needs to be a retry button."
      // Show a persistent notice with a Retry button instead of telling the
      // user to navigate to "Create more posts" manually.
      const retryParams = { notes: prompt, count, fmt: comp.format,
        items: useList ? comp.items.slice() : null, cost,
        artStyle: $('#compArt') ? $('#compArt').value : '',
        includeQr: !!($('#compQr') ? $('#compQr').checked : qrDefault()),
        locationTag: loc, includeLocationTag: locCard,
        research: compResOn, assetIds: compAssetIds };
      const nb = document.createElement('div');

      nb.innerHTML = '<span style="flex:1;min-width:200px"></span><button type="button" class="btn btn-sm btn-gold" id="retryPosts">' + icons.spark + ' Retry</button><button type="button" class="btn btn-sm btn-ghost" id="retryDismiss">Dismiss</button>';
      nb.querySelector('span').textContent = 'The campaign was saved, but the posts couldn’t be made: ' + e.message;
      const campHead = $('.camp-head');
      if (campHead) campHead.after(nb);
      else $('#main').prepend(nb);
      const retryBtn = $('#retryPosts');
      const dismissBtn = $('#retryDismiss');
      if (dismissBtn) dismissBtn.onclick = () => nb.remove();
      if (retryBtn) retryBtn.onclick = async () => {
        retryBtn.disabled = true;
        dismissBtn.disabled = true;
        const ok = await runMorePosts(campaign, retryParams);
        if (ok) nb.remove();
        else { retryBtn.disabled = false; dismissBtn.disabled = false; }
      };
    } else if (/campaigns? at a time/i.test(e.message)) {
      await loadBrand(S.brand).catch(() => {});
      const sl = campSlots();
      if (sl && sl.running.length) { msg.innerHTML = campLimitNotice(sl); wireCampSlots(msg, sl, () => { msg.innerHTML = '<div class="notice ok" style="margin-top:14px">A slot is free. Press Transmute again.</div>'; }); }
      else err(e.message);
    } else err(e.message);
  }
}

<script>
'use strict';
/* ── Campaign view ───────────────────────────────────────────────────── */
// 2026-10-09: Brad: "there is no filter for 'posted' 'ready to post
// (approved)' or 'draft'." Stages now read Draft → Ready to post → Posted.
function stageOf(p) {
  const posted = PLATFORM_KEYS.some((k) => p[k + '_posted_at'] || p[k + '_post_link']);
  if (posted) return ['Posted', needsFinishing(p) ? 'bad' : 'ok'];
  // 2026-10-11: handed to a scheduler through Export -- not "due" any more;
  // once its time has passed the app asks whether it went out.
  if (typeof schedKeys === 'function' && schedKeys(p).length) return toConfirm(p).length ? ['Did it go out?', 'warn'] : ['Scheduled', 'review'];
  const a = String(p.approval_status || 'Pending').toLowerCase();
  if (a === 'approved') return ['Ready to post', 'warn'];
  if (a === 'declined') return ['Changes asked', 'bad'];
  return ['Draft', 'review'];
}
const isDraft = (p) => ['Draft', 'Changes asked'].includes(stageOf(p)[0]);
// Days from today to the post's date (negative = overdue); null if no date or already posted.
function dueIn(p) {
  if (!p.scheduled_date || stageOf(p)[0] === 'Posted' || (typeof schedKeys === 'function' && schedKeys(p).length)) return null;
  const d = new Date(String(p.scheduled_date).slice(0, 10) + 'T12:00:00');
  const t = new Date(); t.setHours(12, 0, 0, 0);
  return Math.round((d - t) / 86400000);
}
const DUE_SOON_DAYS = 3;
const isDueSoon = (p) => { const n = dueIn(p); return n != null && n <= DUE_SOON_DAYS; };
function dueLabel(p) {
  const n = dueIn(p);
  if (n == null) return '';
  if (n < -1) return `${-n} days overdue`;
  if (n === -1) return 'Was due yesterday';
  if (n === 0) return 'Due today';
  if (n === 1) return 'Due tomorrow';
  if (n <= 6) return `Due in ${n} days`;
  return '';
}
const POST_FILTERS = [['all', 'All'], ['due', 'Due soon'], ['draft', 'Draft'], ['ready', 'Ready to post'], ['sched', 'Sent to scheduler'], ['partial', 'Partly posted'], ['posted', 'Posting complete']];
function postMatches(p, f) {
  if (f === 'due') return isDueSoon(p);
  if (f === 'draft') return isDraft(p);
  if (f === 'ready') return stageOf(p)[0] === 'Ready to post';
  // 2026-10-13: complete = ticked on every account it's meant for. One still
  // with a scheduler shows under "Sent to scheduler" until it's confirmed.
  if (f === 'posted') return stageOf(p)[0] === 'Posted' && allPosted(p);
  if (f === 'sched') return schedKeys(p).length > 0;   // sent to a scheduler through Export
  if (f === 'partial') return postNotDone(p);   // out on some of its accounts, not all
  return true;
}

async function openCampaign(id) {
  S.view = 'campaign'; S.campaignId = id; saveNav();
  renderCampaign();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderCampaign() {
  loadOwnSocials();
  const c = S.campaigns.find((x) => x.id === S.campaignId);
  const main = $('#main');
  if (!c) { goHome(); return; }
  const posts = postsFor(c.id).sort((a, b) => String(a.scheduled_date || '').localeCompare(String(b.scheduled_date || '')));
  const link = (posts.find((p) => p.content_link) || {}).content_link || (S.brandData && S.brandData.default_wheel_url) || '';
  if (!POST_FILTERS.some(([k]) => k === S.postFilter)) S.postFilter = 'all';
  const counts = Object.fromEntries(POST_FILTERS.map(([k]) => [k, posts.filter((p) => postMatches(p, k)).length]));
  const shown = posts.filter((p) => postMatches(p, S.postFilter));
  // Sealed or still-transmuting posts can't be approved unseen.
  const drafts = posts.filter((p) => stageOf(p)[0] === 'Draft' && !isFinishing(p) && !isSealed(p));
  // Revise works on any post that is done being made, including ones already sent to socials.
  const revisable = posts.filter((p) => !isFinishing(p) && !isSealed(p));
  const overdue = posts.filter((p) => { const n = dueIn(p); return n != null && n < 0; }).length;
  const nextUp = posts.find((p) => dueIn(p) != null);
  const dated = posts.filter((p) => p.scheduled_date).map((p) => String(p.scheduled_date).slice(0, 10)).sort();
  main.innerHTML = `
    <div class="view">
      ${brandNavHtml('camps')}
      <button type="button" class="crumb" id="backHome">${icons.left} All campaigns</button>
      <div class="camp-head">
        <div class="camp-info">
          <h1>${esc(c.name)}</h1>
          ${c.goal ? `<p class="camp-prompt">${esc(c.goal.length > 180 ? c.goal.slice(0, 177) + '…' : c.goal)}</p>` : ''}
          <div class="camp-facts">
            <span><b>${posts.length}</b> of ${c.target_content_count} posts</span>
            <span>${esc(fmtDate(c.start_date))} → ${esc(fmtDate(c.end_date))}</span>
            <span>${esc((c.target_platforms || []).join(', '))}</span>
            ${link ? `<span>Link: <a href="${esc(safeHttpUrl(link))}" target="_blank" rel="noopener">${esc(link.replace(/^https?:\/\//, ''))}</a></span>` : '<span style="color:var(--red)">No link set</span>'}
          </div>
        </div>
        <div class="camp-actions">
          <button type="button" class="btn btn-gold" id="moreBtn2">${icons.spark} Create more posts</button>
          <button type="button" class="btn btn-ghost" id="editCamp">Edit campaign</button>
          ${posts.length >= 2 ? '<button type="button" class="btn btn-ghost" id="recapBtn">Make a recap</button>' : ''}
          <button type="button" class="icon-btn" id="campMenu" aria-label="More campaign actions">${icons.dots}</button>
        </div>
      </div>
      ${campChatHtml(c)}
      ${posts.length ? `
      ${schedNoticeHtml(c, posts, counts.due, overdue, nextUp, dated)}
      <div class="filter-row">

function schedNoticeHtml(c, posts, dueCount, overdue, nextUp, dated) {
  if (!dated.length) return '';
  const first = dated[0], last = dated[dated.length - 1];
  const left = posts.filter((p) => dueIn(p) != null).length;
  const head = overdue ? `<b>${overdue} post${overdue === 1 ? ' is' : 's are'} past ${overdue === 1 ? 'its' : 'their'} date.</b>`
    : dueCount ? `<b>${dueCount} post${dueCount === 1 ? ' is' : 's are'} due in the next ${DUE_SOON_DAYS} days.</b>`
    : left ? `<b>Next up: ${esc(fmtDate(nextUp.scheduled_date))}.</b>` : '<b>Every post here is out.</b>';
  return `<div class="sched ${overdue ? 'late' : dueCount ? 'soon' : ''}">
    <div>${head} Posts are in suggested order, ${esc(fmtDate(first))} → ${esc(fmtDate(last))}. Nothing posts automatically: post them in order, tick where each went, and change any date in Edit.${nextUp && (overdue || dueCount) ? ` Next: <a href="#" data-goto="${esc(nextUp.sku)}">${esc(nextUp.post_idea || 'the next post')}</a>.` : ''}</div>

/* ── Finishing: hold posts back until the Alchemist is done (2026-10-10) ─
   Brad: "the first time it loads its not complete ... the content changes
   after a few minutes to a more final version.. so this is misleading."
   Character pictures are drawn after a post is saved. Until scene-status
   says a post is finished, its card shows "still transmuting", its picture
   is veiled and approve / copy / download / posted are locked. When it's
   done the card refreshes by itself. */
S.finishing = S.finishing || new Set();
let finishTimer = null, finishChecked = 0, finishStarted = 0;
function isFinishing(p) { return S.finishing.has(p.sku); }
function markFinishing(skus) {
  (skus || []).forEach((k) => S.finishing.add(k));
  if (S.finishing.size) watchFinishing();
}
async function checkFinishing(skus) {
  if (!S.brand || !skus.length) return;
  try {
    const r = await api('scene-status', { body: { brand: S.brand, skus } });
    const before = new Set(S.finishing);
    skus.forEach((k) => S.finishing.delete(k));
    (r.pending || []).forEach((k) => S.finishing.add(k));
    const done = [...before].filter((k) => skus.includes(k) && !S.finishing.has(k));
    return done;
  } catch (e) { return []; }
}
function watchFinishing() {
  if (finishTimer) return;
  finishStarted = Date.now();
  const tick = async () => {
    finishTimer = null;
    const skus = [...S.finishing];
    if (!skus.length) return;
    const done = await checkFinishing(skus);
    if (done && done.length) {
      await loadBrand(S.brand).catch(() => {});
      if (S.view === 'campaign') renderCampaign(); else if (S.view === 'home') renderHome();
      toast(`Transmutation complete — ${done.length === 1 ? 'a post is' : done.length + ' posts are'} ready to reveal.`, 'ok', 6000);
    }
    if (S.finishing.size && Date.now() - finishStarted < 8 * 60 * 1000) finishTimer = setTimeout(tick, 6000);
    else S.finishing.clear();
  };
  finishTimer = setTimeout(tick, 5000);
}
// Called when a campaign opens: anything made in the last few minutes may still be finishing.
async function refreshFinishing(posts) {
  if (Date.now() - finishChecked < 8000) return;
  finishChecked = Date.now();
  const recent = posts.filter((p) => !p.created_at || Date.now() - new Date(p.created_at).getTime() < 15 * 60 * 1000).map((p) => p.sku);
  if (!recent.length) return;
  const had = recent.filter((k) => S.finishing.has(k)).length;
  await checkFinishing(recent);
  const now = recent.filter((k) => S.finishing.has(k)).length;
  if (now !== had && S.view === 'campaign') renderCampaign();
  if (S.finishing.size) watchFinishing();
}

      ${media.length > 1 ? `<button type="button" class="nav prev" aria-label="Previous slide">${icons.left}</button><button type="button" class="nav next" aria-label="Next slide">${icons.right}</button>

      ${tags.length ? `<div class="tags">${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      ${p.content_link ? `<div class="post-link">↗ <a href="${esc(safeHttpUrl(p.content_link))}" target="_blank" rel="noopener">${esc(p.content_link.replace(/^https?:\/\//, ''))}</a></div>` : ''}
      ${p.source_link ? `<div class="post-link muted small">Info from <a href="${esc(safeHttpUrl(p.source_link))}" target="_blank" rel="noopener">${esc(hostOf(p.source_link))}</a></div>` : ''}

      ${fin || seal ? '' : checksHtml(p)}
      ${clientNoteHtml(p)}
    </div>

      <button type="button" class="btn btn-sm btn-ghost approve-btn" data-a="approve" aria-pressed="${approved}">${approved ? '✓ Approved' : 'Approve'}</button>

      ${postTitle(p) ? '<button type="button" class="btn btn-sm btn-quiet" data-a="copytitle" title="For platforms with a separate title field">Copy title</button>' : ''}

  </article>`;
}

function wirePostCards(root) {

    // carousel

    const track = $('.media-track', card);
    const imgs = track ? $$('img', track) : [];
    const go = (n) => {
      const len = imgs.length; if (!len) return;
      const i = (n + len) % len; media.dataset.idx = i;
      track.style.transform = `translateX(-${i * 100}%)`;
      $$('.dots i', media).forEach((d, k) => d.classList.toggle('on', k === i));
      const cnt = $('.count', media); if (cnt) cnt.textContent = `${i + 1}/${len}`;
    };
    const prev = $('.nav.prev', card), next = $('.nav.next', card);
    if (prev) prev.onclick = () => go(+media.dataset.idx - 1);
    if (next) next.onclick = () => go(+media.dataset.idx + 1);
    let sx = null;
    if (track) {
      track.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
      track.addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(+media.dataset.idx + (dx < 0 ? 1 : -1)); sx = null; });
      imgs.forEach((im, k) => im.onclick = () => lightbox(im.src, imgs.map((x) => x.src), k));

        if (bad.length && !await confirmDialog(`Before you approve: ${bad.map((x) => x.text).join(' · ')}. Approve anyway?`, 'Approve anyway')) return;
      }
      btn.disabled = true;
      try {

        Object.assign(p(), r.row || { approval_status: on ? 'Approved' : 'Pending' });
        renderCampaign();
        toast(on ? 'Approved — ready to post. +1 XP' : 'Moved back to drafts.');
        kbNudge();

      } catch (err) { btn.disabled = false; if (err.status !== 401) toast(err.message, 'err'); }
    };
    $('[data-a="copy"]', card).onclick = () => copyCaption(p());
    const ct = $('[data-a="copytitle"]', card); if (ct) ct.onclick = () => copyTitle(p());
    { const dl = $('[data-a="dl"]', card); if (dl) dl.onclick = (e) => { e.stopPropagation(); downloadImages(p()); }; }
    { const ie = $('[data-a="imged"]', card); if (ie) ie.onclick = (e) => { e.stopPropagation(); openImageEditor(p(), +($('.media', card).dataset.idx || 0)); }; }

      e.stopPropagation();
      popMenu(e.currentTarget, `

        <button type="button" data-m="improve">${icons.spark} Sharpen the caption <span class="muted small">(text only)</span></button>
        <button type="button" data-m="imged"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> Edit this image <span class="muted small">(words, layout, picture)</span></button>
        <button type="button" data-m="vplan">${icons.spark} Video plan <span class="muted small">(TikTok, Reels)</span></button>

/* ── Edit one image (2026-10-13) ──────────────────────────────────────────

   to redo the full thing when just a part of the image was off". Each image
   the Alchemist drew is redrawn from its own recipe with the same design and
   layout; only what's changed here changes: the words, the logo, the

const cardNoOf = (u) => { const m = String(u || '').split('?')[0].match(/\/card_(\d+)\.png$/); return m ? +m[1] : 0; };

        </div>
        <div class="ie-pic" id="ieRenderWrap" style="display:none"><img id="ieImg" alt="Image ${idx + 1}" src="${esc(url)}"><span class="ie-tag" id="ieTag">Server render</span></div>
      </div>
      <div class="ie-form" id="ieForm"><div class="skel" style="height:220px"></div></div>
    </div>`,
    foot: '<span class="msg"></span><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="button" class="btn btn-quiet" id="ieRedraw" title="Draws every image of this post again from its saved design and your generated picture">Redraw post</button><button type="button" class="btn btn-quiet" id="ieRender">Render preview</button><button type="button" class="btn btn-gold" id="ieSave" disabled>Save image</button>',
  });

  const W0 = info.words, st0 = info.settings;
  const st = { logo_mode: st0.logo_mode, logo_size: st0.logo_size, logo_side: st0.logo_side, logo_asset: st0.logo_asset || null, include_character: st0.include_character, include_qr: st0.include_qr !== false, qr_side: st0.qr_side, swap_colors: !!st0.swap_colors, remove_photo: false, new_layout: false };
  const hasChar = !!(S.brandData && S.brandData.has_character);
  const hasItems = W0.items && W0.items.length;
  const logoMarks = brandAssetList().filter((a) => a.kind !== 'character');
  const logoPick = logoMarks.length >= 2 ? `<div class="seg ie-seg ie-logopick" data-k="logo_asset" role="group" style="flex-wrap:wrap" aria-label="Which logo"><button type="button" data-v="">Automatic</button>${logoMarks.map((a) => { const u = safeHttpUrl(a.url); return `<button type="button" data-v="${esc(a.id)}" title="${esc(a.name || a.kind)}" style="display:inline-flex;align-items:center;gap:6px">${u ? `<img src="${esc(u)}" alt="" style="height:20px;width:20px;object-fit:contain;border-radius:4px">` : ''}${esc(a.name || a.kind)}</button>`; }).join('')}</div>` : '';
  const seg = (k, opts) => `<div class="seg ie-seg" data-k="${k}" role="group">${opts.map(([v, l]) => `<button type="button" data-v="${esc(String(v))}">${esc(l)}</button>`).join('')}</div>`;
  form.innerHTML = `

      <span class="hint" id="ieHeard"></span></div>
    <details class="ie-sec" open><summary>Words on the card</summary>
      <div class="field"><label for="ieLabel">Small label <span class="muted">(location / category)</span></label><input class="input" id="ieLabel" maxlength="40"></div>

      ${hasChar ? seg('include_character', [['', 'Character: automatic'], ['true', 'Show'], ['false', 'Hide']]) : ''}
      <label class="check-row"><input type="checkbox" id="ieSwap"><span>Swap the brand's main and second colour</span></label>

    </details>
    <div class="ie-layout"><button type="button" class="btn btn-ghost btn-sm" id="ieLayout">Try a different layout</button><span class="hint" id="ieLayoutNote">Keeps the words; moves things around.</span></div>
    <div class="ie-newpic field" style="margin-top:14px"><label for="iePicNote">New picture for this slide <span class="muted">(1 credit)</span></label>
      <div class="row ie-note"><input class="input" id="iePicNote" maxlength="300" placeholder="Optional: what should the new picture show?"><button type="button" class="btn btn-ghost" id="iePic">${icons.spark} Draw a new picture</button></div>

    ${info.exact ? '' : '<p class="hint">This image was made before edits could keep its exact layout, so the first save may move things a little. After that, edits keep everything else in place.</p>'}`;
  /* --- populate initial values --- */
  $('#ieLabel', el).value = W0.label || ''; $('#ieHead', el).value = W0.headline || ''; $('#ieCta', el).value = W0.cta || '';
  if ($('#ieSub', el)) $('#ieSub', el).value = W0.sub || '';
  /* --- dynamic points/items management --- */
  const itemsContainer = $('#ieItems', el);
  const renderItems = (items) => {
    itemsContainer.innerHTML = items.map((t, i) => `<div class="ie-item-row"><input class="input" data-item="${i}" maxlength="90" value="${esc(t)}" placeholder="Point ${i + 1}"><button type="button" class="ie-rm" title="Remove this point" data-rm="${i}">&times;</button></div>`).join('');
    $$('[data-rm]', itemsContainer).forEach((b) => b.onclick = () => {

  };
  renderItems((hasItems ? W0.items : []).slice());

    else if (logoEl.dataset.asset) { delete logoEl.dataset.asset; logoEl.textContent = (S.brandData && S.brandData.name) || S.brand; }

    const t = s.el.querySelector('textarea'); t.value = text; t.select();
  }
}
async function copyCaption(p) {
