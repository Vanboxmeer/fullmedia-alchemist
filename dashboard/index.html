// 2026-10-11: Brad: titles should be SEO friendly, not the internal post ID,
// and keep the slide order. File names read "brand-post-title-slide-1-of-3.png";
// alt text reads "Post title – slide 1 of 3 – Brand".
function seoSlug(t, max) {
  return String(t || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    .replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, max || 60).replace(/-+[^-]*$/, (m) => (m.length > 12 ? '' : m)).replace(/-+$/g, '');
}
function postTitle(p) {
  const t = String(p.post_idea || '').trim() || String(p.post_copy || '').split(/(?<=[.!?])\s/)[0] || '';
  return t.replace(/\s+/g, ' ').slice(0, 110);
}
function imageFileName(p, i, n) {
  const brand = seoSlug(p.brand || S.brand, 30), title = seoSlug(postTitle(p), 60) || 'post';
  const base = brand && !title.startsWith(brand) ? `${brand}-${title}` : title;
  return `${base}${n > 1 ? `-slide-${i + 1}-of-${n}` : ''}.png`;
}
function imageAlt(p, i, n) {
  return [postTitle(p), n > 1 ? `slide ${i + 1} of ${n}` : '', p.brand || S.brand].filter(Boolean).join(' – ');
}
async function downloadImages(p) {
  const urls = (p.media_urls || []).filter(Boolean);
  if (!urls.length) { toast('This post has no images yet.', 'info'); return; }
  let n = 0;
  for (const u of urls) {
    n++;
    try {
      const res = await fetch(u); const blob = await res.blob();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = imageFileName(p, n - 1, urls.length); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      await sleep(250);
    } catch (e) { window.open(u, '_blank', 'noopener'); }
  }
  toast(`Downloaded ${urls.length} image${urls.length === 1 ? '' : 's'}.`);
}
async function archivePost(p) {
  if (!await confirmDialog('Archive this post? It’s kept for your records but leaves the campaign.', 'Archive', true)) return;
  try {
    await api('submit-client-feedback', { body: { brand: S.brand, sku: p.sku, requestType: 'delete_post' } });
    S.posts = S.posts.filter((x) => x.sku !== p.sku);
    renderCampaign(); toast('Post archived.'); kbNudge();
  } catch (e) { if (e.status !== 401) toast(e.message, 'err'); }
}
async function approveAll(list) {
  if (!list.length) return;
  if (!await confirmDialog(`Approve all ${list.length} posts waiting for review?`, 'Approve all')) return;
  let ok = 0;
  for (const p of list) {
    try { const r = await api('update-client-post', { body: { brand: S.brand, sku: p.sku, patch: { approval_status: 'Approved' } } }); Object.assign(p, r.row || { approval_status: 'Approved' }); ok++; }
    catch (e) { if (e.status === 401) return; }
  }
  renderCampaign(); toast(`Approved ${ok} post${ok === 1 ? '' : 's'} — ready to post. +${ok} XP`); kbNudge();
  loadProgress(true);
}

/* ── Revise many drafts with one note ───────────────────────────────────
   Same redo as the per-post "Redo this post" (submit-client-feedback), run for each ticked draft,
   two at a time. Free redos are used first; the total credit cost is shown before anything starts.
   The server still enforces every cap, so a post that is out of redos is reported, not charged. */
function openReviseAll(list) {
  const items = (list || []).filter((p) => !isFinishing(p));
  if (!items.length) return;
  const sub = (S.brandData && S.brandData.subscription) || {};

  const ownLink = String((S.brandData && S.brandData.default_wheel_url) || '').trim();
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./i, '').toLowerCase(); } catch (e) { return ''; } };
  const ownHost = hostOf(ownLink);
  const foreign = (p) => { const h = hostOf(p.content_link || ''); return !!(h && ownHost && h !== ownHost && !h.endsWith('.' + ownHost)); };
  const wasSent = (p) => ['Posted', 'Scheduled', 'Did it go out?'].includes(stageOf(p)[0]);
  const s = openSheet({
    title: 'Revise posts',
    body: `<div class="stack">
      <div class="field"><label for="raNote">What should change in every one?</label><textarea class="textarea" id="raNote" maxlength="2000" placeholder="e.g. Don’t mention the Evry token anywhere. Keep everything else."></textarea>

        <select class="input" id="raLinkMode"><option value="keep">Keep each post’s current link</option>${ownLink ? `<option value="own">My own link (${esc(ownLink.replace(/^https?:\/\//i, '').replace(/\/$/, '').slice(0, 48))})</option>` : ''}<option value="custom">A link I choose…</option></select>
        <input class="input" id="raLinkCustom" maxlength="1000" placeholder="https://" style="display:none;margin-top:6px">
        <span class="hint" id="raLinkHint">The link and its QR code are updated on every post you revise.</span></div>
      <label class="row small"><input type="checkbox" id="raKeep" checked> Keep the same design (only change the words)</label>
      <div class="field"><span class="label">Posts <span class="muted" id="raCount"></span></span>
        <div class="row small" style="gap:12px"><button type="button" class="btn btn-sm btn-quiet" id="raAll">Select all</button><button type="button" class="btn btn-sm btn-quiet" id="raNone">Select none</button></div>
        <div id="raList" class="stack" style="gap:6px;max-height:260px;overflow:auto">${items.map((p, i) => `<label class="row small" style="gap:8px;align-items:flex-start"><input type="checkbox" data-i="${i}"${wasSent(p) ? '' : ' checked'}><span><b>${esc(p.sku || '')}</b> ${wasSent(p) ? '<span class="chip" style="padding:0 6px;font-size:11px">Already posted</span> ' : ''}${foreign(p) ? '<span class="chip chip-due" style="padding:0 6px;font-size:11px">Links to another site</span> ' : ''}<span class="muted">${esc(snippet(p))}</span></span></label>`).join('')}</div></div>
      <div class="small rd-cost" id="raCost"></div>
      <div class="small" id="raProg" aria-live="polite"></div>
    </div>`,
    foot: `<span class="msg"></span><button type="button" class="btn btn-ghost" id="raCancel" data-close>Cancel</button><button type="button" class="btn btn-gold" id="raGo">${icons.spark} Revise them</button>`,
  });
  const el = s.el;
  let running = false, stop = false;
  const picked = () => $$('#raList input:checked', el).map((c) => items[+c.dataset.i]);
  const paint = () => {
    const ps = picked();
    let freeN = 0, credits = 0;
    ps.forEach((p) => { if (free == null || (Number(p.redo_count) || 0) < free) freeN++; else credits += slidesOf(p) * MODEL_MULT[curModel()]; });
    $('#raCount', el).textContent = `${ps.length} of ${items.length} selected`;
    $('#raCost', el).innerHTML = S.isAdmin ? '' : ps.length
      ? `${freeN} free redo${freeN === 1 ? '' : 's'}${credits ? ` · ${ps.length - freeN} cost ✦ ${credits} credit${credits === 1 ? '' : 's'} in total · ${modelPickerHtml()}` : ''}`
      : '';
    $('#raGo', el).disabled = running || !ps.length;
  };
  $$('#raList input', el).forEach((c) => c.onchange = paint);
  const modeSel = $('#raLinkMode', el), custom = $('#raLinkCustom', el);
  modeSel.onchange = () => { custom.style.display = modeSel.value === 'custom' ? '' : 'none'; };

  const onModel = () => paint(); document.addEventListener('fa-model', onModel);

    const keep = $('#raKeep', el).checked;
    let newLink = '';
    if (modeSel.value === 'own') newLink = ownLink;

      newLink = custom.value.trim();

    let next = 0, done = 0, failed = 0, capped = 0;

    const tick = () => { prog.textContent = `Revised ${done} of ${ps.length}${failed ? ` · ${failed} couldn’t be revised` : ''}…`; };
    tick();
    const worker = async () => {
      while (!stop && next < ps.length) {
        const p = ps[next++];
        try {
          await api('submit-client-feedback', { body: { brand: S.brand, sku: p.sku, requestType: 'redo', message: note, slides: slidesOf(p), model: curModel(), template: keep ? 'keep' : '', layout: keep ? 'keep' : '', ...(newLink ? { contentLink: newLink } : {}) } });
          done++;
        } catch (e) {
          if (e.status === 401) { stop = true; return; }
          failed++; if (e.body && e.body.capReached) capped++;
        }
        tick();
      }
    };
    await Promise.all([worker(), worker()]);
    running = false;
    s.close();
    document.removeEventListener('fa-model', onModel);
    try { await loadBrand(S.brand); renderCampaign(); } catch (e) { /* the list refreshes on next open */ }
    const left = ps.length - done - failed;
    toast(`Revised ${done} post${done === 1 ? '' : 's'}.${failed ? ` ${failed} couldn’t be revised${capped ? ` (${capped} out of redos — make a fresh post instead)` : ''}.` : ''}${left > 0 ? ` Stopped with ${left} left.` : ''}`, failed || left > 0 ? 'info' : 'ok', 9000);
  };

    try {
      const linkChanged = link && link !== (normalizeUrl(p.content_link) || '');
      const patch = { post_copy: copy, general_hashtags: tags, copy_plus_general: [copy, link || p.content_link || '', tags].filter(Boolean).join('\n\n') };
      if (date) patch.scheduled_date = date;
      const tm = $('#peTime', el).value || '';
      if (tm !== (/^\d{2}:\d{2}/.test(String(p.scheduled_time || '')) ? String(p.scheduled_time).slice(0, 5) : '')) patch.scheduled_time = tm || null;
      const r = await api('update-client-post', { body: { brand: S.brand, sku: p.sku, patch } });
      Object.assign(p, r.row || patch);
      if (linkChanged) {
        s.msg('Saving the link and redrawing the QR code…');
        const lr = await api('alchemist-edit', { body: { action: 'set_post_link', brand: S.brand, sku: p.sku, link } });
        p.content_link = lr.link; p.copy_plus_general = lr.copy_plus_general;
        if (lr.rerender_pending && lr.rerender_pending.length) await rerenderSkus(lr.rerender_pending);
        else if (lr.not_rerenderable) toast('Link saved. This older post’s image still shows the old QR code — use Redo to redraw it.', 'info', 8000);
        await loadBrand(S.brand);
      }
      if (mentAll.length) {
        const chosen = $$('#peMentChips .chip[aria-pressed="true"]', el).map((b) => b.dataset.mn);
        const names = chosen.length === mentAll.length ? null : chosen;
        const before = (S.mentions.posts || {})[p.sku];
        if (JSON.stringify(names) !== JSON.stringify(before === undefined ? null : before)) {
          try { await termsRpc('cc_post_set_mentions', { p_sku: p.sku, p_names: names }); S.mentions.posts = S.mentions.posts || {}; if (names === null) delete S.mentions.posts[p.sku]; else S.mentions.posts[p.sku] = names; }
          catch (_e) { toast('The post saved, but the tag choices could not be saved yet.', 'err', 6000); }
        }
      }
      s.close(); renderCampaign(); toast('Post saved.');
    } catch (e) { btn.disabled = false; if (e.status !== 401) s.msg(e.message, 'err'); }
  };
}

async function rerenderSkus(skus) {
  const close = toast(`Redrawing ${skus.length} post image${skus.length === 1 ? '' : 's'} with the new QR code…`, 'info', 0);
  let failed = 0;
  for (let i = 0; i < skus.length; i += 4) {
    try {
      const r = await api('alchemist-edit', { body: { action: 'rerender', brand: S.brand, skus: skus.slice(i, i + 4) } });
      failed += (r.results || []).filter((x) => !x.ok).length;
    } catch (e) { if (e.status === 401) { close(); return; } failed += Math.min(4, skus.length - i); }
  }
  close();
  if (failed) toast(`${failed} image${failed === 1 ? '' : 's'} couldn’t be redrawn. Try Redo on those posts.`, 'err', 8000);
}

   (trending in the niche from a live search, or in the style of an artist the

  });

  $$('#vpPlat button', el).forEach((b) => b.onclick = () => { platform = b.dataset.k; paintPlat(); });
  const asText = (pl) => {
    const L = [`VIDEO PLAN for ${PLAT[pl.platform] || 'a short video'} (${t(pl.total_seconds)})`, '', `HOOK (first 2 seconds): ${pl.hook.what_viewers_see}${pl.hook.on_screen_text ? ` | text: “${pl.hook.on_screen_text}”` : ''}`, '', 'SHOTS'];
    pl.shots.forEach((sh) => {
      L.push(`${t(sh.start)}-${t(sh.end)}  Slide ${sh.slide}${sh.motion ? ' - ' + sh.motion : ''}`);
      if (sh.text) L.push(`   Text: “${sh.text.words}”, ${where(sh.text.where)}, appears at ${t(sh.text.appears_at)}${sh.text.style ? ', ' + sh.text.style : ''}`);

    });

    if (pl.audio.length) { L.push('', 'SOUNDS'); pl.audio.forEach((a) => L.push(`- ${a.title}${a.artist ? ' by ' + a.artist : ''} (${a.found_in_search ? 'found in a search' : 'idea, check it is current'}); start at ${t(a.start_at_seconds)}. ${a.why} ${a.license_note}`)); }
    if (pl.tips.length) { L.push('', 'TIPS'); pl.tips.forEach((x) => L.push('- ' + x)); }
    return L.join('\n');

  const show = (pl) => {

        ${sh.text ? `<div>Text: “${esc(sh.text.words)}” · ${esc(where(sh.text.where))} · at ${esc(t(sh.text.appears_at))}${sh.text.style ? ` · ${esc(sh.text.style)}` : ''}</div>` : ''}
        ${sh.sticker ? `<div>Sticker: ${esc(sh.sticker.idea)} · ${esc(where(sh.sticker.where))} · at ${esc(t(sh.sticker.appears_at))}</div>` : ''}
        ${sh.effect ? `<div>Effect: ${esc(sh.effect)}</div>` : ''}${sh.transition ? `<div>Then: ${esc(sh.transition)}</div>` : ''}</div></div>`).join('')}
      ${pl.cover && (pl.cover.text || pl.cover.slide) ? `<div class="vp-h">Cover</div><div>Slide ${pl.cover.slide}${pl.cover.text ? ` with “${esc(pl.cover.text)}”` : ''}</div>` : ''}
      ${pl.audio.length ? `<div class="vp-h">Sound ideas</div>${pl.audio.map((a) => `<div class="vp-snd"><strong>${esc(a.title)}</strong>${a.artist ? ` by ${esc(a.artist)}` : ''}<span class="tag ${a.found_in_search ? 'ok' : ''}">${a.found_in_search ? 'found in a search' : 'idea · check it’s current'}</span>
        <div class="muted small">${esc(a.why)} Start at ${esc(t(a.start_at_seconds))}.</div><div class="muted small">${esc(a.license_note)}${a.source_url ? ` <a href="${esc(a.source_url)}" target="_blank" rel="noopener noreferrer">Source</a>` : ''}</div></div>`).join('')}
        <p class="hint">Search the sound’s name in ${esc(PLAT[pl.platform] || 'the app')} and add it there. The Alchemist can’t attach audio.</p>` : ''}
      ${pl.tips.length ? `<div class="vp-h">Tips</div>${pl.tips.map((x) => `<div class="muted small">• ${esc(x)}</div>`).join('')}` : ''}
      ${when ? `<p class="hint" style="margin-top:14px">Made ${esc(when)}.</p>` : ''}`;
    $('#vpCopy', el).hidden = false;
    $('#vpGo', el).innerHTML = `${icons.spark} Make a new plan (1 credit)`;
  };
  $('#vpCopy', el).onclick = async () => {
    if (!plan) return;
    try { await navigator.clipboard.writeText(asText(plan)); toast('Video plan copied.'); }
    catch (e) { const s2 = openSheet({ title: 'Copy plan', dialog: true, body: '<textarea class="textarea" style="min-height:260px" readonly></textarea>', foot: '<button type="button" class="btn btn-gold" data-close>Done</button>' }); const ta = s2.el.querySelector('textarea'); ta.value = asText(plan); ta.select(); }
  };
  $('#vpGo', el).onclick = async () => {
    const note = $('#vpNote', el).value.trim();

    const b = $('#vpGo', el); b.disabled = true; s.msg('Looking for sounds and writing the plan. About half a minute…');
    try {
      const r = await api('alchemist-video-plan', { body: { action: 'make', brand: S.brand, sku: p.sku, platform, note } });
      if (r.credits_charged && S.brandData && S.brandData.subscription && S.brandData.subscription.credits_left != null) S.brandData.subscription.credits_left = Math.max(0, Number(S.brandData.subscription.credits_left) - r.credits_charged);
      s.msg(''); show(r.plan);
    } catch (err) { s.msg(''); if (err.status !== 401) toast(err.message, 'err', 8000); }
    b.disabled = false;
  };
  paintPlat();
  api('alchemist-video-plan', { body: { action: 'get', brand: S.brand, sku: p.sku } }).then((r) => { if (r && r.plan && Array.isArray(r.plan.shots)) show(r.plan); }).catch(() => {});
}

/* ── Other formats (2026-10-30) ─────────────────────────────────────────
   Brad: help users use other platforms and other content types. Text-only posts, threads and
   polls written natively for a platform from an existing post (alchemist-post-format).
   Text only: nothing is posted, no picture is made. 1 credit each. Why these: in a 2026 study of
   45M+ posts (Buffer), text posts led on X; polls and threads give people a reason to answer. */
function openPostFormats(p) {
  closeMenus();
  const FMT = {
    text: { label: 'Text post', hint: 'No picture. Reads like a native post.', plats: ['x', 'threads', 'linkedin', 'facebook', 'reddit'] },
    thread: { label: 'Thread', hint: 'A short run of posts, starting with a hook.', plats: ['x', 'threads'] },
    poll: { label: 'Poll', hint: 'A question people can answer in one tap.', plats: ['x', 'linkedin'] },
  };
  const PN = { x: 'X', threads: 'Threads', linkedin: 'LinkedIn', facebook: 'Facebook', reddit: 'Reddit' };
  let fmt = 'text', plat = 'x', saved = {};
  const s = openSheet({
    title: 'Other formats',
    body: `<div class="stack">
      <p class="muted small" style="margin:0">Turn this post into a text post, a thread or a poll for another account. Nothing is posted and no picture is made.</p>
      <div class="field"><span class="label">Format</span><div class="seg" id="pfFmt" role="group" aria-label="Format">${Object.keys(FMT).map((k) => `<button type="button" data-k="${k}" aria-pressed="false">${FMT[k].label}</button>`).join('')}</div><span class="hint" id="pfHint"></span></div>
      <div class="field"><span class="label">For</span><div class="seg" id="pfPlat" role="group" aria-label="Account"></div></div>
      <div id="pfOut"></div></div>`,
    foot: `<span class="msg"></span><button type="button" class="btn btn-ghost" data-close>Close</button><button type="button" class="btn btn-gold" id="pfGo">${icons.spark} Write it (1 credit)</button>`,
  });
  const el = s.el, out = $('#pfOut', el);
  const own = (typeof brandPlatformNames === 'function' && brandPlatformNames()) || [];
  const paint = () => {
    const list = FMT[fmt].plats;
    if (list.indexOf(plat) === -1) plat = list[0];
    $$('#pfFmt button', el).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === fmt)));
    $('#pfPlat', el).innerHTML = list.map((k) => `<button type="button" data-k="${k}" aria-pressed="${k === plat}">${PN[k]}${own.indexOf(PN[k]) === -1 ? '' : ' ✓'}</button>`).join('');
    $$('#pfPlat button', el).forEach((b) => b.onclick = () => { plat = b.dataset.k; paint(); });
    $('#pfHint', el).textContent = FMT[fmt].hint + (own.length ? ' A ✓ means this brand has that account.' : '');
    const it = saved[fmt + ':' + plat];
    out.innerHTML = it ? itemHtml(it) : '';
    $$('[data-pfcopy]', out).forEach((b) => b.onclick = async () => {
      const txt = textOf(it);
      try { await navigator.clipboard.writeText(txt); toast('Copied.'); }
      catch (e) { const s2 = openSheet({ title: 'Copy', dialog: true, body: '<textarea class="textarea" style="min-height:220px" readonly></textarea>', foot: '<button type="button" class="btn btn-gold" data-close>Done</button>' }); const ta = s2.el.querySelector('textarea'); ta.value = txt; ta.focus(); ta.select(); }
    });
    $('#pfGo', el).innerHTML = `${icons.spark} ${it ? 'Write a new one' : 'Write it'} (1 credit)`;
  };
  const textOf = (it) => it.format === 'thread' ? it.posts.join('\n\n---\n\n')
    : it.format === 'poll' ? [it.lead_in, it.question, ...it.options.map((o) => '• ' + o)].filter(Boolean).join('\n')
      : [it.title, it.text].filter(Boolean).join('\n\n');
  const itemHtml = (it) => {
    const box = (t, n) => `<div class="card" style="padding:12px;margin:8px 0;white-space:pre-wrap">${esc(t)}${n ? `<div class="muted small" style="margin-top:6px">${esc(n)}</div>` : ''}</div>`;
    let h = '';
    if (it.format === 'thread') h = it.posts.map((t, i) => box(t, `${i + 1} of ${it.posts.length} · ${t.length} characters`)).join('');
    else if (it.format === 'poll') h = (it.lead_in ? box(it.lead_in, 'Lead-in line') : '') + box(it.question, 'Question') + `<div style="display:grid;gap:6px;margin:8px 0">${it.options.map((o) => `<div class="card" style="padding:8px 12px">${esc(o)}</div>`).join('')}</div>`;
    else h = (it.title ? box(it.title, 'Title') : '') + box(it.text, `${it.text.length} characters`);
    return `<div class="vp-h">${esc(FMT[it.format].label)} · ${esc(PN[it.platform])}</div>${h}<button type="button" class="btn btn-ghost btn-sm" data-pfcopy>Copy</button>`;
  };
  $$('#pfFmt button', el).forEach((b) => b.onclick = () => { fmt = b.dataset.k; paint(); });
  $('#pfGo', el).onclick = async () => {
    if (!await confirmDialog(`Write a ${FMT[fmt].label.toLowerCase()} for ${PN[plat]}? It uses 1 credit.`, 'Write it')) return;
    const b = $('#pfGo', el); b.disabled = true; s.msg('Writing…');
    try {
      const r = await api('alchemist-post-format', { body: { action: 'make', brand: S.brand, sku: p.sku, format: fmt, platform: plat } });
      if (r.credits_charged && S.brandData && S.brandData.subscription && S.brandData.subscription.credits_left != null) S.brandData.subscription.credits_left = Math.max(0, Number(S.brandData.subscription.credits_left) - r.credits_charged);
      saved[fmt + ':' + plat] = r.item; s.msg(''); paint();
    } catch (err) { s.msg(''); if (err.status !== 401) toast(err.message, 'err', 8000); }
    b.disabled = false;
  };
  paint();
  api('alchemist-post-format', { body: { action: 'get', brand: S.brand, sku: p.sku } }).then((r) => { if (r && r.formats && typeof r.formats === 'object') { saved = Object.assign({}, r.formats, saved); paint(); } }).catch(() => {});
}

  let src = p.real_time_event_tag ? 'post' : 'campaign';

  const s = openSheet({
    title: 'Redo this post',

        <div class="pitem-note" id="rdNoteMsg"></div>

      <div class="field"><span class="label">Slides</span><div class="seg" id="rdSlides">
        <button type="button" data-s="1">Single</button><button type="button" data-s="2">2 slides</button><button type="button" data-s="3">3 slides</button><button type="button" data-s="4">4 slides</button></div></div>

      <div class="small rd-cost" id="rdCost"></div>
    </div>`,

  let slides = Math.max(1, Math.min(4, (p.media_urls || []).length || 1));

    const sub = (S.brandData && S.brandData.subscription) || {};
    const free = sub.redo_cap_per_piece, done = Number(p.redo_count) || 0;
    const rc = $('#rdCost', el);
    if (rc) rc.innerHTML = S.isAdmin || free == null ? '' : done < free

      : `This redo costs ✦ ${slides * MODEL_MULT[curModel()]} credit${slides * MODEL_MULT[curModel()] === 1 ? '' : 's'} (${free} free redo${free === 1 ? '' : 's'} used) · ${modelPickerHtml()}`;
    $$('#rdSlides button', el).forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.s === slides)));
    $$('#rdSrc button', el).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.src === src)));

        b.stop(true);
        await loadBrand(S.brand); renderCampaign();
        // 2026-10-12: say what the redo did with the note, and what it can't do.
        toast(r && r.heard ? `Post redone. ${r.heard}` : 'Post redone.', 'ok', 7000);
        if (r && r.cannot) toast(r.cannot, 'info', 10000);
        kbNudge();
      } catch (e) {
        b.stop(false);
        if (e.status === 401) return;
        toast(e.body && e.body.capReached ? (e.body.maxRedos ? `This post has been redone ${e.body.maxRedos} times. Make a fresh post instead.` : `This post has used all ${e.body.redoCap} redos on your plan.`) : e.message, 'err', 8000);
      }
      return;
    }
    const brief = $('#rdBrief', el).value.trim();
    const link = $('#rdLink', el).value.trim();
    if (!brief) return s.msg('Say what this post is about, or press Read on its link.', 'err');
    if (link && !normalizeUrl(link)) return s.msg('That link doesn’t look like a web address.', 'err');
    s.close();
    const b = brew('Rewriting from its own brief', ['Reading the brief…', 'Tying it to the campaign…', 'Writing the caption…', 'Designing the images…', 'Pointing the QR code at its link…'], 'Usually under a minute.');
    try {
      const r = await genApi('generate-campaign-content', { body: {
        brand: S.brand, campaignId: p.campaign_id || undefined, replaceSku: p.sku, slidesPerPost: slides, notes: note, model: curModel(),
        userRequest: [brief, note].filter(Boolean).join(' — '), feedKind: 'rewrite', today: todayYmd(),
        postBriefs: [{ brief: brief.slice(0, 900), link: link ? normalizeUrl(link) : null, date: $('#rdDate', el).value || null }],
        ...(rdTone ? { tone: rdTone } : {}), ...(rdCapLen ? { captionLength: rdCapLen } : {}),
        ...(rdToneInstr.length ? { instructions: rdToneInstr } : {}),
      } });
      b.stop(true);
      if (r.scenes_queued) markFinishing(r.skus && r.skus.length ? r.skus : [p.sku]);
      await loadBrand(S.brand); renderCampaign();
      const failed = r.media_failed ? ` ${r.media_failed} image${r.media_failed === 1 ? '' : 's'} didn’t render — try Redo again.` : '';
      toast(`Post rewritten from its brief.${r.redo_cap ? ` Redo ${r.redo_count} of ${r.redo_cap}.` : ''}${failed}`, failed ? 'info' : 'ok', 7000);
    } catch (e) {
      b.stop(false);
      if (e.status === 401) return;
      toast(e.body && e.body.capReached ? (e.body.maxRedos ? `This post has been redone ${e.body.maxRedos} times. Make a fresh post instead.` : `This post has used all ${e.body.redoCap} redos on your plan.`) : e.message, 'err', 8000);
    }
  };
}

// Make more posts in a campaign from a note (Create more sheet or the
// campaign chat). The note is read first for days, count and instructions.
async function runMorePosts(c, { notes, count, fmt = 'mixed', items = null, cost, fromChat = false, artStyle, includeQr, locationTag, includeLocationTag, tone, captionLength, research, assetIds, ending }) {
    const before = postsFor(c.id).length;
    const useList = !!(items && items.length);
    let cnt = count;
    if (cost == null) cost = costOf(cnt, fmt);
    const b = brew('Transmuting', [...(notes ? ['Reading your request…'] : []), useList ? 'Reading your list…' : 'Reading the campaign…', useList ? 'One post per item…' : 'Finding fresh angles…', 'Writing captions…', 'Designing the images…', 'Adding each link and QR code…'], 'About a minute.', { give: `${useList ? items.length + ' briefs' : 'Your notes'} + ✦ ${cost}`, get: `${cnt} post${cnt === 1 ? '' : 's'}` });
    try {
      if (ending && ending.mode) {
        // Save it on the campaign first (free), so a bad image stops here before any credits are spent.
        await api('alchemist-edit', { body: { action: 'update_campaign', brand: S.brand, campaignId: c.id, fields: { ending } } });
        c.ending_slide = ending; const sc = (S.campaigns || []).find((x) => x.id === c.id); if (sc) sc.ending_slide = ending;
      }
      let plan = null;
      if (notes && !useList) {
        const campLink = (postsFor(c.id).find((p) => p.content_link) || {}).content_link || '';
        plan = await readRequest(notes, campLink, cnt, c.target_platforms || []);
        if (plan && plan.post_count && fromChat) cnt = plan.post_count;
        if (plan && plan.post_dates && plan.post_dates.length > cnt && fromChat) cnt = Math.min(10, plan.post_dates.length);
        if (planBriefs(plan).length) cnt = planBriefs(plan).length;
        const need = costOf(cnt, fmt), left = creditsLeft();
        if (shortText(need)) { b.stop(false); toast(shortText(need), 'err', 9000); return false; }
        // An explicitly asked-for link becomes the campaign's link.
        if (plan) b.update({ give: `Your notes + ✦ ${costOf(cnt, fmt)}`, get: `${cnt} post${cnt === 1 ? '' : 's'}` });
        if (plan && plan.link) await api('alchemist-edit', { body: { action: 'update_campaign', brand: S.brand, campaignId: c.id, fields: { requiredLink: plan.link }, applyLinkToPosts: false } }).catch(() => {});
      }
      const effTone = tone || c.tone || '';
      const effCapLen = captionLength || c.caption_length || '';

<script>
'use strict';
/* =========================================================================

/* ── Transmutation circle (procedural SVG) ───────────────────────────── */
/* 2026-10-30: Brad: "more subtle Alchemy tips ... not too much, it should not feel like work".

var FM_TIPS = {

    'Alchemist’s note: a post that’s a little rough but live beats a perfect one that never goes out.'

  reach: [
    'Alchemist’s note: a short, specific first line is the strongest part of any pitch.',
    'Alchemist’s note: a polite follow-up a few days later is often what earns the reply.',

};
/* 2026-10-30: Brad: "the app should help strengthen the user's social presence ... encouraging
   other platforms they are not using, or different content types on each platform".
   One gentle suggestion at a time on the campaigns page, from what this brand has really posted.
   Format leaders per platform are from Buffer's 2026 study of 45M+ posts (median engagement):
   Instagram carousels, LinkedIn carousels (document posts), TikTok video, Pinterest video,
   X text, Facebook images. Dismissing it hides this kind of note for 7 days. */
var GROW_INSIGHT = {
  Instagram: 'carousels earn the most engagement there, and Reels reach the most new people',
  LinkedIn: 'carousels earn by far the most engagement there',
  Facebook: 'images do best and plain links do worst',
  X: 'short text posts do best, with images close behind',
  TikTok: 'short video leads',
  Pinterest: 'video pins beat still images'
};
function growNudgeHtml() {
  try {
    if (localStorage.getItem('fm-hide-alchemist') === '1') return '';
    if (Date.now() < (+localStorage.getItem('fm-grow-until') || 0)) return '';
    var own = typeof brandPlatformNames === 'function' ? brandPlatformNames() : null;
    if (!own || !own.length) return '';
    var posts = (S.posts || []).filter(function (p) { return String(p.status || '').toLowerCase() !== 'archived'; });
    var msg = '', cta = '';
    // 1) Same format every time on a platform where another format leads.
    ['Instagram', 'LinkedIn'].some(function (n) {
      if (own.indexOf(n) === -1) return false;

      if (gaps.length) {
        var i = (+localStorage.getItem('fm-grow-i') || 0) % gaps.length, n2 = gaps[i];
        msg = S.brand + ' isn’t on ' + n2 + ' yet. There, ' + GROW_INSIGHT[n2] + '. Worth a look if your audience is there.';
        cta = '<a href="#" class="fm-grow-a" data-socfix>Add an account</a>';

    }
    if (!msg) return '';

document.addEventListener('click', function (e) {

  try { localStorage.setItem('fm-grow-until', String(Date.now() + 7 * 864e5)); localStorage.setItem('fm-grow-i', String((+localStorage.getItem('fm-grow-i') || 0) + 1)); } catch (x) {}
  var t = b.closest('.fm-tip'); if (t) t.remove();
});
function fmTipHtml(mod) {

    if (localStorage.getItem('fm-hide-alchemist') === '1') return '';
    if (Date.now() < (+localStorage.getItem('fm-tip-until') || 0)) return '';

    return '<div class="fm-tip" role="note"><span class="fm-tip-s" aria-hidden="true">✦</span><span class="fm-tip-t">' + L[i] + '</span><button type="button" class="fm-tip-x" aria-label="Dismiss this note" data-fm-tipx>×</button></div>';
  } catch (e) { return ''; }
}
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest && e.target.closest('[data-fm-tipx]'); if (!b) return;
  try { localStorage.setItem('fm-tip-until', String(Date.now() + 3 * 864e5)); localStorage.setItem('fm-tip-i', String((+localStorage.getItem('fm-tip-i') || 0) + 1)); } catch (x) {}
  var t = b.closest('.fm-tip'); if (t) t.remove();
});
function hashStr(s) { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
// 2026-10-30: Brad: the plain spinner should be a transmutation effect, and the
// words should vary. A sealed vessel is "sealed"; a post still being made is

var FIN_WORDS = [
  ['Still transmuting', 'Your materials are fusing into this post’s picture. About a minute, then it’s ready to reveal.'],

function finVeilHtml(p) {

  return `<div class="fin-veil"><div class="fin-orb" aria-hidden="true">${circleSvg('fin-' + (p && p.sku), { uid: 'fn' + hashStr(String(p && p.sku)) })}${sparks}</div><b>${esc(w[0])}</b><small>${esc(w[1])}</small></div>`;
}
var STILL_MAKING_TOAST = 'Your posts are in the crucible. Reveal each one as it finishes (about a minute).';
function circleSvg(seed = 'alchemist', opts = {}) {
  const h = hashStr(seed);
  const sides = [3, 4, 5, 6, 7, 8][h % 6];
  const inner = [3, 4, 6][(h >> 3) % 3];
  const ticks = 36;
  const P = (r, a) => [100 + r * Math.cos(a), 100 + r * Math.sin(a)];
  const poly = (r, n, rot) => Array.from({ length: n }, (_, i) => P(r, rot + (i * 2 * Math.PI) / n).map((v) => v.toFixed(2)).join(',')).join(' ');
  const star = (r, n, rot) => {
    // star polygon {n/2} when n>=5, else plain polygon
    const step = n >= 5 ? 2 : 1;
    const pts = []; let k = 0;
    for (let i = 0; i < n; i++) { pts.push(P(r, rot + (k * 2 * Math.PI) / n)); k = (k + step) % n; }
    return pts.map((p) => p.map((v) => v.toFixed(2)).join(',')).join(' ');
  };
  let tickPath = '';
  for (let i = 0; i < ticks; i++) {
    const a = (i * 2 * Math.PI) / ticks; const long = i % 3 === 0;
    const [x1, y1] = P(long ? 83 : 85.5, a); const [x2, y2] = P(89, a);
    tickPath += `M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
  }
  let runes = '';
  for (let i = 0; i < 12; i++) {
    const a = (i * 2 * Math.PI) / 12 + Math.PI / 12; const [x, y] = P(76, a);
    const t = (h + i) % 3;
    runes += t === 0 ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2"/>`
      : t === 1 ? `<path d="M${(x - 2.6).toFixed(1)} ${(y + 2).toFixed(1)}L${x.toFixed(1)} ${(y - 2.6).toFixed(1)}L${(x + 2.6).toFixed(1)} ${(y + 2).toFixed(1)}Z"/>`
        : `<path d="M${(x - 2.5).toFixed(1)} ${y.toFixed(1)}H${(x + 2.5).toFixed(1)}M${x.toFixed(1)} ${(y - 2.5).toFixed(1)}V${(y + 2.5).toFixed(1)}"/>`;
  }
  const verts = Array.from({ length: sides }, (_, i) => P(64, -Math.PI / 2 + (i * 2 * Math.PI) / sides));
  const id = 'g' + (h % 100000) + (opts.uid || '');
  return `<svg class="tc" viewBox="0 0 200 200" aria-hidden="true">
    <defs><radialGradient id="${id}" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="var(--gold)" stop-opacity=".95"/><stop offset="60%" stop-color="var(--gold)" stop-opacity=".25"/><stop offset="100%" stop-color="var(--green)" stop-opacity="0"/></radialGradient></defs>
    <g class="spin-slow" fill="none" stroke="var(--gold)">
      <circle class="draw" pathLength="1" cx="100" cy="100" r="93" stroke-width="1.6"/>
      <circle class="draw d2" pathLength="1" cx="100" cy="100" r="89" stroke-width=".8" opacity=".7"/>
      <path d="${tickPath}" stroke-width="1" opacity=".75"/>
    </g>
    <g class="spin-rev" fill="var(--gold)" stroke="var(--gold)" stroke-width="1" opacity=".85">${runes}</g>
    <circle class="draw d2" pathLength="1" cx="100" cy="100" r="70" fill="none" stroke="var(--gold)" stroke-width="1" opacity=".6"/>
    <g class="spin-fast" fill="none" stroke="var(--green)" stroke-width="1.6">
      <polygon class="draw d3" pathLength="1" points="${star(64, sides, -Math.PI / 2)}"/>
      ${verts.map(([x, y]) => `<circle class="node" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(--surface)" stroke="var(--green)"/>`).join('')}
    </g>
    <g class="spin-rev" fill="none" stroke="var(--gold)" stroke-width="1.2">
      <polygon class="draw d4" pathLength="1" points="${poly(34, inner, Math.PI / 2)}"/>
      <circle cx="100" cy="100" r="40" stroke-dasharray="3 5" opacity=".6"/>
    </g>
    <circle class="core" cx="100" cy="100" r="24" fill="url(#${id})"/>
    <circle cx="100" cy="100" r="5" fill="var(--gold)"/>
  </svg>`;
}
// Older call sites (onboarding header) keep working.
function orbSvg() { return circleSvg('alchemist'); }

/* ── Brew = a transmutation in progress ──────────────────────────────── */
function brew(title, stages, note = '', exchange = null) {
  const el = document.createElement('div');
  el.className = 'brew';
  el.setAttribute('role', 'status');
  const sparks = Array.from({ length: 14 }, (_, i) => `<i class="spark" style="--a:${Math.round(i * 360 / 14)}deg;animation-delay:${(i * 0.16).toFixed(2)}s"></i>`).join('');

    <div class="brew-bar"><i></i></div>
    <div class="brew-note"></div></div>`;
  el.querySelector('h2').textContent = title;
  el.querySelector('.brew-note').textContent = note;
  document.body.appendChild(el);
  let i = 0;
  const stageEl = el.querySelector('.brew-stage');
  const bar = el.querySelector('.brew-bar i');
  const show = () => {
    stageEl.style.opacity = 0;
    setTimeout(() => { stageEl.textContent = stages[Math.min(i, stages.length - 1)]; stageEl.style.opacity = 1; }, 220);
    bar.style.width = Math.min(92, Math.round(((i + 1) / (stages.length + 1)) * 100)) + '%';
  };
  show();
  const t = setInterval(() => { if (i < stages.length - 1) { i++; show(); } }, 6500);
  return {
    // 2026-10-11: once the request is read, show what was heard and the real exchange.
    update({ give, get, note: n } = {}) {
      const ex = el.querySelectorAll('.exchange b');

      if (n) el.querySelector('.brew-note').textContent = n;

    stop(done = true) {
      clearInterval(t);

/* ── Equivalent exchange: credits ────────────────────────────────────── */
const MIXED_PATTERN = [3, 1, 2, 1, 3, 2];
/* Plans v2 (2026-10-09): pick the writing model; credits per slide follow

const MODEL_MULT = { fast: 1, pro: 2, max: 4 };
const MODEL_INFO = { fast: ['Fast', 'Quick, solid copy', 'Haiku', 'Claude Haiku 4.5'], pro: ['Pro', 'Sharper hooks and structure', 'Sonnet', 'Claude Sonnet 5'], max: ['Max', 'The most careful writing', 'Opus', 'Claude Opus 5'] };
const SCENE_CREDITS = 1;   // 2026-10-14: a post's picture is 1 credit (was 2)
function curModel() { try { const m = localStorage.getItem('fa-model'); if (MODEL_MULT[m]) return m; } catch (e) {} return 'fast'; }
function setModel(m) { if (!MODEL_MULT[m]) return; try { localStorage.setItem('fa-model', m); } catch (e) {} }
function slidesOf(count, fmt) {
  if (fmt === 'single') return count;
  if (isCar(fmt)) return count * carN(fmt);
  let s = 0; for (let i = 0; i < count; i++) s += MIXED_PATTERN[i % MIXED_PATTERN.length]; return s;
}
function costOf(count, fmt) {
  return slidesOf(count, fmt) * MODEL_MULT[curModel()] + SCENE_CREDITS * pictureCount(count, fmt);
}
/* Share of slides that get a real picture (brand setting, default 66%). */
function picturesShare() {
  const b = S.brandData || {}; const v = (b.design_system || {}).pictures_share;
  return v != null && Number.isFinite(Number(v)) ? Math.max(0, Math.min(100, Number(v))) : 66;
}
function pictureCount(count, fmt) { return picturesOn() ? Math.round(slidesOf(count, fmt) * picturesShare() / 100) : 0; }
/* Every post gets a picture unless the brand turned pictures off. */
function picturesOn() {
  const b = S.brandData || {};
  if (b.scenes_on) return true;
  return !((b.design_system || {}).pictures === 'off');
}
function burstLeft() { const sub = S.brandData && S.brandData.subscription; return sub && sub.burst_left != null ? Math.max(0, Number(sub.burst_left) || 0) : null; }
function burstReset() { const sub = S.brandData && S.brandData.subscription; return sub && sub.burst_resets_at ? new Date(sub.burst_resets_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ''; }
/* 2026-10-26 (Brad): "free plan is useless if user cannot proceed with first
   batch." Free accounts default to one image per post on the Fast writer, and
   a transmutation the vial can't cover is stopped BEFORE the campaign is made,
   with the real reason (today / this window / this month) in plain words. */
function subOf() { return S.brandData && S.brandData.subscription; }
function isFreePlan() { const s = subOf(); return !!s && s.plan_key === 'free'; }
function dailyLeft() { const s = subOf(); return s && s.daily_left != null ? Math.max(0, Number(s.daily_left) || 0) : null; }
function dailyReset() { const d = new Date(); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 1)).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function giveNow() {
  if (S.isAdmin) return null;
  const c = [], l = creditsLeft(), b = burstLeft(), d = dailyLeft();
  if (d != null) c.push({ n: d, why: 'day' });
  if (b != null) c.push({ n: b, why: 'window' });
  if (l != null) c.push({ n: l, why: 'month' });
  return c.length ? c.reduce((a, x) => (x.n < a.n ? x : a)) : null;
}
function shortText(cost) {
  const g = giveNow(); if (!g || cost <= g.n) return '';
  const ask = `This transmutation asks ✦ ${cost}`;
  if (g.why === 'day') return `An exchange takes equal equivalence. ${ask}, but your vial holds only ✦ ${g.n} more today (it refills at ${dailyReset()}). Offer less: fewer posts, one image each, or the Fast writer. Or upgrade for a bigger vial.`;
  if (g.why === 'window') return `An exchange takes equal equivalence. ${ask}, but only ✦ ${g.n} is open in this 6-hour window${burstReset() ? ` (more at ${burstReset()})` : ''}. Offer less now, or wait for the window to turn.`;
  return `An exchange takes equal equivalence. ${ask}, but you hold only ✦ ${g.n} this month. Offer less: fewer posts, one image each, or the Fast writer. Or get more credits.`;
}
function defFmt() { return isFreePlan() ? 'single' : 'mixed'; }
function applyFreeDefaults() {
  if (!isFreePlan() || S._freeDef === S.brand) return;
  S._freeDef = S.brand;
  comp.format = 'single';
  const g = giveNow();
  while (g && comp.count > 1 && costOf(comp.count, 'single') > g.n) comp.count--;
}
/* The server's short codes, in the same voice. */
function friendlyGate(m) {
  const x = String(m || '');
  if (/free_daily_cap/.test(x)) return 'An exchange takes equal equivalence. Your vial has reached its daily limit. It refills at ' + dailyReset() + '. Offer less, or upgrade for a bigger vial.';
  if (/free_capacity/.test(x)) return 'The Free vials are all drained for today. They refill at ' + dailyReset() + ' (or upgrade to transmute now).';
  if (/verify_email/.test(x)) return 'Confirm your email first: check your inbox for our message, then transmute again.';
  if (/engine_paused/.test(x)) return 'The alchemist is resting for a moment. Try again shortly.';
  if (/account_suspended/.test(x)) return 'This account is paused. Contact support to open it again.';
  return m;
}
function modelPickerHtml() {
  const cur = curModel();
  return `<span class="seg model-seg" role="group" aria-label="Writing model">${Object.keys(MODEL_MULT).map((k) => `<button type="button" data-model="${k}" aria-pressed="${k === cur}" title="${esc(MODEL_INFO[k][3])}: ${esc(MODEL_INFO[k][1])} · ${MODEL_MULT[k]} credit${MODEL_MULT[k] === 1 ? '' : 's'} per slide">${esc(MODEL_INFO[k][0])}<small>${esc(MODEL_INFO[k][2])}</small></button>`).join('')}</span>`;
}
function creditsLeft() {
  const sub = S.brandData && S.brandData.subscription;
  if (!sub || sub.posts_included_monthly == null) return null;
  if (sub.credits_left != null) return Math.max(0, Math.floor((Number(sub.credits_left) || 0) + 1e-9));
  return Math.max(0, (sub.posts_included_monthly || 0) + (sub.extra_post_credits || 0) - (sub.posts_used || 0));
}
/* ── Campaign slots (2026-10-08) ────────────────────────────────────────
   Brad: "comped plan, but its still saying that 'my plan only allows 3
   campaigns' ... there are only 2 campaigns active". The limit is per
   account, across ALL its brands (his 3rd was in Reading Race). Show which
   campaigns hold the slots, and let them archive one right there. A
   campaign stops counting once archived or past its end date. */
function campSlots() {
  const sub = S.brandData && S.brandData.subscription;
  if (!sub || !Array.isArray(sub.campaigns_running)) return null;
  return { limit: sub.campaigns_limit == null ? null : Number(sub.campaigns_limit), running: sub.campaigns_running, plan: sub.plan_name || 'current' };
}
function campSlotsHtml(sl) {
  return `<ul class="slot-list">${sl.running.map((c, i) => `<li><span><b>${esc(c.name)}</b> <span class="muted">· ${esc(c.brand)}${c.end_date ? ' · ends ' + esc(fmtDate(c.end_date)) : ''}</span></span><button type="button" class="btn btn-sm btn-ghost" data-arch="${i}">Archive</button></li>`).join('')}</ul>`;
}
function wireCampSlots(root, sl, after) {
  $$('[data-arch]', root).forEach((b) => b.onclick = async () => {
    const c = sl.running[+b.dataset.arch];

    b.disabled = true;

      await api('manage-campaign', { body: { brand: c.brand, campaignId: c.id, action: 'archive' } });
      await loadBrand(S.brand); setBrandChrome();

function campLimitNotice(sl) {

}
function exchangeHtml(count, fmt) {
  const cost = costOf(count, fmt);
  const slides = slidesOf(count, fmt);

  const bl = burstLeft();
  const dl = dailyLeft();

    <span class="get">${count} post${count === 1 ? '' : 's'} · ${slides} slide${slides === 1 ? '' : 's'}${pictureCount(count, fmt) ? ` · ${pictureCount(count, fmt)} ${(S.brandData && S.brandData.scenes_on) ? 'character ' : ''}picture${pictureCount(count, fmt) === 1 ? '' : 's'}` : ''}</span>
    ${sm ? `<span class="short">${esc(sm)} <a href="#" data-getcred style="color:inherit;font-weight:700">Get more credits</a></span>`
      : (left != null ? `<span class="left">${left} left${dl != null && dl < left ? ` · ${dl} today` : bl != null && bl < left ? ` · ${bl} this window` : ''}</span>` : '')}`;
}
document.addEventListener('click', (e) => {

/* ── Progress: rank, XP, badges ──────────────────────────────────────── */
function seenKey() { return 'fa-seen-' + (S.email || 'me'); }
function loadSeen() { try { return JSON.parse(localStorage.getItem(seenKey()) || 'null'); } catch (e) { return null; } }
function saveSeen(v) { try { localStorage.setItem(seenKey(), JSON.stringify(v)); } catch (e) {} }
async function loadProgress(celebrate = false) {
  let r;
  try { r = await api('alchemist-progress', { body: { brand: S.brand || '', celebrate: !!celebrate } }); }
  catch (e) { return null; }
  const prevXp = S.progress && S.progress.xp;
  S.progress = r;
  paintRankChip();
  paintQuestStrip();
  if (prevXp != null && r.xp > prevXp) xpGain(r.xp - prevXp);
  // 2026-10-24: Brad kept getting the same badge pop-up ~30 times. What was announced used to
  // live in this browser's storage, which phones and installed apps lose. The server now
  // remembers it per user: each badge and rank is announced exactly once, on any device.
  if (r.fresh && typeof r.fresh === 'object') {
    if (celebrate) {
      const done = (S.announced = S.announced || new Set());
      const queue = [];
      if (r.fresh.rank && !done.has('rank-' + r.fresh.rank)) {
        done.add('rank-' + r.fresh.rank);
        queue.push({ kind: 'rank', title: r.rank.name, text: `You’ve reached rank ${r.rank.level}.${r.next ? ` ${r.next.remaining} XP to ${r.next.name}.` : ' The highest rank there is.'}`, seed: 'rank-' + r.rank.key });
      }
      (r.fresh.badges || []).forEach((k) => {
        const b = r.badges.find((x) => x.key === k);
        if (b && !done.has(k)) { done.add(k); queue.push({ kind: 'badge', title: b.name, text: b.how + ' — done.', seed: b.key }); }
      });
      for (const q of queue) await celebrateUnlock(q);
    }
    return r;
  }
  const earned = r.badges.filter((b) => b.earned).map((b) => b.key);
  const seen = loadSeen();
  if (!seen) { saveSeen({ badges: earned, level: r.rank.level }); return r; }   // first visit: no fireworks for history
  const fresh = r.badges.filter((b) => b.earned && !seen.badges.includes(b.key));
  const rankedUp = r.rank.level > (seen.level || 1);
  saveSeen({ badges: Array.from(new Set([...seen.badges, ...earned])), level: Math.max(r.rank.level, seen.level || 1) });
  if (celebrate) {
    const queue = [];
    if (rankedUp) queue.push({ kind: 'rank', title: r.rank.name, text: `You’ve reached rank ${r.rank.level}.${r.next ? ` ${r.next.remaining} XP to ${r.next.name}.` : ' The highest rank there is.'}`, seed: 'rank-' + r.rank.key });
    fresh.forEach((b) => queue.push({ kind: 'badge', title: b.name, text: b.how + ' — done.', seed: b.key }));
    for (const q of queue) await celebrateUnlock(q);
  }
  return r;
}
function paintRankChip() {
  const c = $('#rankChip'); const r = S.progress;
  if (!c || !r) return;
  const span = r.next ? (r.next.xp - r.rank.xp) : 1;
  const pct = r.next ? Math.max(0, Math.min(1, (r.xp - r.rank.xp) / span)) : 1;
  const C = 2 * Math.PI * 12;
  c.hidden = false;
  c.innerHTML = `<svg class="xp-ring" viewBox="0 0 30 30"><circle class="bg" cx="15" cy="15" r="12"/><circle class="fg" cx="15" cy="15" r="12" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}"/><text x="15" y="15.5">${r.rank.level}</text></svg><span></span>`;
  c.querySelector('span').textContent = r.rank.name;
  c.title = `${r.xp} XP${r.next ? ` · ${r.next.remaining} to ${r.next.name}` : ''}`;
}
function celebrateUnlock(q) {
  return new Promise((resolve) => {
    const el = document.createElement('div');
    el.className = 'unlock'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', q.title);
    el.innerHTML = `<div class="unlock-card"><div class="sig">${circleSvg(q.seed, { uid: 'u' })}</div>
      <div class="eyebrow">${q.kind === 'rank' ? 'New rank' : 'Badge earned'}</div><h2></h2><p></p>
      <button type="button" class="btn btn-gold" style="margin-top:18px">Continue</button></div>`;
    el.querySelector('h2').textContent = q.title; el.querySelector('p').textContent = q.text;
    document.body.appendChild(el);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      for (let i = 0; i < 26; i++) {
        const b = document.createElement('i'); b.className = 'burst';
        b.style.setProperty('--a', Math.round(Math.random() * 360) + 'deg'); b.style.setProperty('--d', (120 + Math.random() * 220) + 'px');
        b.style.animationDelay = (Math.random() * 0.15) + 's';
        if (i % 3 === 0) b.style.background = 'var(--green)';
        document.body.appendChild(b); setTimeout(() => b.remove(), 1500);
      }
    }
    let done = false;
    const close = () => { if (done) return; done = true; document.removeEventListener('keydown', onKey); el.classList.add('closing'); setTimeout(() => { el.remove(); resolve(); }, 280); };
    const onKey = (e) => { if (e.key === 'Escape' || e.key === 'Enter') { e.stopPropagation(); close(); } };
    document.addEventListener('keydown', onKey);
    el.addEventListener('click', close);
    setTimeout(() => el.querySelector('button').focus(), 50);
  });
}

/* ── Plan & credits (moved in from the old dashboard, 2026-10-08) ──── */
const fmtLong = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }); };
const money = (cents) => '$' + ((cents || 0) / 100).toLocaleString(undefined, { maximumFractionDigits: 0 });
let planInterval = 'monthly';

async function openPlan() {
  closeMenus();
  // Every plan / upgrade / get-more-credits button opens the one Plans & billing screen (assets/xpromo.js); the sheet below is only a fallback.
  if (typeof window.xpOpenPlans === 'function') { window.xpOpenPlans(); return; }
  if (!S.brand) return;
  const s = openSheet({ title: 'Plan & credits', body: '<div class="stack"><div class="skel" style="height:100px"></div><div class="skel" style="height:120px"></div><div class="skel" style="height:220px"></div></div>' });
  let prof;
  try {
    const [p] = await Promise.all([loadProfile(), loadBrand(S.brand).then(setBrandChrome).catch(() => {})]);
    prof = p;
  } catch (e) {
    if (e.status !== 401) { const b = s.el.querySelector('.sheet-body'); b.innerHTML = '<div class="notice bad"></div>'; b.firstChild.textContent = e.message; }
    return;
  }
  renderPlan(s, prof);
}

function renderPlan(s, prof) {
  const body = s.el.querySelector('.sheet-body');
  const usage = (S.brandData && S.brandData.subscription) || null;     // credits used this period
  const bill = prof.subscription;                                      // billing state
  const plans = prof.plans || [];
  const curKey = bill && ['active', 'trialing'].includes(bill.status) ? bill.plan_key : null;
  const curPlan = plans.find((p) => p.key === curKey) || null;
  const total = usage ? (usage.posts_included_monthly || 0) + (usage.extra_post_credits || 0) : 0;
  const left = usage ? (creditsLeft() ?? 0) : 0;
  const pct = total ? Math.round((left / total) * 100) : 0;
  const refill = usage && usage.current_period_end ? fmtLong(usage.current_period_end) : '';
  const slots = campSlots();

  let status = '';
  if (!bill || !curKey) status = 'No active plan. Choose one below to get credits.';
  else if (bill.is_comp) status = `Complimentary${bill.comp_ends_at ? ` until ${fmtLong(bill.comp_ends_at)}` : ''}. Nothing to pay.`;
  else if (curKey === 'free') status = 'Free plan. Credits refill every month.';
  else if (bill.cancel_at_period_end) status = `Ends ${fmtLong(bill.current_period_end)}. You keep everything until then.`;
  else status = `Billed ${bill.billing_interval === 'annual' ? 'yearly' : 'monthly'}${bill.payment_method === 'card' ? ' by card' : bill.payment_method === 'crypto' ? ' in crypto' : ''}.`;

  const brandCap = curPlan ? (curPlan.brands_included || 0) + ((bill && bill.extra_brand_slots) || 0) : null;
  const feats = (pl) => [
    `${Number(pl.posts_included_monthly).toLocaleString()} credits / month`,
    pl.burst_credits_6h ? `Up to ${Number(pl.burst_credits_6h).toLocaleString()} every 6 hours` : null,
    `${pl.brands_included} brand${pl.brands_included === 1 ? '' : 's'}`,
    pl.concurrent_campaigns_limit == null ? 'Unlimited campaigns' : `${pl.concurrent_campaigns_limit} campaign${pl.concurrent_campaigns_limit === 1 ? '' : 's'} at a time`,
    pl.redo_cap_per_piece == null ? 'Unlimited redos' : `${pl.redo_cap_per_piece} free redo${pl.redo_cap_per_piece === 1 ? '' : 's'} per post, then credits`,
    pl.reviews_included_monthly == null ? 'Unlimited Review & Improve' : pl.reviews_included_monthly > 0 ? `${pl.reviews_included_monthly} review${pl.reviews_included_monthly === 1 ? '' : 's'} / month` : null,
  ].filter(Boolean);
  const paysByCard = !!(bill && bill.payment_method === 'card' && ['active', 'past_due'].includes(bill.status) && !bill.is_comp);
  const tiles = plans.map((pl) => {
    const cents = planInterval === 'annual' ? pl.annual_price_cents : pl.price_cents;
    const isCur = pl.key === curKey;
    const crypto = planInterval === 'annual' ? pl.helio_paylink_annual : pl.helio_paylink_monthly;
    let acts;
    if (isCur) acts = '<div class="badge-cur">Your plan</div>';
    else if (!cents) acts = '<div class="small muted">Always free</div>';
    else if (bill && bill.is_comp) acts = '<div class="small muted">Available after your complimentary plan</div>';
    // 2026-10-08: paying by card -> switch in place (no second checkout).
    else if (paysByCard) acts = `<button type="button" class="btn btn-gold btn-sm" data-change="${esc(pl.key)}">Switch to ${esc(pl.name)}</button>`;
    else acts = `<button type="button" class="btn btn-gold btn-sm" data-card="${esc(pl.key)}">Choose ${esc(pl.name)}</button>${crypto ? `<button type="button" class="btn btn-ghost btn-sm" data-crypto="${esc(pl.key)}">Pay with crypto</button>` : ''}`;
    return `<div class="plan-tile${isCur ? ' cur' : ''}"><h4>${esc(pl.name)}</h4>
      <div class="price">${esc(money(cents))}${cents ? `<span> / ${planInterval === 'annual' ? 'year' : 'month'}</span>` : ''}</div>
      ${pl.tagline ? `<div class="small muted">${esc(pl.tagline)}</div>` : ''}
      <ul>${feats(pl).map((f) => `<li>${esc(f)}</li>`).join('')}</ul><div class="acts">${acts}</div></div>`;
  }).join('');
  const canCancel = bill && curKey && curKey !== 'free' && !bill.is_comp && !bill.cancel_at_period_end;
  const manage = [
    bill && bill.has_stripe_customer ? '<button type="button" class="btn btn-ghost btn-sm" id="plPortal">Card &amp; invoices</button>' : '',
    bill && bill.cancel_at_period_end && !bill.is_comp ? '<button type="button" class="btn btn-ghost btn-sm" id="plResume">Keep my plan</button>' : '',
    canCancel ? '<button type="button" class="btn btn-danger btn-sm" id="plCancel">Cancel plan</button>' : '',
  ].filter(Boolean).join('');

  body.innerHTML = `
    <div class="plan-now"><div class="sig">${circleSvg('plan-' + (curKey || 'none'), { uid: 'pl' })}</div>
      <div style="min-width:0"><div class="eyebrow">Your plan</div><h3>${esc((curPlan && curPlan.name) || (bill && bill.plan_name) || 'No plan')}${bill && bill.is_comp ? ' <span class="pill ok" style="vertical-align:middle">Comped</span>' : ''}</h3>
      <div class="small muted">${esc(status)}</div></div></div>
    <div class="cred-big"><b>${left}</b> <span class="muted">of ${total} credits left</span></div>
    <div class="cred-meter"><i></i></div>
    <div class="plan-rows">
      <div><span>Refills</span><span>${refill ? esc(refill) : '—'}</span></div>
      <div><span>Exchange rate</span><span>1 credit = 1 slide</span></div>
      ${usage && usage.extra_post_credits ? `<div><span>Extra credits (don’t expire monthly)</span><span>${usage.extra_post_credits}</span></div>` : ''}
      ${usage && Array.isArray(usage.brands) && usage.brands_limit != null ? `<div><span>Brands</span><span>${usage.brands.length} of ${usage.brands_limit}</span></div>` : (brandCap != null && prof.brands_used != null ? `<div><span>Brands</span><span>${prof.brands_used} of ${brandCap}</span></div>` : '')}
      ${slots ? `<div><span>Campaigns running <span class="muted">(all brands)</span></span><span>${slots.running.length} of ${slots.limit == null ? 'unlimited' : slots.limit}</span></div>` : ''}
    </div>
    ${slots && slots.running.length ? `<details class="slot-det"${slots.limit != null && slots.running.length >= slots.limit ? ' open' : ''}><summary class="small">Which campaigns use a slot</summary><p class="small muted" style="margin:6px 0">A campaign uses a slot until you archive it or its end date passes. Archived posts stay saved.</p>${campSlotsHtml(slots)}</details>` : ''}
    <p class="small muted">A single image costs 1 credit, a 3-slide carousel costs 3. Failed images are refunded automatically.</p>
    <div class="sec-h"><span>${curKey && curKey !== 'free' ? 'Change plan' : 'Get more credits'}</span>
      <div class="seg" role="group" aria-label="Billing period"><button type="button" data-iv="monthly" aria-pressed="${planInterval === 'monthly'}">Monthly</button><button type="button" data-iv="annual" aria-pressed="${planInterval === 'annual'}">Yearly · 2 months free</button></div></div>
    <div class="plan-grid">${tiles}</div>
    <p class="small muted" style="margin-top:12px">Card payments go through Stripe. A new plan starts with its first payment. Cancelling always runs to the end of the period you’ve paid for.</p>
    ${manage ? `<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${manage}</div>` : ''}
    <div class="msg small" id="plMsg" style="margin-top:10px"></div>`;
  requestAnimationFrame(() => setTimeout(() => { const m = body.querySelector('.cred-meter i'); if (m) m.style.width = pct + '%'; }, 60));
  const say = (t, kind = '') => { const m = body.querySelector('#plMsg'); m.textContent = t; m.className = 'msg small ' + kind; };
  if (slots) wireCampSlots(body, slots, () => renderPlan(s, prof));

  body.querySelectorAll('[data-iv]').forEach((b) => b.onclick = () => { planInterval = b.dataset.iv; renderPlan(s, prof); });
  body.querySelectorAll('[data-card]').forEach((b) => b.onclick = async () => {
    if (!prof.client_id) return say('This brand has no billing account yet. Ask us to set it up.', 'err');
    b.disabled = true; say('Opening checkout…');
    try {
      const r = await api('create-stripe-checkout', { body: { ccbPlanKey: b.dataset.card, ccbInterval: planInterval, ccbClientId: prof.client_id } });
      if (!r.url) throw new Error('Could not start checkout.');
      location.href = r.url;
    } catch (e) { if (e.status !== 401) { say(e.message, 'err'); b.disabled = false; } }
  });
  body.querySelectorAll('[data-crypto]').forEach((b) => b.onclick = () => {
    const pl = plans.find((x) => x.key === b.dataset.crypto);
    const tpl = planInterval === 'annual' ? pl.helio_paylink_annual : pl.helio_paylink_monthly;
    if (!tpl || !prof.client_id) return say('Crypto isn’t set up for this plan yet.', 'err');
    const custom = encodeURIComponent(JSON.stringify({ ccbClientId: prof.client_id, plan: `ccb_${pl.key}${planInterval === 'annual' ? '_annual' : ''}` }));
    const url = tpl.includes('{{customData}}') ? tpl.replace('{{customData}}', custom) : tpl + (tpl.includes('?') ? '&' : '?') + 'customData=' + custom;
    if (!safeHttpUrl(url)) return say('That payment link looks wrong. Ask us to check it.', 'err');
    window.open(url, '_blank', 'noopener');
    say('Crypto checkout opened in a new tab. Your plan starts as soon as the payment confirms.', 'ok');
  });
  const manageCall = async (action, btn, okText) => {
    btn.disabled = true;
    try {
      const r = await api('manage-ccb-subscription', { body: { action, brand: S.brand } });
      if (action === 'portal') { if (!r.url) throw new Error('Could not open the billing portal.'); location.href = r.url; return; }
      toast(okText);
      renderPlan(s, await loadProfile());
    } catch (e) { if (e.status !== 401) { say(e.message, 'err'); btn.disabled = false; } }
  };
  const pp = body.querySelector('#plPortal'); if (pp) pp.onclick = () => manageCall('portal', pp);
  const pr = body.querySelector('#plResume'); if (pr) pr.onclick = () => manageCall('resume', pr, 'Your plan will carry on.');
  body.querySelectorAll('[data-change]').forEach((b) => b.onclick = async () => {
    const pl = plans.find((x) => x.key === b.dataset.change);
    const cents = planInterval === 'annual' ? pl.annual_price_cents : pl.price_cents;
    const per = planInterval === 'annual' ? 'year' : 'month';
    if (!(await confirmDialog(`Switch to ${pl.name} at ${money(cents)} / ${per}? Your card is charged the difference for the rest of this billing period now (or credited, if ${pl.name} costs less). Your credits change straight away.`, `Switch to ${pl.name}`))) return;
    b.disabled = true; say('Switching plan…');
    try {
      const r = await api('manage-ccb-subscription', { body: { action: 'change_plan', brand: S.brand, planKey: pl.key, interval: planInterval } });
      toast(r.already ? `You’re already on ${pl.name}.` : `You’re now on ${r.plan_name || pl.name}.`);
      await loadBrand(S.brand); setBrandChrome();
      renderPlan(s, await loadProfile());
    } catch (e) { if (e.status !== 401) { say(e.message, 'err'); b.disabled = false; } }
  });
  const pc = body.querySelector('#plCancel'); if (pc) pc.onclick = async () => {
    if (!(await confirmDialog(`Cancel ${bill.plan_name}? You keep everything until ${fmtLong(bill.current_period_end)}.`, 'Cancel plan', true))) return;
    manageCall('cancel', pc, 'Plan cancelled. It runs to the end of this period.');
  };
}

// Signup funnel, last 30 days (2026-10-10). Steps 1–2 are homepage visitors
// (unique browsers); 3–8 follow the people who first opened the app in the
// window (admins excluded), read from their real brands, posts and approvals.
function funnelHtml(rows) {
  if (!Array.isArray(rows) || !rows.length) return '';
  const top = Math.max(1, ...rows.map((r) => Number(r.people) || 0));
  return `<div class="sec-h"><span>Signup funnel · last 30 days</span></div>
    <div class="card funnel" style="padding:12px 14px">${rows.map((r, i) => {
      const n = Number(r.people) || 0; const prev = i ? Number(rows[i - 1].people) || 0 : 0;
      const keep = i && prev ? Math.round((n / prev) * 100) + '% of previous' : '';
      return `<div class="fn-row"><span class="fn-lbl">${esc(r.step)}</span><span class="fn-bar"><i style="width:${Math.max(2, Math.round((n / top) * 100))}%"></i></span><b>${n}</b><span class="muted small fn-keep">${keep}</span></div>`;
    }).join('')}
    <p class="small muted" style="margin:8px 0 0">Steps 1–3 count homepage visitors. From step 4 it follows people who first opened the app in these 30 days (admins left out). The biggest drop is the step to fix first.</p></div>`;
}
// Homepage A/B results, last 30 days. Rates are per unique visitor.
function abHtml(rows) {
  if (!Array.isArray(rows) || !rows.length) return '';
  const pct = (n, d) => (d ? Math.round((n / d) * 1000) / 10 + '%' : '—');
  const name = { a: 'A · Gallery (light)', b: 'B · Crucible (dark)' };
  const best = rows.filter((r) => r.visitors >= 100).sort((x, y) => (y.signups / y.visitors) - (x.signups / x.visitors))[0];
  return `<div class="sec-h"><span>Homepage A/B test · last 30 days</span></div>
    <div class="card" style="padding:12px 14px;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums">
      <tr class="muted small" style="text-align:left"><th style="padding:4px 6px">Design</th><th>Visitors</th><th>Clicked start</th><th>Saw pricing</th><th>Signed up</th><th>Sign-up rate</th></tr>
      ${rows.map((r) => `<tr><td style="padding:6px">${esc(name[r.variant] || r.variant)}${best && best.variant === r.variant ? ' <span class="pill ok">leading</span>' : ''}</td><td>${r.visitors}</td><td>${r.cta} <span class="muted small">${pct(r.cta, r.visitors)}</span></td><td>${r.pricing} <span class="muted small">${pct(r.pricing, r.visitors)}</span></td><td>${r.signups}</td><td><b>${pct(r.signups, r.visitors)}</b></td></tr>`).join('')}
    </table><p class="small muted" style="margin:8px 0 0">Visitors are split 50/50 and keep their design for 90 days. A leader is only marked once a design has 100+ visitors. Preview either design with ?v=a or ?v=b (not counted).</p></div>`;
}

async function renderAdmin(s, flash) {
  const body = s.el.querySelector('.sheet-body');
  let d, g, ab;
  try {
    [d, g, ab] = await Promise.all([
      api('admin-list-accounts', { method: 'GET' }),
      api('client-access', { method: 'GET' }).catch(() => ({ grants: [] })),
      fetch(SUPABASE_URL + '/rest/v1/rpc/ccb_ab_results', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()), body: JSON.stringify({ p_days: 30 }) }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    S.funnel = await fetch(SUPABASE_URL + '/rest/v1/rpc/cc_funnel_results', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()), body: JSON.stringify({ p_days: 30 }) }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  } catch (e) { if (e.status !== 401) { body.innerHTML = '<div class="notice bad"></div>'; body.firstChild.textContent = e.message; } return; }
  const st = d.stats || {};
  const paid = (d.plans || []).filter((p) => p.price_cents > 0);
  const durs = [[1, '1 month'], [3, '3 months'], [12, '1 year']];
  const acctHtml = (a) => {
    const pills = [
      `<span class="pill ${a.subscription_status === 'active' ? 'ok' : a.subscription_status ? 'bad' : 'idle'}">${esc(a.plan_name || 'No plan')}</span>`,
      a.is_comp ? `<span class="pill warn" title="${esc([a.comp_granted_by, a.comp_note].filter(Boolean).join(' · '))}">Comped${a.comp_ends_at ? ' until ' + esc(fmtLong(a.comp_ends_at)) : ''}</span>` : '',
      a.pays_by_card ? '<span class="pill review">Pays by card</span>' : '',
    ].join('');
    const f = flash && flash.id === a.client_id ? `<div class="notice ${flash.kind}" style="padding:8px 12px">${esc(flash.text)}</div>` : '';
    return `<div class="acct" data-id="${esc(a.client_id)}">
      <div class="acct-top"><div style="min-width:0"><b>${esc(a.client_name)}</b><div class="small muted">${esc((a.brands || []).join(', ') || 'No brands')}</div></div><div class="pills">${pills}</div></div>
      <div class="small muted" style="overflow-wrap:anywhere">${esc((a.user_emails || []).join(', ') || a.contact_email || 'No users yet')}</div>
      <div class="comp-row">
        <select class="select" data-plan aria-label="Plan to comp">${paid.map((p) => `<option value="${esc(p.key)}"${a.is_comp && a.plan_key === p.key ? ' selected' : ''}>${esc(p.name)} · ${p.credits_monthly}/mo</option>`).join('')}</select>
        <select class="select" data-dur aria-label="How long">${durs.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
        <button type="button" class="btn btn-gold btn-sm" data-comp ${a.pays_by_card ? 'disabled title="Cancel their card plan first"' : ''}>${a.is_comp ? 'Re-comp' : 'Comp'}</button>
        ${a.is_comp ? '<button type="button" class="btn btn-danger btn-sm" data-end>End comp</button>' : ''}
      </div>${f}</div>`;
  };
  const brandsAll = Array.from(new Set((d.accounts || []).flatMap((a) => a.brands || []).concat(d.unassigned_brands || []))).sort();
  body.innerHTML = `
    <div class="adm-stats">
      <div><b>${st.total_accounts ?? '—'}</b><span>accounts</span></div>
      <div><b>${st.total_brands ?? '—'}</b><span>brands</span></div>
      <div><b>${st.lifetime_posts_generated ?? '—'}</b><span>credits spent, all time</span></div>
      <div><b>${(d.accounts || []).filter((a) => a.is_comp).length}</b><span>comped now</span></div>
    </div>
    <p class="small muted">A comp gives the plan’s credits every month for the length you pick, then drops the account back to the plan it had before. No charge, no card.</p>
    ${funnelHtml(S.funnel)}
    ${abHtml(ab)}
    <div class="sec-h"><span>Accounts</span></div>
    ${(d.accounts || []).map(acctHtml).join('') || '<div class="card empty-state">No accounts yet.</div>'}
    ${(d.unassigned_brands || []).length ? `<p class="small muted" style="margin-top:10px">Brands with no account: ${esc(d.unassigned_brands.join(', '))}</p>` : ''}
    <div class="sec-h"><span>Who can see which brand</span></div>
    <div class="comp-row" style="display:flex;gap:8px;flex-wrap:wrap">
      <input class="input" id="agEmail" type="email" placeholder="name@company.com" style="flex:2 1 200px" aria-label="Email">
      <select class="select" id="agBrand" style="flex:1 1 140px;width:auto" aria-label="Brand">${brandsAll.map((b) => `<option>${esc(b)}</option>`).join('')}</select>
      <button type="button" class="btn btn-ghost btn-sm" id="agGrant">Give access</button>
    </div>
    <div id="agList" style="margin-top:8px">${(g.grants || []).map((x) => `<div class="grant"><span>${esc(x.email)} · <b>${esc(x.brand)}</b></span><button type="button" class="btn btn-danger btn-sm" data-revoke="${esc(x.email)}" data-rb="${esc(x.brand)}">Remove</button></div>`).join('') || '<div class="small muted">Nobody has been given access yet.</div>'}</div>

  body.querySelectorAll('.acct').forEach((row) => {
    const id = row.dataset.id; const acc = d.accounts.find((a) => a.client_id === id);
    const cb = row.querySelector('[data-comp]');
    cb.onclick = async () => {
      const planKey = row.querySelector('[data-plan]').value; const months = Number(row.querySelector('[data-dur]').value);
      const pl = paid.find((p) => p.key === planKey);
      const dur = durs.find(([v]) => v === months)[1];
      if (!(await confirmDialog(`Comp ${acc.client_name} on ${pl.name} for ${dur}? They get ${pl.credits_monthly} credits each month, free.`, 'Comp it'))) return;
      cb.disabled = true;
      try {
        const r = await api('admin-grant-comp', { body: { action: 'grant', clientId: id, planKey, durationMonths: months } });
        toast(`${acc.client_name} comped on ${r.plan_name} until ${fmtLong(r.comp_ends_at)}.`);
        if (S.brandData && (acc.brands || []).includes(S.brand)) { await loadBrand(S.brand).catch(() => {}); setBrandChrome(); }
        renderAdmin(s, { id, kind: 'ok', text: `Comped on ${r.plan_name} until ${fmtLong(r.comp_ends_at)}.` });
      } catch (e) { if (e.status !== 401) { cb.disabled = false; renderAdmin(s, { id, kind: 'bad', text: e.message }); } }
    };
    const eb = row.querySelector('[data-end]');
    if (eb) eb.onclick = async () => {
      if (!(await confirmDialog(`End ${acc.client_name}'s comp now? They go back to their previous plan today.`, 'End comp', true))) return;
      eb.disabled = true;
      try {
        const r = await api('admin-grant-comp', { body: { action: 'end', clientId: id } });
        toast(`Comp ended. ${acc.client_name} is on ${r.plan_name || 'their previous plan'}.`);
        if (S.brandData && (acc.brands || []).includes(S.brand)) { await loadBrand(S.brand).catch(() => {}); setBrandChrome(); }
        renderAdmin(s, { id, kind: 'ok', text: `Comp ended. Now on ${r.plan_name || 'their previous plan'}.` });
      } catch (e) { if (e.status !== 401) { eb.disabled = false; renderAdmin(s, { id, kind: 'bad', text: e.message }); } }
    };
  });
  const say = (t, kind = '') => { const m = body.querySelector('#agMsg'); m.textContent = t; m.className = 'msg small ' + kind; };
  body.querySelector('#agGrant').onclick = async () => {
    const email = body.querySelector('#agEmail').value.trim(); const brand = body.querySelector('#agBrand').value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !brand) return say('Enter an email and pick a brand.', 'err');
    const b = body.querySelector('#agGrant'); b.disabled = true; say('Giving access…');
    try {
      const r = await api('client-access', { body: { action: 'grant', email, brand } });
      toast(r.invited ? `Invited ${email} to ${brand}.` : `${email} can now see ${brand}.`);
      renderAdmin(s);
    } catch (e) { if (e.status !== 401) { say(e.message, 'err'); b.disabled = false; } }
  };
  body.querySelectorAll('[data-revoke]').forEach((b) => b.onclick = async () => {
    if (!(await confirmDialog(`Remove ${b.dataset.revoke}'s access to ${b.dataset.rb}?`, 'Remove', true))) return;
    b.disabled = true;
    try { await api('client-access', { body: { action: 'revoke', email: b.dataset.revoke, brand: b.dataset.rb } }); toast('Access removed.'); renderAdmin(s); }
    catch (e) { if (e.status !== 401) { say(e.message, 'err'); b.disabled = false; } }
  });
}

/* ── Mark as posted (real workflow + XP) ─────────────────────────────── */
function openMarkPosted(p) {
  closeMenus();
  const camp = S.campaigns.find((c) => c.id === p.campaign_id);
  const plats = requiredPlatforms(p) || (camp && camp.target_platforms && camp.target_platforms.length ? camp.target_platforms : defaultPlatforms());
  const keyOf = (name) => ({ Instagram: 'instagram', TikTok: 'tiktok', X: 'x', LinkedIn: 'linkedin', Facebook: 'facebook', Pinterest: 'pinterest', YouTube: 'youtube', Evrylife: 'evrylife', Reddit: 'reddit' }[name]);
  const s = openSheet({
    title: 'Mark as posted', dialog: true,
    body: `<div class="stack"><p class="muted">Where did this go out? The live link is optional.</p>
      <div class="posted-plats">${PLATFORMS.filter((n) => { const own = brandPlatformNames(); return !own || own.includes(n) || p[keyOf(n) + '_posted_at'] || p[keyOf(n) + '_post_link']; }).map((n) => { const k = keyOf(n); const on = !!(p[k + '_posted_at'] || p[k + '_post_link']); return `<button type="button" class="chip" data-k="${k}" aria-pressed="${on || (!PLATFORMS.some((x) => p[keyOf(x) + '_posted_at']) && plats.includes(n) && plats.length === 1)}">${esc(n)}</button>`; }).join('')}</div>
      <div class="field"><label for="mpLink">Live post link <span class="muted">(optional)</span></label><input class="input" id="mpLink" placeholder="https://"></div></div>`,
    foot: `<span class="msg"></span><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="button" class="btn btn-gold" id="mpGo">Save</button>`,
  });
  $$('.posted-plats .chip', s.el).forEach((b) => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'));
  $('#mpGo', s.el).onclick = async () => {
    const chosen = $$('.posted-plats .chip[aria-pressed="true"]', s.el).map((b) => b.dataset.k);
    const raw = $('#mpLink', s.el).value.trim(); const link = raw ? normalizeUrl(raw) : '';
    if (!chosen.length) return s.msg('Pick at least one platform.', 'err');
    if (raw && !link) return s.msg('That link isn’t a valid web address.', 'err');
    const patch = {};
    chosen.forEach((k) => { if (!p[k + '_posted_at']) patch[k + '_posted_at'] = true; });
    if (link) patch[chosen[0] + '_post_link'] = link;
    if (!Object.keys(patch).length) { s.close(); return; }
    $('#mpGo', s.el).disabled = true; s.msg('Saving…');
    try {
      const r = await api('update-client-post', { body: { brand: S.brand, sku: p.sku, patch } });
      Object.assign(p, r.row || {});
      s.close(); renderCampaign(); toast('Marked as posted. +3 XP');
      loadProgress(true);
    } catch (e) { $('#mpGo', s.el).disabled = false; if (e.status !== 401) s.msg(e.message, 'err'); }
  };
}

<script>
'use strict';
/* ── Posted to · live links · results (2026-10-09) ──────────────────────
   Brad: "there is no step to actually mark a post 'posted for X' ... i'd
   like to use check boxes to manually show what has been posted ... if user
   wants they can populate live link, or alchemist upon review can find live
   links, and examine if content was any success in shares, comments, views".
   Each post card shows a checkbox per platform. Ticking saves
   {platform}_posted_at (update-client-post). The Results sheet takes the live
   link and the numbers, or asks the Alchemist to read them off the public
   post page (post-results). Every result feeds the brand's knowledge base. */

const PLAT_NAME = { instagram: 'Instagram', tiktok: 'TikTok', x: 'X', linkedin: 'LinkedIn', facebook: 'Facebook', pinterest: 'Pinterest', youtube: 'YouTube', evrylife: 'Evrylife', reddit: 'Reddit' };
const PLAT_ORDER = ['instagram', 'tiktok', 'x', 'linkedin', 'facebook', 'pinterest', 'youtube', 'evrylife', 'reddit'];
const METRICS = [['views', 'Views'], ['likes', 'Likes'], ['comments', 'Comments'], ['shares', 'Shares'], ['saves', 'Saves'], ['clicks', 'Link clicks']];
const platKey = (name) => PLAT_ORDER.find((k) => PLAT_NAME[k].toLowerCase() === String(name || '').toLowerCase());
const isPostedOn = (p, k) => !!(p[k + '_posted_at'] || p[k + '_post_link']);
// Export tracking (2026-10-11): an account handed to a scheduler through

const TOOL_NAME = { metricool: 'Metricool', buffer: 'Buffer', any: 'your scheduler', export: 'your scheduler' };

}

const fmtN = (n) => (n >= 1e6 ? (Math.round(n / 1e5) / 10) + 'M' : n >= 1e5 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? (Math.round(n / 100) / 10) + 'K' : String(n));
S.results = S.results || {};

  });

/* ── Quick post (2026-10-11) ──────────────────────────────────────────
   Brad: "a shortcut link to open their own social from each post's checkbox

   account, so it's quick to click and post." The paper-plane next to an
   account copies the caption (with link and hashtags) and opens that
   network: X and LinkedIn open a new post with the text filled in; the
   others open the brand's own profile (from Brand settings), which phones

const POST_HOME = { instagram: 'https://www.instagram.com/', tiktok: 'https://www.tiktok.com/upload', x: 'https://x.com/compose/post', linkedin: 'https://www.linkedin.com/feed/', facebook: 'https://www.facebook.com/', pinterest: 'https://www.pinterest.com/pin-builder/', youtube: 'https://studio.youtube.com/', evrylife: 'https://evrylife.org/', reddit: 'https://www.reddit.com/submit' };

function tidyCopy(t) { return String(t == null ? '' : t).replace(/^[\s\u200B-\u200D\u2060\uFEFF]+/, '').replace(/[\s\u200B-\u200D\u2060\uFEFF]+$/, '').replace(/\r\n?/g, '\n').replace(/\n{3,}/g, '\n\n'); }

  const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', '');
  t.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0'; document.body.appendChild(t); t.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (_e) { ok = false; }

}
/* ── A caption for each network (2026-10-12) ─────────────────────────────
