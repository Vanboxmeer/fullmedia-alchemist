   might need to be shorter for X than LinkedIn ... brand settings should
   mention free X or pro X". Each network now gets its own fitted caption:
   - Limits as published (checked 2026-10-12): X 280 characters on Free and
     25,000 on Premium (links count as 23); Instagram 2,200 with at most 5
     hashtags (Instagram's cap since Dec 2025); TikTok 2,200; LinkedIn 3,000;
     Facebook 5,000; Pinterest 500; YouTube 5,000.

     them. Fewer on X (2) and on LinkedIn, Facebook and YouTube (3).
   - Links can't be tapped in Instagram, TikTok or Pinterest descriptions,
     so the link is left out there (bio, link sticker or the Pin's link).

const MENT_NETS = { instagram: 'Instagram', x: 'X', tiktok: 'TikTok', facebook: 'Facebook' };
function mentionList(p) {

const NET = {

  tiktok: { max: 2200, tags: 5, link: 'off', why: 'Links in TikTok captions can’t be tapped, so the link is left out. Put it in your bio.' },
  x: { max: 280, tags: 2, link: 'in' },
  linkedin: { max: 3000, tags: 3, link: 'in' },
  facebook: { max: 5000, tags: 3, link: 'in' },
  pinterest: { max: 500, tags: 5, link: 'off', why: 'Pinterest links go in the Pin’s link box, not the description.' },
  youtube: { max: 5000, tags: 3, link: 'in' },
  evrylife: { max: 0, tags: 10, link: 'in' },
  reddit: { max: 40000, tags: 0, link: 'in' },

S.socialPlans = S.socialPlans || {};
const xPremium = () => ((S.socialPlans[S.brand] || {}).X === 'premium');

      <p class="small muted" style="margin:0">Each account gets a caption that fits it: ${xPremium() ? 'X Premium (25,000 characters)' : 'X Free (280 characters)'}, up to 5 hashtags on Instagram, fewer on X and LinkedIn, and no link where links can’t be tapped. Edit one here and it’s saved for that account.${xPremium() ? '' : ' X Premium? Set it in <a href="#" data-xplan>Brand settings</a>.'}</p>
      ${list.map((k) => `<div class="cap" data-k="${k}">
        <div class="cap-h"><b>${esc(PLAT_NAME[k])}</b><span class="cap-n small" data-n></span></div>
        <textarea class="textarea cap-t" rows="5" maxlength="25000" aria-label="${esc(PLAT_NAME[k])} caption"></textarea>
        <div class="cap-f"><span class="small muted" data-note></span><span class="cap-b"><button type="button" class="btn btn-ghost btn-sm" data-reset hidden>Back to automatic</button><button type="button" class="btn btn-ghost btn-sm" data-save hidden>Save</button><button type="button" class="btn btn-gold btn-sm" data-copy>Copy &amp; open</button></span></div>
      </div>`).join('')}
    </div>`,
    foot: '<span class="msg"></span><button type="button" class="btn btn-gold" data-close>Done</button>',
  });
  const el = s.el;
  const xp = $('[data-xplan]', el); if (xp) xp.onclick = (e) => { e.preventDefault(); s.close(); setTimeout(() => openBrandSettings(false, 'socials'), 280); };
  $$('.cap', el).forEach((box) => {
    const k = box.dataset.k; const ta = $('textarea', box);
    const paint = () => {
      const c = captionFor(p, k); const cur = ta.value; const len = netLen(k, cur); const max = netMax(k);
      const n = $('[data-n]', box); n.textContent = max ? `${len.toLocaleString()} / ${max.toLocaleString()}` : `${len.toLocaleString()} characters`;
      n.classList.toggle('over', !!max && len > max);
      const dirty = cur.trim() !== c.text.trim();
      $('[data-save]', box).hidden = !dirty;
      $('[data-reset]', box).hidden = !c.saved || dirty;
      const tags = tagsOf(cur).length;
      $('[data-note]', box).textContent = [c.saved && !dirty ? 'Saved for ' + PLAT_NAME[k] : (!c.saved && !dirty ? captionNote(p, k, c) : ''), k === 'instagram' && tags > 5 ? 'Instagram allows 5 hashtags' : '', !!max && len > max ? `${(len - max).toLocaleString()} over` : '', !dirty && !c.saved && c.linkLeft ? 'no link (can’t be tapped here)' : ''].filter(Boolean).join(' · ');
    };
    ta.value = captionFor(p, k).text; paint();
    ta.addEventListener('input', paint);
    const save = async (text) => {
      try {
        const r = await rpc('cc_platform_copy_set', { p_brand: S.brand, p_sku: p.sku, p_platform: k, p_text: text });
        S.platCopy = S.platCopy || {}; S.platCopy[p.sku] = r || {};
        return true;
      } catch (e) { if (e.status !== 401) s.msg(e.message, 'err'); return false; }
    };
    $('[data-save]', box).onclick = async () => { if (await save(ta.value)) { paint(); s.msg(`${PLAT_NAME[k]} caption saved.`, 'ok'); } };
    $('[data-reset]', box).onclick = async () => { if (await save('')) { ta.value = captionFor(p, k).text; paint(); s.msg(`${PLAT_NAME[k]} is back to the automatic caption.`, 'ok'); } };
    $('[data-copy]', box).onclick = () => {
      const dirty = ta.value.trim() !== captionFor(p, k).text.trim();
      if (dirty) { S.platCopy = S.platCopy || {}; S.platCopy[p.sku] = Object.assign({}, S.platCopy[p.sku], { [k]: ta.value }); save(ta.value).then(paint); }
      quickPost(p, k);
    };
  });
  if (focusK) { const t = $(`.cap[data-k="${focusK}"] textarea`, el); if (t) setTimeout(() => t.focus(), 300); }
}
function refreshPostedRow(card, p) {
  const box = $('[data-pr]', card); if (!box) return;
  box.outerHTML = postedRowHtml(p);
  const pill = $('.card-badge.pill', card) || $('.post-top .pill', card); if (pill) { const [st, cls] = stageOf(p); pill.className = 'card-badge pill ' + cls; pill.textContent = stageLabel(p, st); }
  wirePostedRow(card, p);
}
function stageLabel(p, st) {
  if (st !== 'Posted') return st;
  const miss = missingAccounts(p);
  if (miss.length && needsFinishing(p)) return 'Still to post: ' + miss.join(', ');
  const pc = postedCount(p);
  if (allPosted(p)) return 'Posting complete';
  const sched = schedKeys(p).filter((k) => !isPostedOn(p, k)).length;
  return `Posted ${pc.done} of ${pc.of}${sched && !miss.length ? ' · rest sent to scheduler' : ''}`;
}
function wirePostedRow(card, p) {
  const box = $('[data-pr]', card); if (!box) return;
  const more = $('[data-prmore]', box); if (more) more.onclick = () => { S.prMore[p.sku] = true; refreshPostedRow(card, p); };
  $$('[data-addacct]', box).forEach((a) => a.onclick = (e) => { e.preventDefault(); openBrandSettings(false, 'socials'); });
  $$('[data-go]', box).forEach((b) => b.onclick = () => quickPost(p, b.dataset.go));
  { const c = $('[data-caps]', box); if (c) c.onclick = () => openCaptions(p); }
  const op = $('[data-results]', box); if (op) op.onclick = () => openResults(p);
  $$('input[type="checkbox"]', box).forEach((cb) => cb.onchange = async () => {
    const k = cb.dataset.k; const on = cb.checked;
    if (!on && p[k + '_post_link'] && !await confirmDialog(`Untick ${PLAT_NAME[k]}? Its saved live link is removed too. Results already saved are kept.`, 'Untick')) { cb.checked = true; return; }
    cb.disabled = true;
    const patch = on ? { [k + '_posted_at']: true } : { [k + '_posted_at']: null, [k + '_post_link']: null };
    try {
      const r = await api('update-client-post', { body: { brand: S.brand, sku: p.sku, patch } });
      Object.assign(p, r.row || {});
      if (!r.row) { if (on) p[k + '_posted_at'] = new Date().toISOString(); else { p[k + '_posted_at'] = null; p[k + '_post_link'] = null; } }
      refreshPostedRow(card, p);
      // Heads-up when a post goes out ahead of earlier-dated ones still waiting.
      const earlier = on && p.scheduled_date ? S.posts.filter((x) => x.campaign_id === p.campaign_id && x.sku !== p.sku && dueIn(x) != null && String(x.scheduled_date) < String(p.scheduled_date)).length : 0;
      toast(on ? `Marked as posted on ${PLAT_NAME[k]}.${earlier ? ` Heads-up: ${earlier} post${earlier === 1 ? '' : 's'} dated earlier ${earlier === 1 ? 'hasn’t' : 'haven’t'} gone out yet.` : ''}` : `${PLAT_NAME[k]} unticked.`, earlier ? 'info' : 'ok', earlier ? 7000 : 4200);
      if (on) { loadProgress(true); kbNudge(); }
    } catch (e) { cb.checked = !on; cb.disabled = false; if (e.status !== 401) toast(e.message, 'err'); }
  });
}

async function loadResults(campaignId, force) {
  if (!campaignId || !S.brand) return;
  const key = S.brand + '|' + campaignId;
  if (!force && S.resultsLoaded[key] && Date.now() - S.resultsLoaded[key] < 60000) return;
  S.resultsLoaded[key] = Date.now();
  try {
    const r = await api('post-results', { body: { brand: S.brand, action: 'list', campaignId } });
    (r.results || []).forEach((row) => { S.results[row.sku + '|' + row.platform] = row; });
    if (S.view === 'campaign' && S.campaignId === campaignId) {
      $$('.post').forEach((card) => { const p = S.posts.find((x) => x.sku === card.dataset.sku); if (p) refreshPostedRow(card, p); });
    }
  } catch (e) { delete S.resultsLoaded[key]; }
}

function openResults(p, onlyK) {
  closeMenus();
  const posted = PLAT_ORDER.filter((k) => isPostedOn(p, k));
  const keys = onlyK ? [onlyK] : posted;
  const sec = (k) => {
    const r = S.results[p.sku + '|' + k] || {};
    const when = r.captured_at ? `${r.source === 'alchemist' ? 'Read by the Alchemist' : 'Saved'} ${esc(fmtDate(String(r.captured_at).slice(0, 10)))}` : 'No results yet';
    return `<section class="prs" data-k="${k}">
      <div class="prs-head"><b>${esc(PLAT_NAME[k])}</b><span class="small muted">${when}</span></div>
      <div class="field"><label for="prl-${k}">Live post link</label>
        <div class="row"><input class="input" id="prl-${k}" data-link inputmode="url" placeholder="https://" value="${esc(p[k + '_post_link'] || '')}"></div></div>
      <div class="prs-grid">${METRICS.map(([m, l]) => `<label class="prs-n"><span>${esc(l)}</span><input class="input" type="number" min="0" step="1" inputmode="numeric" data-m="${m}" value="${typeof r[m] === 'number' ? r[m] : ''}" placeholder="—"></label>`).join('')}</div>
      <input class="input" data-note maxlength="500" placeholder="Note (optional), e.g. "shared by a partner page"" value="${esc(r.note || '')}">
      <div class="prs-act"><button type="button" class="btn btn-sm btn-ghost" data-check>${icons.spark} Have the Alchemist check</button><div class="spacer"></div><button type="button" class="btn btn-sm btn-gold" data-save>Save</button></div>
      <p class="prs-msg small" aria-live="polite"></p>
    </section>`;
  };
  const s = openSheet({
    title: 'Live links & results',
    body: keys.length
      ? `<div class="stack"><p class="muted small" style="margin:0">Add the link to the live post and the numbers from the app’s insights. Or let the Alchemist read the numbers off the public post page (most platforms only show some of them to visitors). Results teach the Alchemist what works for ${esc(S.brand)}.</p>${keys.map(sec).join('')}</div>`
      : '<div class="notice warn">Tick where this post went out first (the "Posted to" boxes on the post), then add its links and results here.</div>',
    foot: '<button type="button" class="btn btn-ghost" data-close>Done</button>',
  });
  const card = () => $(`.post[data-sku="${CSS.escape(p.sku)}"]`);
  $$('.prs', s.el).forEach((box) => {
    const k = box.dataset.k;
    const say = (t, kind = '') => { const m = $('.prs-msg', box); m.textContent = t; m.className = 'prs-msg small ' + kind; };
    const saveLink = async () => {
      const raw = $('[data-link]', box).value.trim(); const link = raw ? normalizeUrl(raw) : '';
      if (raw && !link) { say('That link isn’t a valid web address.', 'err'); return false; }
      if ((link || '') === (p[k + '_post_link'] || '')) return true;
      const r = await api('update-client-post', { body: { brand: S.brand, sku: p.sku, patch: { [k + '_post_link']: link || null, ...(link && !p[k + '_posted_at'] ? { [k + '_posted_at']: true } : {}) } } });
      Object.assign(p, r.row || { [k + '_post_link']: link || null });
      return true;
    };
    $('[data-save]', box).onclick = async (e) => {
      const btn = e.currentTarget; btn.disabled = true; say('Saving…');
      try {
        if (!await saveLink()) { btn.disabled = false; return; }
        const body = { brand: S.brand, action: 'save', sku: p.sku, platform: k, note: $('[data-note]', box).value.trim() };
        let any = !!body.note;
        $$('[data-m]', box).forEach((i) => { const v = i.value.trim(); if (v !== '') { body[i.dataset.m] = Math.max(0, Math.round(Number(v))); any = true; } });
        if (any) {
          await api('post-results', { body });
          const row = { ...(S.results[p.sku + '|' + k] || {}), sku: p.sku, platform: k, source: 'user', note: body.note || null, captured_at: new Date().toISOString() };
          METRICS.forEach(([m]) => { if (typeof body[m] === 'number') row[m] = body[m]; });
          S.results[p.sku + '|' + k] = row;
          say('Saved. The Alchemist will learn from it.', 'ok');
        } else say('Link saved.', 'ok');
        const c = card(); if (c) refreshPostedRow(c, p);
      } catch (err) { if (err.status !== 401) say(err.message, 'err'); }
      btn.disabled = false;
    };
    $('[data-check]', box).onclick = async (e) => {
      const btn = e.currentTarget;
      if (!$('[data-link]', box).value.trim()) { say('Add the live post link first.', 'err'); return; }
      btn.disabled = true; say('The Alchemist is reading the post…');
      try {
        if (!await saveLink()) { btn.disabled = false; return; }
        const r = await api('post-results', { body: { brand: S.brand, action: 'check', sku: p.sku, platform: k } });
        if (r.found) {
          METRICS.forEach(([m]) => { if (typeof r.numbers[m] === 'number') $(`[data-m="${m}"]`, box).value = r.numbers[m]; });
          S.results[p.sku + '|' + k] = { ...(S.results[p.sku + '|' + k] || {}), sku: p.sku, platform: k, source: 'alchemist', evidence: r.evidence, captured_at: new Date().toISOString(), ...r.numbers };
          say('Found and saved: ' + METRICS.filter(([m]) => typeof r.numbers[m] === 'number').map(([m, l]) => `${fmtN(r.numbers[m])} ${l.toLowerCase()}`).join(', ') + '.', 'ok');
          const c = card(); if (c) refreshPostedRow(c, p);
        } else say(r.message || 'No public numbers on that page. Add them yourself from the app.', '');
      } catch (err) { if (err.status !== 401) say(err.message, 'err'); }
      btn.disabled = false;
    };
  });
}
</script>
<script>
'use strict';
/* ── Report a problem + Admin problem inbox (2026-10-09) ────────────────
   Brad: "we need those types to automatically come to us, or for the
   alchemist to direct user to a 'report a problem' module." Reports go to
   the support function, which saves them and emails the team. The Alchemist
   chat files one too when someone describes a problem (alchemist-assist). */

const KIND_LABELS = [['bug', 'Something isn’t working'], ['content', 'A post came out wrong'], ['billing', 'Billing or credits'], ['feature', 'An idea or request'], ['question', 'A question'], ['other', 'Something else']];
const STATUS_LABELS = { open: ['Open', 'review'], in_progress: ['Working on it', 'warn'], resolved: ['Resolved', 'ok'], wont_fix: ['Closed', 'idle'] };
function supportContext() {
  const plan = S.brandData && S.brandData.subscription && (S.brandData.subscription.plan_name || S.brandData.subscription.plan_key);
  return {
    view: S.view || '', campaign: S.view === 'campaign' ? (S.campaigns.find((c) => c.id === S.campaignId) || {}).name || '' : '',
    url: location.pathname, ua: navigator.userAgent.slice(0, 200), screen: `${innerWidth}x${innerHeight}`, plan: plan || '',
  };
}

function openReport(pre = {}) {
  closeMenus();
  const s = openSheet({
    title: 'Report a problem',
    body: `<div class="stack">
      <p class="muted small" style="margin:0">Tell us what happened. It goes straight to the Fullmedia Alchemist team, and we reply by email to ${esc(S.email)}. We add which page you were on and your browser, so you don’t have to.</p>
      <div class="field"><label for="rpKind">What kind of problem?</label><select class="select" id="rpKind">${KIND_LABELS.map(([k, l]) => `<option value="${k}"${pre.kind === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="field"><label for="rpSum">In a few words</label><input class="input" id="rpSum" maxlength="300" placeholder="e.g. The download button does nothing on my phone"></div>
      <div class="field"><label for="rpDet">What happened? <span class="muted">(optional)</span></label><textarea class="textarea" id="rpDet" maxlength="5000" rows="5" placeholder="What you did, what you expected, what you saw instead. Post or campaign names help."></textarea></div>
      <div id="rpMine"></div></div>`,
    foot: '<span class="msg"></span><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="button" class="btn btn-gold" id="rpGo">Send to the team</button>',
  });
  if (pre.summary) $('#rpSum', s.el).value = pre.summary;
  setTimeout(() => $('#rpSum', s.el).focus(), 80);
  api('support', { body: { action: 'mine' } }).then((r) => {
    const t = (r.tickets || []).slice(0, 5); if (!t.length) return;
    $('#rpMine', s.el).innerHTML = `<div class="label" style="margin-bottom:6px">Your recent reports</div>${t.map((x) => { const [l, c] = STATUS_LABELS[x.status] || ['Open', 'review']; return `<div class="rp-mine"><span class="pill ${c}">${l}</span><span class="rp-t">#${x.ticket_no} · ${esc(x.summary)}</span><span class="small muted">${esc(fmtDate(String(x.created_at).slice(0, 10)))}</span></div>`; }).join('')}`;
  }).catch(() => {});
  $('#rpGo', s.el).onclick = async () => {
    const summary = $('#rpSum', s.el).value.trim();
    if (summary.length < 3) return s.msg('Tell us in a few words what went wrong.', 'err');
    $('#rpGo', s.el).disabled = true; s.msg('Sending…');
    try {
      const r = await api('support', { body: { action: 'create', brand: S.brand || '', kind: $('#rpKind', s.el).value, summary, details: $('#rpDet', s.el).value.trim(), context: supportContext() } });
      s.close(); toast(`Sent — problem #${r.ticket_no}. We’ll reply by email.`, 'ok', 6000);
    } catch (e) { $('#rpGo', s.el).disabled = false; if (e.status !== 401) s.msg(e.message, 'err'); }
  };
}

async function openProblems(filter = 'open') {
  closeMenus();
  const s = openSheet({ title: 'Problem reports', body: '<div class="stack"><div class="skel" style="height:90px"></div><div class="skel" style="height:90px"></div></div>' });
  const body = s.el.querySelector('.sheet-body');
  const render = async () => {
    let d;
    try { d = await api('support', { body: { action: 'admin_list' } }); }
    catch (e) { if (e.status !== 401) { body.innerHTML = '<div class="notice bad"></div>'; body.firstChild.textContent = e.message; } return; }
    const all = d.tickets || [];
    const shown = filter === 'open' ? all.filter((t) => t.status === 'open' || t.status === 'in_progress') : all;
    body.innerHTML = `<div class="stack">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap"><div class="seg">${[['open', `Open (${d.open || 0})`], ['all', `All (${all.length})`]].map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}</div>
        <span class="small muted">Each new report is also emailed to brad@unitedpress.media.</span></div>
      ${shown.length ? shown.map((t) => {
        const [sl, sc] = STATUS_LABELS[t.status] || ['Open', 'review'];
        const kind = (KIND_LABELS.find(([k]) => k === t.kind) || [0, t.kind])[1];
        const ctx = t.context && typeof t.context === 'object' ? Object.entries(t.context).filter(([k]) => k !== 'session').map(([k, v]) => `${k}: ${v}`).join(' · ') : '';
        return `<div class="acct tk" data-id="${esc(t.id)}">
          <div class="acct-top"><div style="min-width:0"><b>#${t.ticket_no} · ${esc(t.summary)}</b>
            <div class="small muted">${esc(t.email || '')}${t.brand ? ' · ' + esc(t.brand) : ''} · ${esc(fmtLong(t.created_at))} · ${t.source === 'chat' ? 'from the Alchemist chat' : 'from the form'}</div></div>
            <div class="pills"><span class="pill idle">${esc(kind)}</span><span class="pill ${sc}">${sl}</span></div></div>
          ${t.details ? `<div class="tk-det"></div>` : ''}
          ${ctx ? `<div class="small muted tk-ctx"></div>` : ''}
          <div class="tk-row"><select class="select" data-st>${Object.entries(STATUS_LABELS).map(([k, [l]]) => `<option value="${k}"${t.status === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
            <input class="input" data-note maxlength="2000" placeholder="Private note" value="${esc(t.admin_note || '')}">
            <button type="button" class="btn btn-sm btn-gold" data-save>Save</button>
            ${t.source === 'chat' ? '<button type="button" class="btn btn-sm btn-ghost" data-chat>Read the chat</button>' : ''}
            ${t.email ? `<a class="btn btn-sm btn-quiet" href="mailto:${esc(t.email)}?subject=${encodeURIComponent('Re: problem #' + t.ticket_no)}">Email them</a>` : ''}</div>
          <div class="tk-chat"></div>
        </div>`;
      }).join('') : '<div class="card empty-state">Nothing here.</div>'}
    </div>`;
    // Report text is set as text, never as markup.
    shown.forEach((t) => {
      const row = body.querySelector(`.tk[data-id="${CSS.escape(t.id)}"]`); if (!row) return;
      const det = $('.tk-det', row); if (det) det.textContent = t.details;
      const cx = $('.tk-ctx', row); if (cx) cx.textContent = Object.entries(t.context || {}).filter(([k]) => k !== 'session').map(([k, v]) => `${k}: ${v}`).join(' · ');
      $('[data-save]', row).onclick = async (e) => {
        e.currentTarget.disabled = true;
        try { await api('support', { body: { action: 'admin_update', id: t.id, status: $('[data-st]', row).value, admin_note: $('[data-note]', row).value } }); toast('Saved.'); render(); }
        catch (err) { e.currentTarget.disabled = false; if (err.status !== 401) toast(err.message, 'err'); }
      };
      const ch = $('[data-chat]', row);
      if (ch) ch.onclick = async () => {
        const box = $('.tk-chat', row); ch.disabled = true;
        try {
          const r = await api('support', { body: { action: 'admin_chats', ticket_id: t.id } });
          const msgs = (r.messages || []).slice().reverse();
          box.innerHTML = msgs.length ? msgs.map(() => '<div class="tk-msg"><b></b><span></span></div>').join('') : '<p class="small muted">No saved messages.</p>';
          $$('.tk-msg', box).forEach((el, i) => { el.classList.add(msgs[i].role === 'user' ? 'me' : 'ai'); el.querySelector('b').textContent = msgs[i].role === 'user' ? 'User' : 'Alchemist'; el.querySelector('span').textContent = msgs[i].content; });
        } catch (err) { ch.disabled = false; if (err.status !== 401) toast(err.message, 'err'); }
      };
    });
    $$('.seg button', body).forEach((b) => b.onclick = () => { filter = b.dataset.f; render(); });
  };
  render();
}
</script>
<script>

/* ── Review my top posts → similar campaigns (2026-10-09) ───────────────
   Brad: "option to 'review my top posts' on one of a brands social
   accounts, or even specific posts.. and make similar campaigns."
   Uses results saved in the app plus links the user pastes
   (review-top-posts). Each suggested campaign gets a Start button. */
function openTopReview() {
  closeMenus();
  if (!S.brand) { toast('Pick or create a brand first.', 'info'); return; }
  if (typeof alch !== 'undefined' && alch.open) alch.close();
  const s = openSheet({
    title: 'Review my top posts',
    body: `<div class="stack" id="trForm">

      ${confirmPosts().length ? `<div class="notice warn ck-ask" style="margin:0">${confirmPosts().length} post${confirmPosts().length === 1 ? '' : 's'} you sent to your scheduler ${confirmPosts().length === 1 ? 'isn’t' : 'aren’t'} confirmed yet, so the review can’t count ${confirmPosts().length === 1 ? 'it' : 'them'}. <a href="#" data-checkin>Did ${confirmPosts().length === 1 ? 'it' : 'they'} go out?</a></div>` : ''}
      <div class="field"><span class="label">Which accounts?</span><div class="chips" id="trPlats">${trPlatChips()}</div>
        <span class="hint">It reads the posts you’ve marked as posted on these accounts, with their live links and the results saved here. Nothing to paste.</span></div>
      <label class="tr-chk"><input type="checkbox" id="trUse" checked> <span>Use the results saved on posts here</span></label>
      <details class="tr-more"><summary>Add other post links <span class="muted">(optional)</span></summary>
      <div class="field"><label for="trLinks">Links to your best posts <span class="muted">(one per line, up to 10)</span></label>
        <textarea class="textarea" id="trLinks" rows="4" placeholder="https://www.youtube.com/watch?v=…&#10;https://www.linkedin.com/posts/…&#10;https://www.instagram.com/p/…"></textarea>
        <span class="hint">For posts that didn’t go out through here. Paste links to single posts, not profiles: Instagram, TikTok, X and Facebook hide profiles from visitors who aren’t signed in.</span></div></details>
      <div class="field"><label for="trNote">Why do you think they worked? <span class="muted">(optional)</span></label>

    <div id="trWhere"></div><div id="trOut"></div>`,
    foot: '<span class="msg"></span><button type="button" class="btn btn-ghost" data-close>Close</button><button type="button" class="btn btn-gold" id="trGo">' + icons.spark + ' Review</button>',
  });
  const go = $('#trGo', s.el);
  paintWhereWorks($('#trWhere', s.el));
  $$('[data-checkin]', s.el).forEach((a) => a.onclick = (e) => { e.preventDefault(); s.close(); setTimeout(() => openCheckins(), 280); });
  $$('#trPlats .chip', s.el).forEach((c) => c.onclick = () => c.setAttribute('aria-pressed', String(c.getAttribute('aria-pressed') !== 'true')));
  go.onclick = async () => {

}
// The brand's accounts from Brand settings (all on), else its platforms.
/* 2026-10-30: Brad: the app should help the user get better over time by reflecting, per platform
   and per format. Plain numbers from the results saved on their own posts, no AI: what each kind of
   post (single image or carousel) earned on each account. Needs at least one post with saved results. */
async function paintWhereWorks(box) {
  if (!box) return;
  box.innerHTML = '<div class="muted small" style="margin-top:12px">Looking at what worked where…</div>';
  try {
    const camps = (S.campaigns || []).slice(0, 12);
    await Promise.all(camps.map((c) => loadResults(c.id, false)));
    const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
    const g = {};
    (S.posts || []).forEach((p) => {
      PLAT_ORDER.forEach((k) => {
        if (!isPostedOn(p, k)) return;
        const r = S.results[p.sku + '|' + k]; if (!r) return;
        const fmt = (p.media_urls || []).length > 1 ? 'Carousel' : 'Single image';
        const id = k + '|' + fmt; const x = g[id] || (g[id] = { k, fmt, n: 0, views: 0, eng: 0 });
        x.n++; x.views += num(r.views); x.eng += num(r.likes) + num(r.comments) + num(r.shares) + num(r.saves);
      });
    });
    const rows = Object.values(g).sort((a, b) => PLAT_ORDER.indexOf(a.k) - PLAT_ORDER.indexOf(b.k) || a.fmt.localeCompare(b.fmt));
    if (!rows.length) {
      box.innerHTML = '<div class="notice" style="margin-top:12px"><b>What worked where.</b> Save the numbers on a few posted posts (open a post, then Results) and this will compare your single images and carousels on each account.</div>';
      return;
    }
    const avg = (t, n) => (n ? fmtN(Math.round(t / n)) : '0');
    let take = '';
    PLAT_ORDER.some((k) => {
      const a = g[k + '|Carousel'], b = g[k + '|Single image'];
      if (!a || !b || a.n < 2 || b.n < 2 || !(b.eng / b.n)) return false;
      const ratio = (a.eng / a.n) / (b.eng / b.n);
      if (ratio >= 1.25) take = `On ${PLAT_NAME[k]}, your carousels average about ${ratio.toFixed(1)}× the engagement of your single images. Worth leaning into.`;
      else if (ratio <= 0.8) take = `On ${PLAT_NAME[k]}, your single images are doing better than your carousels so far.`;
      else return false;
      return true;
    });
    box.innerHTML = `<div class="tr-where" style="margin-top:14px"><div class="label">What worked where</div>
      ${take ? `<p style="margin:4px 0 8px;font-size:14px">${esc(take)}</p>` : ''}
      <div style="overflow-x:auto"><table class="tr-wt" style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="text-align:left;color:var(--muted)"><th style="padding:4px 8px 4px 0">Account</th><th>Format</th><th>Posts</th><th>Avg views</th><th>Avg engagement</th></tr></thead><tbody>
      ${rows.map((x) => `<tr style="border-top:1px solid var(--line)"><td style="padding:6px 8px 6px 0">${esc(PLAT_NAME[x.k])}</td><td>${esc(x.fmt)}</td><td>${x.n}</td><td>${avg(x.views, x.n)}</td><td>${avg(x.eng, x.n)}</td></tr>`).join('')}
      </tbody></table></div>
      <span class="hint">Engagement = likes + comments + shares + saves, from the results you saved. Small samples are a hint, not a verdict.</span></div>`;
  } catch (e) { box.innerHTML = ''; }
}
function trPlatChips() {
  const names = (typeof brandPlatformNames === 'function' && brandPlatformNames()) || defaultPlatforms();
  return names.map((n) => platKey(n)).filter(Boolean).map((k) => `<button type="button" class="chip" data-k="${k}" aria-pressed="true">${esc(PLAT_NAME[k])}</button>`).join('');
}
function linksRead(list) {
  if (!list || !list.length) return '';
  return `<div class="tr-read"><div class="label">Links</div>${list.map((l) => `<div class="tr-link ${l.ok ? 'ok' : 'no'}"><span>${l.ok ? '✓' : '—'}</span><a href="${esc(safeHttpUrl(l.url))}" target="_blank" rel="noopener">${esc(l.title || l.url.replace(/^https?:\/\/(www\.)?/, '').slice(0, 70))}</a><em>${l.ok ? (l.ref ? esc(l.ref) : '') : esc(l.why || 'not readable')}</em></div>`).join('')}</div>`;
}
function renderTopReview(s, r) {
  $('#trForm', s.el).hidden = true;
  const go = $('#trGo', s.el); go.textContent = 'Review again'; go.disabled = false;
  go.onclick = () => { s.close(); openTopReview(); };
  const out = $('#trOut', s.el);
  const app = (r.used && r.used.app) || [];
  out.innerHTML = `<div class="stack">
    <p class="tr-sum"></p>
    ${r.patterns.length ? `<div><div class="label" style="margin-bottom:6px">What worked</div>${r.patterns.map((p, i) => `<label class="tr-pat"><input type="checkbox" data-i="${i}" checked><span><b></b><em></em></span></label>`).join('')}
      <button type="button" class="btn btn-sm btn-ghost" id="trSave" style="margin-top:8px">Teach these to the Alchemist</button></div>` : ''}
    <div><div class="label" style="margin-bottom:6px">Campaigns built on it</div>${r.ideas.map((o, n) => `<div class="tr-idea"><div><b></b><p></p><small></small></div><button type="button" class="btn btn-sm btn-gold" data-n="${n}">${icons.spark} Start</button></div>`).join('')}</div>
    ${app.length ? `<div class="tr-read"><div class="label">Posts from here</div>${app.map((a) => `<div class="tr-link ok"><span>${esc(a.ref)}</span><a href="#" data-sku="${esc(a.sku)}"></a><em>${esc(PLAT_NAME[a.platform] || a.platform)} · ${esc(METRICS.filter(([m]) => typeof a.numbers[m] === 'number').map(([m, l]) => fmtN(a.numbers[m]) + ' ' + l.toLowerCase()).join(', '))}</em></div>`).join('')}</div>` : ''}
    ${linksRead(r.used && r.used.links)}
  </div>`;
  // Model text goes in as text, never as markup.
  $('.tr-sum', out).textContent = r.summary;
  $$('.tr-pat', out).forEach((el, i) => { el.querySelector('b').textContent = r.patterns[i].point; el.querySelector('em').textContent = 'Based on ' + r.patterns[i].based_on; });
  $$('.tr-idea', out).forEach((el, n) => { const o = r.ideas[n]; el.querySelector('b').textContent = o.title; el.querySelector('p').textContent = o.prompt; el.querySelector('small').textContent = `${o.posts} post${o.posts === 1 ? '' : 's'} · ${o.why}`; });
  $$('.tr-read a[data-sku]', out).forEach((a, i) => { a.textContent = app[i].idea || app[i].sku; a.onclick = (e) => { e.preventDefault(); const p = S.posts.find((x) => x.sku === app[i].sku); if (p && p.campaign_id) { s.close(); openCampaign(p.campaign_id); } }; });
  $$('.tr-idea button', out).forEach((b) => b.onclick = () => { const o = r.ideas[+b.dataset.n]; s.close(); openStartIdea(o); });
  const save = $('#trSave', out);
  if (save) save.onclick = async () => {
    const picked = $$('.tr-pat input:checked', out).map((c) => r.patterns[+c.dataset.i]);
    if (!picked.length) { toast('Tick at least one lesson.', 'info'); return; }
    save.disabled = true;
    let n = 0;
    for (const p of picked) {
      try { await api('brand-knowledge', { body: { brand: S.brand, action: 'add', kind: 'insight', title: p.point, body: 'From a review of top posts — based on ' + p.based_on } }); n++; }
      catch (e) { if (e.status === 401) return; }
    }
    save.textContent = n ? `Saved ${n} to the knowledge base ✓` : 'Already saved';
    toast(n ? 'The Alchemist will use these in new posts.' : 'Those were already in the knowledge base.');
  };
}

<script>
'use strict';
/* ── Setup review + the Alchemist's Knowledge Base (2026-10-09) ─────────
   Brad: "when user inputs site url and 'The Alchemist' is collecting
   materials.. after it should show user the findings, and fill out most of
   'brand settings'... User can 'continue or edit' any at that point."
   Three read-only scans run side by side (profile, look, events/news); the
   user checks everything on one sheet, then Continue saves it all. */

const PRESET_LABELS = {
  editorial: 'Editorial almanac', bold: 'Bold blocks', club: 'Night flyer', blueprint: 'Blueprint spec', playful: 'Playful bands',
  terminal: 'Trading terminal', luxe: 'Luxe evening', sport: 'Sport energy', organic: 'Organic market', gradient: 'Glow gradient',
  swiss: 'Swiss grid', pop: 'Pop poster',
};
const FONT_LIST = ['Inter', 'Poppins', 'DM Sans', 'Manrope', 'Outfit', 'Sora', 'Space Grotesk', 'Archivo', 'Archivo Black', 'Syne', 'Unbounded',
  'Fredoka', 'Nunito', 'Rubik', 'Fraunces', 'Playfair Display', 'DM Serif Display', 'Instrument Serif', 'Cormorant Garamond',
  'Bebas Neue', 'Anton', 'Oswald', 'Barlow Condensed', 'IBM Plex Mono', 'Space Mono', 'Caveat', 'Permanent Marker'];
const PAL_ROLES = [['ground', 'Background'], ['paper', 'Surface'], ['ink', 'Text'], ['accent', 'Main colour'], ['second', 'Second colour']];
const WORD_LABELS = { full: 'Mix it up: words, headline only, words in the picture, picture only (recommended)', mix: 'Mostly words, some picture-only cards', minimal: 'Few words', none: 'Pictures only' };
const KB_KIND = {
  event: ['Coming up', 'gold'], roadmap: ['Roadmap', 'blue'], news: ['News', 'green'], fact: ['Fact', ''],
  preference: ['Do', 'green'], avoid: ['Avoid', 'red'], insight: ['Insight', 'blue'],
};
const KB_SOURCE = { site_scan: 'From your site', user: 'You added', learned: 'Learned', review: 'From a review' };

function lookFieldsHtml(p, d) {
  d = d || {};
  const pal = d.palette || {};
  const fonts = d.fonts || {};
  const opt = (list, cur) => list.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`).join('');
  return `<div class="look-grid">
    <div class="field"><label for="${p}Preset">Style</label><select class="input" id="${p}Preset">${opt(Object.entries(PRESET_LABELS), d.preset || 'editorial')}</select></div>
    <div class="field"><label for="${p}Words">Words on cards</label><select class="input" id="${p}Words">${opt(Object.entries(WORD_LABELS), d.words || 'full')}</select></div>
    <div class="field"><label for="${p}FontD">Headline typeface</label><select class="input" id="${p}FontD">${opt(FONT_LIST.map((f) => [f, f]), fonts.display || 'Inter')}</select></div>
    <div class="field"><label for="${p}FontB">Body typeface</label><select class="input" id="${p}FontB">${opt(FONT_LIST.map((f) => [f, f]), fonts.body || 'Inter')}</select></div>
  </div>
  <div class="field"><span class="label">Colours</span><div class="colors">${PAL_ROLES.map(([k, l]) => colorField(`${p}Pal_${k}`, l, pal[k] || '#888888')).join('')}</div></div>`;
}
function readLookFields(el, p) {
  const v = (id) => ($('#' + p + id, el) || {}).value;
  const palette = {};
  PAL_ROLES.forEach(([k]) => { const h = hex6(v('Pal_' + k)); if (h) palette[k] = h; });
  return { preset: v('Preset'), words: v('Words'), fonts: { display: v('FontD'), body: v('FontB') }, palette };
}

// Image picker: the scan's candidates as thumbnails, plus a URL box.
function imgPickHtml(p, label, cur, cands, noneLabel) {
  const list = [];
  (cands || []).forEach((c) => { if (c && c.url && !list.includes(c.url)) list.push(c.url); });
  if (cur && !list.includes(cur)) list.unshift(cur);
  return `<div class="field"><span class="label">${esc(label)}</span>
    <div class="pick" id="${p}Pick">
      <button type="button" class="pick-none${cur ? '' : ' on'}" data-u="">${esc(noneLabel)}</button>
      ${list.slice(0, 8).map((u) => `<button type="button" class="pick-img${u === cur ? ' on' : ''}" data-u="${esc(u)}" title="${esc(u)}"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></button>`).join('')}
    </div>
    <input class="input" id="${p}Url" maxlength="500" value="${esc(cur || '')}" placeholder="https://… (or pick one above)"></div>`;
}
function wireImgPick(el, p, onChange) {
  const pick = $('#' + p + 'Pick', el), inp = $('#' + p + 'Url', el);
  const mark = (u) => pick.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.u === u));
  pick.querySelectorAll('button').forEach((b) => b.onclick = () => { inp.value = b.dataset.u; mark(b.dataset.u); if (onChange) onChange(b.dataset.u); });
  inp.oninput = () => { mark(inp.value.trim()); if (onChange) onChange(inp.value.trim()); };
}

function fmtDay(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
}
function findingRow(it, i, kind, checked) {
  const [lab, tone] = KB_KIND[kind] || ['', ''];
  const title = kind === 'fact' ? it.text : it.title;
  return `<label class="find-row"><input type="checkbox" data-${kind === 'fact' ? 'f' : 'i'}="${i}"${checked ? ' checked' : ''}>
    <span class="find-main"><span class="find-top"><span class="tag ${tone}">${esc(lab)}</span>${it.date ? `<span class="find-date">${esc(fmtDay(it.date))}${it.upcoming ? '' : ' · past'}</span>` : ''}</span>
      <b>${esc(title)}</b>${it.summary ? `<span class="small muted">${esc(it.summary)}</span>` : ''}
      <span class="find-ev">"${esc(it.evidence || '')}"</span></span></label>`;
}

// The three read-only scans, side by side. Each may fail on its own.
async function scanEverything(url, brand) {
  const b = brand ? { brand } : {};
  const [intake, look, disc] = await Promise.allSettled([
    api('brand-intake-from-url', { body: { url, ...b } }),
    api('brand-look', { body: { action: 'scan', url, ...b } }),
    api('brand-discover', { body: { url, ...b } }),
  ]);
  const val = (r) => (r.status === 'fulfilled' ? r.value : null);
  const err = (r) => (r.status === 'rejected' ? r.reason : null);
  for (const r of [intake, look, disc]) { const e = err(r); if (e && e.status === 401) throw e; }
  return { intake: val(intake), look: val(look), disc: val(disc), errors: [intake, look, disc].map(err).filter(Boolean).map((e) => e.message) };
}

/* opts: { mode: 'first'|'add'|'existing', url, found, brand? }  Resolves

function openSetupReview(opts) {
  return new Promise((resolve) => {
    const f = opts.found || {};
    const injected = !!((f.intake && f.intake.safety && f.intake.safety.injection_detected) || (f.look && f.look.safety && f.look.safety.injection_detected) || (f.disc && f.disc.safety && f.disc.safety.injection_detected));
    const d = (!injected && f.intake && f.intake.draft) || {};

    const prof = opts.profile || {};

    const charCands = (L && L.candidates && L.candidates.characters) || [];
    const items = D.items || [], facts = D.facts || [];
    const soon = new Date(Date.now() + 120 * 864e5).toISOString().slice(0, 10);
    const keepItem = (it) => it.kind === 'roadmap' || it.upcoming || (it.date && it.date >= new Date(Date.now() - 90 * 864e5).toISOString().slice(0, 10) && it.date <= soon) || (!it.date && it.kind !== 'news');
    const host = hostOf(opts.url || '');
    const val = (a, b) => (a != null && String(a).trim() ? a : (b || ''));
    let done = false;

    const s = openSheet({
      title: existing ? 'What I found on your site' : 'Here’s what I found',
      body: `<div class="stack review">
        <p class="lede-sm">I read <b>${esc(host)}</b>${(f.disc && f.disc.pages_read && f.disc.pages_read.length > 1) ? ` and ${f.disc.pages_read.length - 1} more page${f.disc.pages_read.length > 2 ? 's' : ''}` : ''}. Check it, change anything that’s off, then continue. Everything stays editable later.</p>
        ${injected ? `<div class="notice bad">That site contained text trying to instruct me, so I didn’t use anything from it. Fill in what you’d like below.</div>` : ''}
        ${!injected && f.disc && f.disc.thin ? `<div class="notice warn">Your site builds its pages with JavaScript, so I could only read a little of it. Fill in what’s missing below — or add news and events later in the Alchemist’s knowledge.</div>` : ''}
        ${f.errors && f.errors.length ? `<div class="notice warn">Part of the scan didn’t finish (${esc(f.errors[0])}). What I did find is below.</div>` : ''}

        <section class="rv-sec"><h3>Your brand</h3>
          ${existing ? '' : `<div class="field"><label for="rvName">Brand name</label><input class="input" id="rvName" maxlength="80" value="${esc(String(opts.name || d.brand_name || nameFromHost(opts.url || '')).slice(0, 80))}"></div>`}
          <div class="field"><label for="rvLink">Where posts link</label><input class="input" id="rvLink" maxlength="500" value="${esc(normalizeUrl(d.destination_url || '') || opts.url || '')}"></div>
          <div class="field"><label for="rvNiches">What you do</label><input class="input" id="rvNiches" maxlength="400" value="${esc(val((d.content_niches || []).join(', '), (prof.content_niches || []).join ? (prof.content_niches || []).join(', ') : ''))}"></div>
          <div class="field"><label for="rvMission">What the brand is here to do</label><textarea class="textarea" id="rvMission" maxlength="1200">${esc(val(d.brand_mission, prof.brand_mission))}</textarea></div>
          <div class="field"><label for="rvAudience">Who it’s for</label><textarea class="textarea" id="rvAudience" maxlength="1200">${esc(val(d.target_audience, prof.target_audience))}</textarea></div>
          <div class="field"><label for="rvTone">How it should sound</label><input class="input" id="rvTone" maxlength="300" value="${esc(val(d.brand_tone, prof.brand_tone))}"></div>
          <div class="field"><label for="rvProof">Facts it may use</label><textarea class="textarea" id="rvProof" maxlength="1500">${esc(val(d.proof_points, prof.proof_points))}</textarea><span class="hint">It never invents facts. It only uses these, your knowledge base and your briefs.</span></div>
          <div class="field"><label for="rvGeo">Where you operate</label><input class="input" id="rvGeo" maxlength="200" value="${esc(val(d.content_geo_scope, prof.content_geo_scope))}"></div>
        </section>

        <section class="rv-sec"><h3>Where you post</h3>
          ${socialsFieldHtml()}
        </section>

        <section class="rv-sec"><h3>Your look</h3>
          ${L && L.look ? `<p class="small muted">"${esc(L.look)}"</p>` : ''}
          ${lookFieldsHtml('rv', design)}
          ${imgPickHtml('rvLogo', 'Logo', logo0, logoCands, 'No logo')}
        </section>

        <section class="rv-sec"><h3>Your character</h3>
          ${imgPickHtml('rvChar', 'Mascot or character', char0, charCands, 'No character')}
          <div class="field" id="rvCharModeF"${char0 ? '' : ' hidden'}><label for="rvCharMode">Show it doing new things</label>
            <select class="input" id="rvCharMode">
              <option value="mix">Yes — new scenes and poses for each post</option>
              <option value="scenes">New scenes only</option>
              <option value="poses">New poses only</option>
              <option value="off">No — use it as it is</option>
            </select><span class="hint">Its face, colours and outfit always stay the same. I’ll write down its fixed traits after you continue.</span></div>
        </section>

        <section class="rv-sec"><h3>For the Alchemist’s knowledge</h3>
          ${items.length || facts.length
            ? `<p class="small muted">Tick what I should remember. Each one was quoted from your site.</p>
               <div class="find-list">${items.map((it, i) => findingRow(it, i, it.kind, keepItem(it))).join('')}${facts.map((x, i) => findingRow(x, i, 'fact', true)).join('')}</div>`
            : `<p class="small muted">I didn’t find dated events, roadmap items or news on your site. You can add them any time in the Alchemist’s knowledge.</p>`}
        </section>
      </div>`,
      foot: `<span class="msg"></span><button type="button" class="btn btn-ghost" data-close>${existing ? 'Cancel' : 'Back'}</button><button type="button" class="btn btn-gold" id="rvGo">${existing ? 'Save' : 'Looks right — continue'}</button>`,
      onClose: () => { if (!done) resolve(false); },
    });
    const el = s.el;
    el.classList.add('wide');
    const charModeF = $('#rvCharModeF', el);
    if (prevLook.character && prevLook.character.variations) $('#rvCharMode', el).value = prevLook.character.variations;
    wireImgPick(el, 'rvLogo');
    wireImgPick(el, 'rvChar', (u) => { charModeF.hidden = !u; });
    // Social accounts: saved ones first (existing brand), then any profile
    // links the scan found on the site, for the user to check.
    const siteSocials = socialsFromUrls((!injected && f.intake && f.intake.detected && f.intake.detected.socials) || []);
    const socReady = existing ? fillSocials(el) : Promise.resolve();
    socReady.then(() => fillSocialInputs(el, siteSocials));
    wireSocialsReader(el, existing ? opts.brand : '');

    $('#rvGo', el).onclick = async () => {
      const go = $('#rvGo', el);
      const name = existing ? opts.brand : $('#rvName', el).value.trim();
      const rawLink = $('#rvLink', el).value.trim(); const link = normalizeUrl(rawLink);
      if (!name) return s.msg('Give your brand a name.', 'err');
      if (rawLink && !link) return s.msg('The link isn’t a valid web address.', 'err');
      const logoUrl = $('#rvLogoUrl', el).value.trim(), charUrl = $('#rvCharUrl', el).value.trim();
      if (logoUrl && !normalizeUrl(logoUrl)) return s.msg('The logo address isn’t a valid web address.', 'err');
      if (charUrl && !normalizeUrl(charUrl)) return s.msg('The character address isn’t a valid web address.', 'err');
      const soc = readSocials(el);
      if (soc.bad) return s.msg(`The ${soc.bad} address doesn’t look right. Paste the full link to the profile.`, 'err');
      const look = readLookFields(el, 'rv');
      const pickedItems = [...el.querySelectorAll('[data-i]:checked')].map((c) => items[Number(c.dataset.i)]).filter(Boolean);
      const pickedFacts = [...el.querySelectorAll('[data-f]:checked')].map((c) => facts[Number(c.dataset.f)]).filter(Boolean);
      go.disabled = true; s.msg(existing ? 'Saving…' : 'Setting up your brand…');
      const problems = [];
      try {
        let brand = opts.brand;
        if (!existing) {
          const clientId = opts.mode === 'add' ? await currentClientId() : undefined;
          const created = await createBrandRecord(name, {
            domain: (f.intake && f.intake.source) || opts.url || '',
            niches: $('#rvNiches', el).value.trim(), geoScope: $('#rvGeo', el).value.trim(),
            primaryColor: look.palette.accent || '#2e9c74', secondaryColor: look.palette.second || '', accentColor: '',
          }, clientId);
          brand = created.brand;
        }
        await api('brand-profile-api', { body: {
          action: 'save', brand,
          niches: $('#rvNiches', el).value.trim(), geoScope: $('#rvGeo', el).value.trim(),
          brandMission: $('#rvMission', el).value.trim(), targetAudience: $('#rvAudience', el).value.trim(),
          brandTone: $('#rvTone', el).value.trim(), proofPoints: $('#rvProof', el).value.trim(),
          logoUrl: logoUrl, brandAssetsUrl: (f.intake && f.intake.source) || opts.url || '',
          ...(existing ? {} : { primaryColor: look.palette.accent || undefined, secondaryColor: look.palette.second || undefined }),
        } }).catch((e) => problems.push(e.message));
        await api('update-brand-settings', { body: { brand, ...(link ? { defaultWheelUrl: link } : {}), defaultPlatforms: normPlatforms(d.default_platforms).length ? normPlatforms(d.default_platforms) : (prof.default_platforms && prof.default_platforms.length ? prof.default_platforms : ['Instagram']) } })
          .catch((e) => problems.push(e.message));
        if (existing ? el.dataset.socLoaded === '1' : Object.keys(soc.out).length) {
          await termsRpc('cc_brand_set_socials', { p_brand: brand, p_socials: soc.out }).catch((e) => problems.push(e.message));
        }
        { const xs = $('[data-xplan]', el); if (xs && (xs.value === 'premium' || el.dataset.planLoaded === '1')) S.socialPlans[brand] = await rpc('cc_brand_set_social_plans', { p_brand: brand, p_plans: { X: xs.value } }).catch(() => S.socialPlans[brand]); }
        const charMode = charUrl ? $('#rvCharMode', el).value : 'off';
        const lookBody = {
          action: 'save', brand,
          design: { ...look, logo: { onDark: !!(design.logo && design.logo.onDark) }, look: (L && L.look) || prevLook.look || undefined, source: (L && L.source) || opts.url || undefined,
            character: { variations: charMode, traits: (prevLook.character && prevLook.character.traits) || '' } },
        };
        if (logoUrl !== (prevLook.logo_url || '')) lookBody.logo_url = logoUrl;
        if (charUrl !== (prevLook.mascot_url || '')) lookBody.mascot_url = charUrl;
        const ls = await api('brand-look', { body: lookBody }).catch((e) => { problems.push(e.message); return null; });
        if (ls && ls.problems && ls.problems.length) problems.push(...ls.problems);
        if (lookBody.logo_url !== undefined) await api('update-brand-settings', { body: { brand, logoUrl: lookBody.logo_url } }).catch(() => null);
        if (pickedItems.length || pickedFacts.length) {
          await api('brand-knowledge', { body: { action: 'seed', brand, items: pickedItems, facts: pickedFacts } }).catch((e) => problems.push(e.message));
        }
        // The character's fixed traits are drafted from its saved image, in
        // the background, so variations keep exactly those.
        if (ls && ls.design_system && ls.design_system.mascot_url && charUrl && !(prevLook.character && prevLook.character.traits)) {
          api('brand-look', { body: { action: 'describe_character', brand } })
            .then((r) => r.traits ? api('brand-look', { body: { action: 'save', brand, design: { character: { variations: charMode, traits: r.traits } } } }) : null)
            .catch(() => {});
        }
        done = true; s.close();
        S.learned = { brand, injected, scanProblem: '', draft: d, source: (f.intake && f.intake.source) || opts.url, problems, reviewed: true, kept: pickedItems.length + pickedFacts.length };
        resolve({ brand, problems });
      } catch (e) {
        go.disabled = false;
        if (e.cancelled || e.status === 401) { s.msg(''); return; }
        s.msg(e.message, 'err');
      }
    };

    if (opts.auto && !existing) {
      // 2026-10-29: new brands skip the review. The very same save runs, with the sheet hidden. If anything goes
      // wrong the sheet is shown so it can be fixed by hand.
      const bd = s.el.previousElementSibling;
      const hide = (on) => { s.el.style.visibility = on ? 'hidden' : ''; if (bd) bd.style.visibility = on ? 'hidden' : ''; };
      hide(true);
      setTimeout(() => {
        $('#rvGo', el).click();
        const t0 = Date.now();
        const watch = setInterval(() => {
          if (done || !document.body.contains(el)) { clearInterval(watch); return; }
          const m = el.querySelector('.msg'), go = $('#rvGo', el);
          if ((m && m.classList.contains('err')) || (go && !go.disabled && Date.now() - t0 > 600) || Date.now() - t0 > 90000) {
            clearInterval(watch); hide(false); if (opts.onReveal) opts.onReveal();
          }
        }, 250);
      }, 150);
    }
  });
}

/* ── The Alchemist's knowledge ────────────────────────────────────────── */
let kbNudgeTimer = null;
// Called after approvals, redos and deletes. The server only re-learns when
// there's enough new to learn from, so this is cheap to call.
function kbNudge() {
  if (!S.brand) return;
  clearTimeout(kbNudgeTimer);
  const brand = S.brand;
  kbNudgeTimer = setTimeout(() => api('brand-knowledge', { body: { action: 'learn', brand, auto: true } }).catch(() => {}), 4000);
}

async function openKnowledge() {
  closeMenus();
  const s = openSheet({
    title: 'The Alchemist’s knowledge',
    body: `<div class="stack" id="kbBody"><div class="skel" style="height:60px"></div><div class="skel" style="height:120px"></div></div>`,
    foot: `<span class="msg"></span><button type="button" class="btn btn-ghost" id="kbRescan">Check my site again</button><button type="button" class="btn btn-gold" data-close>Done</button>`,
  });
  const el = s.el; el.classList.add('wide');
  const brand = S.brand;
  let data;
  const load = async () => {
    try { data = await api('brand-knowledge', { body: { action: 'list', brand } }); }
    catch (e) { if (e.status !== 401) s.msg(e.message, 'err'); return; }
    render();
  };
  const entryHtml = (e) => {
    const [lab, tone] = KB_KIND[e.kind] || ['', ''];
    const meta = [KB_SOURCE[e.source] || '', e.stats && e.stats.based_on ? e.stats.based_on : '', e.stats && e.stats.confidence && e.source === 'learned' ? `${e.stats.confidence} confidence` : ''].filter(Boolean).join(' · ');
    return `<div class="kb-row${e.pinned ? ' pinned' : ''}" data-id="${esc(e.id)}">
      <div class="kb-main"><div class="find-top"><span class="tag ${tone}">${esc(lab)}</span>${e.event_date ? `<span class="find-date">${esc(fmtDay(e.event_date))}</span>` : ''}</div>
        <b>${esc(e.title)}</b>${e.body ? `<span class="small muted">${esc(e.body)}</span>` : ''}
        ${e.evidence ? `<span class="find-ev">"${esc(e.evidence)}"</span>` : ''}
        <span class="kb-meta">${esc(meta)}</span></div>
      <div class="kb-acts">
        <button type="button" class="icon-btn" data-pin title="${e.pinned ? 'Unpin' : 'Pin: always keep this'}" aria-label="${e.pinned ? 'Unpin' : 'Pin'}">${e.pinned ? '★' : '☆'}</button>
        <button type="button" class="icon-btn" data-edit title="Edit" aria-label="Edit">✎</button>
        <button type="button" class="icon-btn" data-del title="Remove" aria-label="Remove">${icons.close}</button></div></div>`;
  };
  const render = () => {
    const E = data.entries || [];
    const today = new Date().toISOString().slice(0, 10);
    const groups = [
      ['What works', E.filter((e) => e.kind === 'preference')],
      ['What to avoid', E.filter((e) => e.kind === 'avoid')],
      ['Insights', E.filter((e) => e.kind === 'insight')],
      ['Coming up', E.filter((e) => e.kind === 'event' && (!e.event_date || e.event_date >= today)).sort((a, b) => String(a.event_date).localeCompare(String(b.event_date)))],
      ['Roadmap', E.filter((e) => e.kind === 'roadmap')],
      ['News', E.filter((e) => e.kind === 'news')],
      ['Facts', E.filter((e) => e.kind === 'fact')],
      ['Past events', E.filter((e) => e.kind === 'event' && e.event_date && e.event_date < today)],
    ].filter(([, l]) => l.length);
    const st = data.stats || {}; const c = st.counts || {};
    const decided = (c.approved || 0) + (c.declined || 0) + (c.redo || 0) + (c.rating_up || 0) + (c.rating_down || 0) + (c.deleted || 0);
    const lay = Object.entries(st.layouts || {}).filter(([, v]) => v.up + v.down >= 2).sort((a, b) => (b[1].up - b[1].down) - (a[1].up - a[1].down));
    $('#kbBody', el).innerHTML = `
      <p class="lede-sm">Everything here shapes every post I write for <b>${esc(brand)}</b>. I learn from what you approve, send back or delete, from posts that go live and from your reviews.</p>
      <div class="kb-stats"><span><b>${decided}</b> decisions learned from</span><span><b>${c.posted || 0}</b> posts live</span><span>${data.learned_at ? `Last learned ${esc(new Date(data.learned_at).toLocaleDateString())}` : 'Nothing learned yet'}</span>
        <button type="button" class="btn btn-sm btn-ghost" id="kbLearn"${decided ? '' : ' disabled'}>Learn now</button></div>
      ${lay.length ? `<div class="field"><span class="label">Layouts you keep vs. send back</span><div class="chips">${lay.map(([k, v]) => `<span class="chip static">${esc(k)} <b class="up">${v.up}↑</b> <b class="down">${v.down}↓</b></span>`).join('')}</div></div>` : ''}
      <form class="kb-add" id="kbAdd">
        <select class="input" id="kbKind" aria-label="Type">
          <option value="fact">Fact</option><option value="event">Coming up</option><option value="roadmap">Roadmap</option><option value="news">News</option>
          <option value="preference">Do this</option><option value="avoid">Avoid this</option></select>
        <input class="input" id="kbText" maxlength="280" placeholder="Tell the Alchemist something…" aria-label="What to remember">
        <input class="input" id="kbDate" type="date" aria-label="Date" hidden>
        <button type="submit" class="btn btn-gold">Add</button></form>
      ${groups.length ? groups.map(([t, l]) => `<section class="kb-group"><h3>${esc(t)} <span class="muted small">${l.length}</span></h3>${l.map(entryHtml).join('')}</section>`).join('')
        : `<div class="notice warn">Nothing here yet. Check your site again, add a few things yourself, or just start posting — I’ll learn from what you approve and send back.</div>`}`;
    const kind = $('#kbKind', el), date = $('#kbDate', el);
    kind.onchange = () => { date.hidden = !['event', 'roadmap', 'news'].includes(kind.value); };
    $('#kbAdd', el).onsubmit = async (ev) => {
      ev.preventDefault();
      const t = $('#kbText', el).value.trim(); if (t.length < 3) return s.msg('Write what I should know.', 'err');
      if (kind.value === 'event' && !date.value) return s.msg('Add the date for something coming up.', 'err');
      try { await api('brand-knowledge', { body: { action: 'add', brand, kind: kind.value, title: t, event_date: date.hidden ? null : date.value || null } }); s.msg('Added.', 'ok'); await load(); }
      catch (e) { if (e.status !== 401) s.msg(e.message, 'err'); }
    };
    const lb = $('#kbLearn', el);
    if (lb) lb.onclick = async () => {
      lb.disabled = true; lb.textContent = 'Learning…';
      try { const r = await api('brand-knowledge', { body: { action: 'learn', brand, force: true } }); s.msg(r.learned ? `Learned ${r.learned} lesson${r.learned === 1 ? '' : 's'}.` : (r.skipped === 'not enough yet' ? 'Not enough decisions yet — approve or send back a few more posts.' : 'Nothing new to learn.'), r.learned ? 'ok' : ''); await load(); }
      catch (e) { if (e.status !== 401) s.msg(e.message, 'err'); lb.disabled = false; lb.textContent = 'Learn now'; }
    };
    el.querySelectorAll('.kb-row').forEach((row) => {
      const id = row.dataset.id; const e = E.find((x) => x.id === id);
      row.querySelector('[data-pin]').onclick = async () => { try { await api('brand-knowledge', { body: { action: 'update', brand, id, pinned: !e.pinned } }); await load(); } catch (er) { if (er.status !== 401) s.msg(er.message, 'err'); } };
      row.querySelector('[data-del]').onclick = async () => { try { await api('brand-knowledge', { body: { action: 'archive', brand, id } }); row.remove(); s.msg('Removed.', 'ok'); } catch (er) { if (er.status !== 401) s.msg(er.message, 'err'); } };
      row.querySelector('[data-edit]').onclick = async () => {
        const v = await askName(e.title, 'Change what the Alchemist remembers.');
        if (!v || v === e.title) return;
        try { await api('brand-knowledge', { body: { action: 'update', brand, id, title: v } }); await load(); } catch (er) { if (er.status !== 401) s.msg(er.message, 'err'); }
      };
    });
  };
  $('#kbRescan', el).onclick = async () => {
    const b = $('#kbRescan', el); b.disabled = true; b.textContent = 'Reading your site…'; s.msg('');
    try {
      const r = await api('brand-discover', { body: { brand } });
      const items = r.items || [], facts = r.facts || [];
      if (!items.length && !facts.length) { s.msg(r.thin ? 'Your site builds its pages with JavaScript, so I can’t read its news yet. Add things here yourself.' : 'I didn’t find anything new on your site.', ''); return; }
      const have = new Set((data.entries || []).map((x) => (x.kind + '|' + x.title).toLowerCase()));
      const fresh = items.filter((x) => !have.has((x.kind + '|' + x.title).toLowerCase()));
      const freshF = facts.filter((x) => !have.has(('fact|' + x.text).toLowerCase()));
      if (!fresh.length && !freshF.length) { s.msg('Everything I found is already here.', 'ok'); return; }
      const p = openSheet({
        title: 'New from your site', dialog: true,
        body: `<div class="stack"><p class="small muted">Tick what I should remember.</p><div class="find-list">${fresh.map((it, i) => findingRow(it, i, it.kind, true)).join('')}${freshF.map((x, i) => findingRow(x, i, 'fact', true)).join('')}</div></div>`,
        foot: `<span class="msg"></span><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="button" class="btn btn-gold" id="kbKeep">Remember these</button>`,
      });
      $('#kbKeep', p.el).onclick = async () => {
        const its = [...p.el.querySelectorAll('[data-i]:checked')].map((c) => fresh[Number(c.dataset.i)]);
        const fs = [...p.el.querySelectorAll('[data-f]:checked')].map((c) => freshF[Number(c.dataset.f)]);
        try { const sv = await api('brand-knowledge', { body: { action: 'seed', brand, items: its, facts: fs } }); p.close(); s.msg(`Remembered ${sv.added}.`, 'ok'); await load(); }
        catch (e) { if (e.status !== 401) p.msg(e.message, 'err'); }
      };
    } catch (e) { if (e.status !== 401) s.msg(e.message, 'err'); }
    finally { b.disabled = false; b.textContent = 'Check my site again'; }
  };
  await load();
}
</script>

/* ── The Alchemist (always on hand) ─────────────────────────────────── */

/* ── Homepage A/B: count a new account once, for the design it came from ── */
// The homepage sets fma_ab (a|b) and fma_sid cookies. A sign-up is counted
// when an account created in the last hour first opens the app in that
// browser. Runs once per browser; never blocks the app.
// Funnel steps the data can't show by itself: first app open, first reveal. Once per browser per step.
function funnelMark(step) {
  try {
    const k = 'fa-fn-' + step; if (localStorage.getItem(k)) return;
    fetch(SUPABASE_URL + '/rest/v1/rpc/cc_funnel_mark', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()), body: JSON.stringify({ p_step: step }) })
      .then((r) => { if (r.ok) { try { localStorage.setItem(k, '1'); } catch (_e) {} } }).catch(() => {});
  } catch (_e) { /* best effort */ }
}
// Site visit counter: tells the admin page a visit ended in a sign-up. Needs the id the public pages left in this tab; once per browser.
// Everyone who opens the Alchemist app is marked as an Alchemist account (user_metadata.signup_app), so the admin stats
// can tell them apart from SpinQuest app users, who share the same sign-in system. Once per browser; never blocks the app.
async function tagAlchemistUser() {
  try {
    if (!session || localStorage.getItem('fma-tagged')) return;
    const u = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: authHeaders() }).then((r) => (r.ok ? r.json() : null));
    if (!u) return;
    if (!(u.user_metadata && u.user_metadata.signup_app)) {
      const r = await fetch(SUPABASE_URL + '/auth/v1/user', { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()), body: JSON.stringify({ data: { signup_app: 'alchemist' } }) });
      if (!r.ok) return;
    }
    localStorage.setItem('fma-tagged', '1');
  } catch (_e) { /* best effort */ }
}
async function siteSignupCheck() {
  try {
    if (localStorage.getItem('fma-site-signup') || localStorage.getItem('fma-no-track') === '1' || navigator.doNotTrack === '1' || !session) return;
    const u = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: authHeaders() }).then((r) => (r.ok ? r.json() : null));
    // the magic link opens in a new tab, so the visit id also travels inside the sign-in request (user_metadata.fma_sid)
    const sid = sessionStorage.getItem('fma-sid') || (u && u.user_metadata && u.user_metadata.fma_sid) || '';
    if (!u || !sid || !u.created_at || Date.now() - Date.parse(u.created_at) > 86400000) return;
    localStorage.setItem('fma-site-signup', '1');
    await fetch(SUPABASE_URL + '/rest/v1/rpc/site_track', {
      method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_sid: sid, p_event: 'signup', p_path: '/dashboard/', p_extra: { uid: u.id, tz: (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (_e) { return ''; } })() } }),
    });
  } catch (_e) { /* best effort */ }
}
async function abSignupCheck() {
  try {
    if (localStorage.getItem('fma_ab_checked')) return;
    const v = (document.cookie.match(/(?:^|; )fma_ab=([ab])/) || [])[1];
    const sid = (document.cookie.match(/(?:^|; )fma_sid=([a-z0-9]{10,40})/) || [])[1];
    if (!v || !sid || !session) return;
    localStorage.setItem('fma_ab_checked', '1');
    const u = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: authHeaders() }).then((r) => (r.ok ? r.json() : null));
    if (!u || !u.created_at || Date.now() - Date.parse(u.created_at) > 3600000) return;
    await fetch(SUPABASE_URL + '/rest/v1/rpc/ccb_ab_track', {
      method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ p_variant: v, p_event: 'signup', p_sid: sid }),
    });
  } catch (_e) { /* best effort */ }
}

/* ── Boot ───────────────────────────────────────────────────────────── */
async function boot() {
  const linkError = consumeAuthError();
  session = consumeAuthRedirect() || loadSession();
  if (session && tokenExpiringSoon() && session.refresh_token) {
    const r = await refreshSessionOnce();
    if (!r.ok && r.rejected) session = null;
  }
  if (!session) { renderLogin(linkError || '', linkError ? 'err' : ''); return; }
  saveSession(session); scheduleRefresh();
  abSignupCheck();
  siteSignupCheck();
  tagAlchemistUser();
  funnelMark('app_open');
  renderShell();
  $('#main').innerHTML = homeSkeleton();
  let access;
  try { access = await api('get-brand-content', { method: 'GET' }); }
  catch (e) { if (e.status !== 401) { clearSession(); renderLogin('Could not confirm your sign-in — please sign in again.', 'err'); } return; }
  saveSession(Object.assign({}, session, { email: access.email }));
  S.email = access.email; S.isAdmin = !!access.is_admin; S.brands = access.assigned_brands || [];
  if (!(await termsGate())) return;
  await loadOverview(); applyArchived(); pushOnboard();
  try { if ('Notification' in window && Notification.permission === 'granted' && pushPref() === 'on') subscribePush(); } catch (_e) {}
  // The admin panel has its own (shorter) admin list server-side; ask it.
  // A non-admin gets a harmless 403.
  S.canAdmin = S.isAdmin;
  if (!S.isAdmin) api('admin-list-accounts', { method: 'GET' }).then(() => { S.canAdmin = true; }, () => {});
  if (!S.brands.length) { renderOnboarding('first'); return; }
  const last = lastBrand();
  enterBrand(S.brands.includes(last) ? last : S.brands[0], true);
  setTimeout(() => { try { resumeGenJob(); } catch (e) {} }, 1500);
}
boot();

<script>
'use strict';
/* ── Together (2026-10-10) ────────────────────────────────────────────────
   Brad: "the user needs to also help with the 'transmutations' as its them
   that is climbing in XP points ... maybe to reveal new posts.. or to submit
   'material and exchange of equivalence'."
   - The composer lists the materials the user is bringing (brief, link,
     brand look, character) next to the credits they trade.
   - New posts arrive sealed; the user breaks each seal to reveal it.
     (Only posts made in this browser are sealed; if storage is off the
     seals live for this visit only.)
   - Any XP the user earns floats up from the rank chip. */
const SEAL_DAYS = 14;
function sealKey() { return 'fa-sealed-' + (S.email || 'me'); }
function loadSeals() {
  if (S.seals) return S.seals;
  let v = {};
  try { v = JSON.parse(localStorage.getItem(sealKey()) || '{}') || {}; } catch (e) { v = {}; }
  const cut = Date.now() - SEAL_DAYS * 864e5;
  Object.keys(v).forEach((k) => { if (!(v[k] > cut)) delete v[k]; });
  S.seals = v; return v;
}
function saveSeals() { try { localStorage.setItem(sealKey(), JSON.stringify(S.seals || {})); } catch (e) {} }
function sealPosts(skus) { const v = loadSeals(); (skus || []).forEach((k) => { if (k) v[k] = Date.now(); }); saveSeals(); }
function isSealed(p) { return !!(p && loadSeals()[p.sku]); }
function sealVeilHtml(p, i) {
  return `<div class="seal-veil"><div class="seal-sig" aria-hidden="true">${circleSvg('seal-' + p.sku, { uid: 'sl' + i })}</div><b>${esc(pickWord(DONE_WORDS, p.sku))}</b><small>Your materials became this post. Break the seal to see it.</small><button type="button" class="btn btn-gold btn-sm" data-reveal>Reveal</button></div>`;
}
function revealCard(card, quiet) {
  const sku = card.dataset.sku;
  const v = loadSeals(); delete v[sku]; saveSeals();
  funnelMark('reveal');
  const finish = () => {
    const p = S.posts.find((x) => x.sku === sku);
    const root = card.closest('.view') || document;
    // A sealed card is drawn without its menu and checklist, so redraw this one card as a normal (revealed) card
    // and wire it up again. Without this the "..." menu only appears after a page reload.
    let redrawn = false;
    if (p && card.isConnected && card.parentElement) {
      try {
        const idx = Array.prototype.indexOf.call(card.parentElement.children, card);
        const tmp = document.createElement('div'); tmp.innerHTML = postCardHtml(p, idx < 0 ? 0 : idx);
        const nc = tmp.firstElementChild;
        if (nc) { nc.style.animation = 'none'; nc.style.opacity = '1'; wirePostCards(tmp); card.replaceWith(nc); redrawn = true; }
      } catch (e) { redrawn = false; }
    }
    if (!redrawn) {
      card.classList.remove('sealed', 'revealing');
      const veil = $('.seal-veil', card); if (veil) veil.remove();
      $$('[data-seal-lock="1"]', card).forEach((x) => { x.disabled = false; delete x.dataset.sealLock; });
      const pill = $('.card-badge.pill', card) || $('.post-top .pill', card);
      if (p && pill) { const [st, cls] = stageOf(p); pill.className = 'card-badge pill ' + cls; pill.textContent = stageLabel(p, st); }
    }
    paintSealBar(root);
    // Refresh the campaign header ("Approve all" counts only revealed posts).
    clearTimeout(S.sealRefresh);
    if (S.view === 'campaign' && !document.querySelector('.post.sealed, .post.revealing')) S.sealRefresh = setTimeout(() => { const y = window.scrollY; renderCampaign(); window.scrollTo(0, y); }, 300);
  };
  if (quiet || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return finish();
  card.classList.add('revealing');
  setTimeout(finish, 700);
}
function paintSealBar(root) {
  const posts = $('.posts', root); if (!posts) return;
  let bar = $('.seal-bar', root);
  const sealed = $$('.post.sealed', posts);
  if (sealed.length < 2) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement('div'); bar.className = 'seal-bar'; posts.parentNode.insertBefore(bar, posts); }
  bar.innerHTML = `<span>${icons.spark}</span><span><b>${sealed.length} posts are sealed.</b> Your transmutation is done — break the seals to see what you made.</span><button type="button" class="btn btn-gold btn-sm">Reveal all</button>`;
  $('button', bar).onclick = () => { $$('.post.sealed', posts).forEach((c, n) => setTimeout(() => revealCard(c), n * 140)); };
}
function wireSeals(root) {
  $$('.post.sealed [data-reveal]', root).forEach((b) => b.onclick = (e) => { e.stopPropagation(); revealCard(b.closest('.post')); });
  setTimeout(() => paintSealBar(root.closest ? (root.closest('.view') || root) : document), 0);
}

/* Materials the user brings to the composer. */
function composerMaterials() {
  const prompt = (($('#compPrompt') || {}).value || '').trim();
  const items = (typeof comp !== 'undefined' && comp.listOn) ? (comp.items || []).filter((x) => x.brief && x.brief.trim()) : null;
  const link = (($('#compLink') || {}).value || '').trim() || (S.brandData && S.brandData.default_wheel_url) || '';
  return [
    items ? { on: items.length > 0, t: items.length ? `${items.length} brief${items.length === 1 ? '' : 's'}` : 'Your briefs' } : { on: prompt.length > 3, t: 'Your brief' },
    { on: !!link, t: 'Your link' },
    { on: !!S.brandData, t: 'Your brand look' },
    ...(S.brandData && S.brandData.scenes_on ? [{ on: true, t: 'Your character' }] : []),
  ];
}
function paintMaterials() {
  const el = $('#matLine'); if (!el) return;
  el.innerHTML = '<span class="lbl">Your materials</span>' + composerMaterials().map((m) => `<span class="mat${m.on ? ' on' : ''}"></span>`).join('');
  $$('.mat', el).forEach((x, n) => { x.textContent = composerMaterials()[n].t; });
}
function materialsShort() { const m = composerMaterials().filter((x) => x.on); return m.length ? m[0].t + (m.length > 1 ? ` +${m.length - 1}` : '') : 'Your brief'; }
document.addEventListener('input', (e) => { if (e.target && (e.target.id === 'compPrompt' || e.target.id === 'compLink' || (e.target.closest && e.target.closest('#compList')))) paintMaterials(); });

/* XP the user earns floats up from the rank chip. */
function xpGain(n) {
  const c = $('#rankChip'); if (!c || c.hidden) return;
  const r = c.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  /* the chip can be hidden or tucked away on a phone (its box then reads 0,0 — which put the points in the top-left corner) */
  const vis = r.width > 4 && r.height > 4 && r.bottom > 0 && r.top < vh && r.right > 0 && r.left < vw;
  const el = document.createElement('div');
  el.className = 'xp-gain'; el.setAttribute('role', 'status');
  el.textContent = `+${n} XP`;
  let x = vw / 2, y = null;
  if (vis && vw > 720) { x = r.left + r.width / 2; y = r.bottom + 6; }
  else if (vis) { y = r.bottom + 6; }
  x = Math.max(56, Math.min(vw - 56, x));
  el.style.left = x + 'px';
  el.style.top = y != null ? Math.max(8, y) + 'px' : 'calc(env(safe-area-inset-top, 0px) + 64px)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1900);
}

<script>
'use strict';
/* ── First steps: a guided first transmutation (2026-10-10) ──────────────
   Brad approved: "Guided first transmutation" — after setup the brief is
   pre-filled from the brand's own site and a short path leads to the first
   win: set up → transmute → reveal → approve → post. Every tick is read from
   real data (posts, approvals, posted links), never from clicks alone. The
   badges and XP named here are the real ones alchemist-progress awards. */
function firstRunSteps() {
  const posts = (S.posts || []).filter((p) => !p.brand || p.brand === S.brand);
  const has = posts.length > 0;
  const sealed = posts.some((p) => isSealed(p) || isFinishing(p));
  const approved = posts.some((p) => ['Ready to post', 'Posted'].includes(stageOf(p)[0]));
  const posted = posts.some((p) => stageOf(p)[0] === 'Posted');
  return [
    { k: 'setup', t: 'Set up your brand', d: 'Your colours, voice and facts are in.', done: true },
    { k: 'make', t: 'Transmute your first posts', d: 'Pick an idea below or write one sentence. Earns the First Transmutation badge.', done: has },
    { k: 'reveal', t: 'Break the seals', d: 'See what you made.', done: has && !sealed },
    { k: 'approve', t: 'Approve one', d: 'Or send it back with a reason and it redrafts. Earns Seal of Approval.', done: approved },
    { k: 'post', t: 'Post it and tick where it went', d: 'Copy the caption, download the image, post it, then tick the platform. +3 XP and Released into the World.', done: posted },
  ];

<script>

/* ── Add to calendar (2026-10-10) ────────────────────────────────────────

   Google and Outlook calendars. Nothing leaves the browser. */
function icsEsc(t) { return String(t || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) { const out = []; let l = line; while (l.length > 74) { out.push(l.slice(0, 74)); l = ' ' + l.slice(74); } out.push(l); return out.join('\r\n'); }
function downloadIcs(posts, filename) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const app = location.origin + '/dashboard/';
  const ev = posts.filter((p) => p && /^\d{4}-\d{2}-\d{2}/.test(String(p.scheduled_date || ''))).map((p) => {
    const d = String(p.scheduled_date).slice(0, 10).replace(/-/g, '');
    const nd = new Date(String(p.scheduled_date).slice(0, 10) + 'T00:00:00Z'); nd.setUTCDate(nd.getUTCDate() + 1);
    const end = nd.toISOString().slice(0, 10).replace(/-/g, '');

    return ['BEGIN:VEVENT', `UID:${p.sku}@fullmediaalchemist.com`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${end}`,

  });
  if (!ev.length) { toast('That post has no date yet. Set one in Edit first.', 'info'); return; }
  const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Fullmedia Alchemist//Posts//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', ...ev, 'END:VCALENDAR'].join('\r\n') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar;charset=utf-8' }));
  a.download = String(filename || 'posts.ics').replace(/[^\w .-]+/g, '').slice(0, 60) || 'posts.ics';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
