<script>
'use strict';
/* ── Pre-approve checks (2026-10-10) ─────────────────────────────────────
   Catch problems before a post goes public. Only hard limits the platforms
   enforce are flagged as problems (checked 2026-10-10):
     X (free accounts) 280 characters, a link counts as 23;
     Instagram 2,200 characters and at most 5 hashtags (Dec 2025 change);
     LinkedIn 3,000 characters.
   The post's link is opened server-side (link-check) to make sure it works. */
const PLAT_RULES = {
  X: { max: 280, link: 23, name: 'X' }, Twitter: { max: 280, link: 23, name: 'X' },
  Instagram: { max: 2200, tags: 5, name: 'Instagram' }, LinkedIn: { max: 3000, name: 'LinkedIn' },
};
S.linkStatus = S.linkStatus || {};
function postPlatforms(p) {
  const c = (S.campaigns || []).find((x) => x.id === p.campaign_id);
  const list = requiredPlatforms(p) || ((c && c.target_platforms && c.target_platforms.length) ? c.target_platforms : String(p.active_platforms || '').split(/\s*,\s*/));
  return list.filter(Boolean);
}
function postChecks(p) {
  const out = [];
  const cap = String(p.post_copy || '').trim();
  const tags = String(p.general_hashtags || '').split(/\s+/).filter((t) => t.startsWith('#'));
  const link = p.content_link || '';
  if (!cap) out.push({ level: 'bad', text: 'No caption' });
  if (!(p.media_urls || []).filter(Boolean).length) out.push({ level: 'bad', text: 'No image yet' });
  const seen = new Set();
  postPlatforms(p).forEach((pl) => {
    const r = PLAT_RULES[pl]; if (!r || seen.has(r.name)) return; seen.add(r.name);
    const len = r.link ? cap.length + (tags.length ? 1 + tags.join(' ').length : 0) + (link ? 1 + r.link : 0) : cap.length + (tags.length ? 2 + tags.join(' ').length : 0);

    if (len > r.max) out.push({ level: 'warn', text: `Too long for ${r.name} (${len}/${r.max}) — trim it there` });
    if (r.tags && tags.length > r.tags) out.push({ level: 'bad', text: `${r.name} allows ${r.tags} hashtags (has ${tags.length})` });
  });
  const ls = link ? S.linkStatus[link] : null;

}

  const ok = String(p.scheduled_date).slice(0, 10) >= limY;

// "1 of your approved posts hasn't been posted to X and LinkedIn yet."

}
function campColor(id) { let h = 0; for (const ch of String(id || '')) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 55% 52%)`; }
// 2026-10-11: Brad: "calendar mode on mobile is only working if phone is
// landscape. give user toggle to do list or calendar view ... it doesn't even
// say what day is today, or show today if no event on it, and the nav does not
// work with list view." Month and List, remembered per browser. On a phone the
// month is a compact grid with coloured dots; tapping a day lists its posts
// underneath. The list shows the chosen month's days with posts, and always
// today. The brand chips stay on top.
function calMode() { try { return localStorage.getItem('fa-cal-mode') === 'list' ? 'list' : 'month'; } catch (_e) { return 'month'; } }
function setCalMode(m) { try { localStorage.setItem('fa-cal-mode', m); } catch (_e) {} }
function openCalendar(ym, focus) {
  closeMenus();
  if (!S.brand) return;
  S.view = 'calendar'; saveNav();
  const now = new Date();
  const [y, m] = (ym || S.calYm || ymOf(now)).split('-').map(Number);
  S.calYm = `${y}-${String(m).padStart(2, '0')}`;
  const mode = calMode();
  const first = new Date(y, m - 1, 1);
  const lead = (first.getDay() + 6) % 7;                    // Monday first
  const start = new Date(y, m - 1, 1 - lead);
  const days = Array.from({ length: 42 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
  const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const camps = Object.fromEntries((S.campaigns || []).map((c) => [c.id, c]));
  const byDay = {};
  (S.posts || []).forEach((p) => { if (!p.scheduled_date) return; const k = String(p.scheduled_date).slice(0, 10); (byDay[k] = byDay[k] || []).push(p); });
  const undated = (S.posts || []).filter((p) => !p.scheduled_date).length;
  const unfinished = (S.posts || []).filter(needsFinishing);
  const missingAll = [...new Set(unfinished.flatMap(missingAccounts))];
  const today = todayYmd();
  const monthKey = S.calYm;
  const inMonth = (k) => k.slice(0, 7) === monthKey;
  if (!S.calSel || !inMonth(S.calSel)) S.calSel = inMonth(today) ? today : (Object.keys(byDay).filter(inMonth).sort()[0] || monthKey + '-01');

    const c = camps[p.campaign_id]; const [st, cls] = stageOf(p);

      <span class="cal-idea">${esc(p.post_idea || p.sku)}</span>
      <span class="pill ${cls}">${esc(stageLabel(p, st))}</span></button>`;
  };
  const dayTitle = (k) => { const d = new Date(k + 'T12:00:00'); const t = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }); return k === today ? `Today · ${t}` : t; };
  const dayBlock = (k) => { const list = byDay[k] || [];
    return `<div class="cal-lday${k === today ? ' today' : ''}" data-day="${k}"><div class="cal-lh">${esc(dayTitle(k))}</div>${list.length ? list.map(item).join('') : '<p class="small muted cal-none">Nothing scheduled.</p>'}</div>`; };
  const title = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const monthName = first.toLocaleDateString(undefined, { month: 'long' });
  const prev = ymOf(new Date(y, m - 2, 1)), next = ymOf(new Date(y, m, 1));
  let body;
  if (mode === 'list') {
    const keys = Object.keys(byDay).filter(inMonth);
    if (inMonth(today) && !keys.includes(today)) keys.push(today);
    keys.sort();
    body = `<div class="cal-list">${keys.length ? keys.map(dayBlock).join('') : `<div class="card empty-state"><p>Nothing scheduled in ${esc(monthName)} yet. A blank page waiting for gold.</p></div>`}</div>`;
  } else {
    body = `<div class="cal-dow">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => `<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${days.map((d) => { const k = ymd(d); const list = (byDay[k] || []); const out = !inMonth(k);
      const dots = list.slice(0, 4).map((p) => `<i class="cal-dot ${stageOf(p)[1]}"></i>`).join('') + (list.length > 4 ? `<b class="cal-more">+${list.length - 4}</b>` : '');
      return `<div class="cal-day${out ? ' out' : ''}${k === today ? ' today' : ''}${k === S.calSel ? ' sel' : ''}${list.length ? '' : ' empty'}" data-day="${k}"${out ? '' : ` role="button" tabindex="0" aria-label="${esc(dayTitle(k))}, ${list.length} post${list.length === 1 ? '' : 's'}"`}><div class="cal-n">${d.getDate()}</div><div class="cal-dots">${dots}</div>${list.map(item).join('')}</div>`; }).join('')}</div>
    <div class="cal-sel" id="calSel">${dayBlock(S.calSel)}</div>`;
  }
  $('#main').innerHTML = `<div class="view cal-view">
    ${brandNavHtml('cal')}
    <div class="cal-head"><h1>${esc(title)}</h1><div class="row cal-ctl">
      <div class="seg" role="group" aria-label="Calendar view"><button type="button" data-mode="month" aria-pressed="${mode === 'month'}">Month</button><button type="button" data-mode="list" aria-pressed="${mode === 'list'}">List</button></div>
      <button type="button" class="icon-btn" id="calPrev" aria-label="Previous month">${icons.left}</button><button type="button" class="btn btn-ghost btn-sm" id="calToday">Today</button><button type="button" class="icon-btn" id="calNext" aria-label="Next month">${icons.right}</button></div></div>
    ${confirmPosts().length ? `<div class="notice warn ck-ask" style="margin-bottom:12px">${confirmPosts().length} post${confirmPosts().length === 1 ? '' : 's'} you sent to your scheduler ${confirmPosts().length === 1 ? 'was' : 'were'} due. <a href="#" data-checkin>Did ${confirmPosts().length === 1 ? 'it' : 'they'} go out?</a></div>` : ''}
    ${unfinished.length ? `<div class="notice warn" style="margin-bottom:12px">${unfinishedText(unfinished.length, missingAll)} ${unfinished.length === 1 ? 'It’s' : 'They’re'} marked "Still to post" below.</div>` : ''}
    ${body}
    ${undated ? `<p class="small muted" style="margin-top:12px">${undated} post${undated === 1 ? ' has' : 's have'} no date yet.</p>` : ''}
  </div>`;
  const main = $('#main');
  wireBrandNav(main);
  $$('[data-checkin]', main).forEach((a) => a.onclick = (e) => { e.preventDefault(); openCheckins(); });
  $$('.seg [data-mode]', main).forEach((b) => b.onclick = () => { setCalMode(b.dataset.mode); openCalendar(S.calYm); });
  $('#calPrev').onclick = () => openCalendar(prev);
  $('#calNext').onclick = () => openCalendar(next);
  $('#calToday').onclick = () => { S.calSel = today; openCalendar(ymOf(new Date()), true); };
  const wireItems = (root) => $$('.cal-item', root).forEach((b) => b.onclick = (e) => { e.stopPropagation(); openPostFromCalendar(b.dataset.c, b.dataset.sku); });
  wireItems(main);
  // Phone month view: tap a day to list its posts underneath.
  $$('.cal-day:not(.out)', main).forEach((d) => {
    const pick = () => {
      S.calSel = d.dataset.day;
      $$('.cal-day.sel', main).forEach((x) => x.classList.remove('sel')); d.classList.add('sel');
      const box = $('#calSel'); if (box) { box.innerHTML = dayBlock(S.calSel); wireItems(box); }
    };
    d.onclick = pick;
    d.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
  if (focus) { const t = $('.cal-day.today, .cal-lday.today', main); if (t) t.scrollIntoView({ block: 'center' }); }
  else window.scrollTo({ top: 0 });
}
async function openPostFromCalendar(campId, sku) {

<script>

function artStyleSelectHtml(id, cur) {

}
function artStyleHint() { return S.brandData && (S.brandData.character_asset_url || ((S.brandData.design_system || {}).mascot_url)) ? 'Every post gets a new picture of your character in this style.' : 'Every post gets its own new picture in this style.'; }
function qrDefault() { const v = S.brandData && S.brandData.default_include_qr; return typeof v === 'boolean' ? v : true; }

/* ── Tone & caption-length selectors ─────────────────────────────── */
const TONE_OPTIONS = [
  ['professional', 'Professional'], ['casual', 'Casual'], ['humorous', 'Humorous'],
  ['serious', 'Serious'], ['inspiring', 'Inspiring'], ['playful', 'Playful'],
  ['urgent', 'Urgent'], ['calming', 'Calming'], ['educational', 'Educational'], ['bold', 'Bold'], ['warm', 'Warm'],
];
const CAPTION_LENGTH_OPTIONS = [['short', 'Short (1–2 sentences)'], ['medium', 'Medium (2–3 sentences)'], ['long', 'Long (4–6 sentences)']];
function toneSelectHtml(id, cur) {
  return `<select class="select" id="${id}"><option value="">Match the brand voice</option>${TONE_OPTIONS.map(([k, l]) => `<option value="${k}"${k === cur ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
}
function captionLengthSelectHtml(id, cur) {

}
function toneInstruction(tone) { return tone ? `Write all captions with a ${tone} tone.` : ''; }
function captionLengthInstruction(cl) { return cl === 'short' ? 'Keep every caption SHORT — 1 to 2 sentences maximum.' : cl === 'long' ? 'Write LONG captions — 4 to 6 sentences.' : ''; }

/* Images & slides of one post */
function brandImages(exceptSku) {
  const seen = new Set(); const out = [];
  (S.posts || []).forEach((p) => (p.media_urls || []).forEach((u) => { const b = String(u).split('?')[0]; if (p.sku !== exceptSku && !seen.has(b) && /^https:\/\//.test(u)) { seen.add(b); out.push({ url: u, sku: p.sku, idea: p.post_idea || p.sku }); } }));
  (S.campaigns || []).forEach((c) => { const e = c.ending_slide; if (e && e.mode === 'image' && e.url && !seen.has(e.url)) { seen.add(e.url); out.push({ url: e.url, sku: '', idea: 'Ending slide: ' + c.name }); } });

}
function readFileB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(file); });
}
async function uploadImage(file, kind = 'example-template') {
  if (!/^image\/(png|jpe?g|webp)$/i.test(file.type)) throw new Error('Use a PNG, JPG or WEBP image.');
  if (file.size > 8 * 1024 * 1024) throw new Error('Use an image under 8 MB.');
  const r = await api('upload-campaign-asset', { body: { brand: S.brand, kind, filename: file.name, base64: await readFileB64(file) } });
  return r.url;
}
function pickImage(exceptSku, title = 'Choose an image') {
  return new Promise((resolve) => {
    const list = brandImages(exceptSku); let done = false;
    const s = openSheet({
      title,
      body: list.length ? `<div class="img-pick">${list.map((it, i) => `<button type="button" data-i="${i}" title="${esc(it.idea)}"><img src="${esc(safeHttpUrl(it.url))}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join('')}</div>` : '<p class="muted">No images yet. Upload one instead.</p>',
      onClose: () => { if (!done) resolve(null); },

  });
}
async function openSlides(p0) {
  const sku = p0.sku;
  const p = () => S.posts.find((x) => x.sku === sku) || p0;
  let media = (p().media_urls || []).slice(0, MAX_IMAGES);
  let qrOn = p().qr_mode ? p().qr_mode !== 'off' : qrDefault();
  const s = openSheet({
    title: 'Images & slides',
    body: `<div class="stack">
      <p class="small muted" style="margin:0">Up to ${MAX_IMAGES} images, posted in this order. The first one is the cover.</p>

  };
}

function wireEndingField(c, el, state, p) {

function buildMetricool(posts, o) {

  const r = await fetch(FN('links-api'), { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()), body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));

}
function trkOwnHost() { try { return new URL(S.brandData.default_wheel_url).hostname.replace(/^www\./, '').toLowerCase(); } catch (_e) { return ''; } }
function trkIsOwn(url) { try { const own = trkOwnHost(); const h = new URL(url).hostname.replace(/^www\./, '').toLowerCase(); return !!own && (h === own || h.endsWith('.' + own)); } catch (_e) { return false; } }
function trkTag(url, p, k) {
  if (!trkIsOwn(url)) return url;
  let U; try { U = new URL(url); } catch (_e) { return url; }
  if (U.searchParams.has('utm_source')) return url;
  const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
  const camp = ((S.campaigns || []).find((c) => c.id === p.campaign_id) || {}).name || '';
  U.searchParams.set('utm_source', k || 'social'); U.searchParams.set('utm_medium', 'social');
  if (camp) U.searchParams.set('utm_campaign', slug(camp));
  U.searchParams.set('utm_content', String(p.sku || '').toLowerCase());
  return U.toString();
}
// The link a post should carry on one network: tagged, and short when the brand connected its own domain.
function linkFor(p, k) {
  const url = p.content_link || ''; if (!url) return '';
  const t = S.trk[S.brand]; if (!t || !t.eligible) return url;
  const tagged = t.tag ? trkTag(url, p, k) : url;
  if (t.short) { const sm = S.shortMap[S.brand + '|' + p.sku + '|' + (k || '') + '|' + tagged]; if (sm) return sm; }
  return tagged;
}
function swapLink(text, p, k) {
  const orig = p.content_link || ''; if (!orig || !text) return text;
  const mine = linkFor(p, k); return mine && mine !== orig ? String(text).split(orig).join(mine) : text;
}
async function trkLoad(force) {
  if (!S.brand) return null;
  const c = S.trk[S.brand];
  if (!force && c && Date.now() - c.at < 60000) return c;
  try { const r = await tlCall({ action: 'status', brand: S.brand }); S.trk[S.brand] = { at: Date.now(), eligible: !!r.eligible, tag: !!(r.active && r.active.tag), short: !!(r.active && r.active.short), host: r.active && r.active.host }; }
  catch (_e) { S.trk[S.brand] = { at: Date.now(), eligible: false, tag: false, short: false }; }
  return S.trk[S.brand];
}
async function trkPrime() {
  const brand = S.brand, t = S.trk[brand]; if (!t || !t.short) return;
  const items = [], seen = new Set();
  // only posts going out soon (or just gone out): old posts never get new short links, so a brand's history does not grow the bill
  const from = new Date(Date.now() - 14 * 86400000).toISOString().slice(0, 10);
  (S.posts || []).forEach((p) => {
    if (!p.content_link || !trkIsOwn(p.content_link)) return;
    if (!p.scheduled_date || String(p.scheduled_date).slice(0, 10) < from) return;
    const nets = targetKeys(p);
    (nets.length ? nets : ['']).forEach((k) => {
      const tagged = t.tag ? trkTag(p.content_link, p, k) : p.content_link, key = brand + '|' + p.sku + '|' + k + '|' + tagged;
      if (S.shortMap[key] || seen.has(key)) return; seen.add(key);
      items.push({ ref: p.sku, network: k, url: tagged, campaign: ((S.campaigns || []).find((c) => c.id === p.campaign_id) || {}).name || '' });
    });
  });
  for (let i = 0; i < items.length && i < 600; i += 100) {
    try { const r = await tlCall({ action: 'ensure', brand, items: items.slice(i, i + 100) }); Object.keys(r.map || {}).forEach((m) => { const [ref, net, ...rest] = m.split('|'); S.shortMap[brand + '|' + ref + '|' + net + '|' + rest.join('|')] = r.map[m]; }); }
    catch (_e) { break; }
  }
}

<script>

/* ── Voice: speak instead of type (2026-10-30) ───────────────────────────

/* A spoken logo name ("use the holiday logo bigger on the right") -> the real asset id. */
function resolveLogoByVoice(note) {

  let best = null;
  list.forEach((a) => {
    let nm = String(a.name || '').toLowerCase().replace(/\b(logo|icon|mark|asset)\b/g, '').replace(/\s+/g, ' ').trim();

/* ── Hands-free (2026-10-30) ─────────────────────────────────────────────

}

function hfApply() {

  if (off) { try { if (HF) hfStop(); } catch (e) {} const f = document.getElementById('hfFab'); if (f) f.remove(); toast('Hands-free mic button hidden. Bring it back from your account menu.'); }
  else { hfEnsureFab(); toast('Hands-free mic button is back.'); }
}

  let b = document.getElementById('hfBar'); if (!HF) { if (b) b.remove(); return; }
