<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Alchemist Admin</title>
<link rel="icon" href="/assets/logo-mark-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#12160f; --surface:#181d15; --surface-2:#1f251b; --line:#2c3428;
  --ink:#ece6d6; --ink-2:#c9c5b5; --muted:#949d8d;
  --gold:#e8a33d; --green:#3aa880; --red:#e06a52; --blue:#6aa7e8;
  --display:Fraunces,Georgia,serif; --body:"IBM Plex Sans",-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ground:#f3f0e7; --surface:#fffdf8; --surface-2:#f0ece1; --line:#ddd6c5;
    --ink:#1c2018; --ink-2:#3a4034; --muted:#666d5e;
    --gold:#c07f17; --green:#23805f; --red:#b8452f; --blue:#2f6db0; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ground:#f3f0e7; --surface:#fffdf8; --surface-2:#f0ece1; --line:#ddd6c5;
  --ink:#1c2018; --ink-2:#3a4034; --muted:#666d5e;
  --gold:#c07f17; --green:#23805f; --red:#b8452f; --blue:#2f6db0; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:14.5px/1.55 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:18px}
h1{font:600 26px/1.15 var(--display);margin:0}
h2{font:600 12px/1.3 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.kpi b{display:block;font:600 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi small{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.up{color:var(--green)} .down{color:var(--red)}
.insights{border-color:var(--gold);margin-bottom:14px}
.insights ul{margin:0;padding-left:18px;display:grid;gap:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);text-align:right;font-size:12px;padding:0 0 8px 8px}
td{padding:7px 0 7px 8px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:0;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
.bar{display:grid;grid-template-columns:128px 1fr 118px;gap:10px;align-items:center;padding:5px 0}
.bar i{display:block;height:20px;border-radius:5px;background:var(--gold);min-width:2px}
.bar .t{height:20px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar em{font-style:normal;color:var(--muted);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.bar.b2 i{background:var(--blue)} .bar.b3 i{background:var(--green)}
.muted{color:var(--muted)} .note{font-size:12.5px;color:var(--muted);margin-top:10px}
svg text{fill:var(--muted);font:11px var(--body)}
.msg{padding:40px 16px;text-align:center;color:var(--ink-2)}
a{color:var(--gold)}
.tk{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
.tk:first-of-type{border-top:0}
.tk h3{margin:0;font:600 14.5px/1.35 var(--body)}
.tk .meta{color:var(--muted);font-size:12.5px}
.tk .det{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:13.5px}
.tk .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tk textarea,.tk input{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.open{color:var(--red);border-color:var(--red)} .pill.in_progress{color:var(--gold);border-color:var(--gold)} .pill.resolved{color:var(--green);border-color:var(--green)}
.pill.claude{color:var(--blue);border-color:var(--blue)} .pill.ok{color:var(--green);border-color:var(--green)} .pill.warn{color:var(--gold);border-color:var(--gold)}
.msgs{display:grid;gap:6px}.msgs div{border-radius:9px;padding:7px 10px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2)}.msgs .u{border-left:3px solid var(--blue)}.msgs .t{border-left:3px solid var(--gold)}.msgs .c{border-left:3px solid var(--green)}.msgs b{display:block;font-size:11px;color:var(--muted);font-weight:600}
.pp{display:grid;gap:0}.pr{border-top:1px solid var(--line);padding:9px 0}.pr:first-child{border-top:0}
.prh{display:grid;grid-template-columns:minmax(0,2.2fr) 90px minmax(0,1.2fr) minmax(0,1.3fr) minmax(0,1.6fr) 56px;gap:10px;align-items:center;cursor:pointer;font-size:13.5px}
.prh>*{min-width:0;overflow-wrap:anywhere}.prh .e b{display:block;font-weight:600}.prh .e span{color:var(--muted);font-size:12px}
.phd{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;cursor:default}
.pdet{margin-top:10px;padding:12px;border-radius:11px;background:var(--surface-2);display:grid;gap:10px}
.pdet .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pdet h4{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pdet input[type=number]{width:90px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.pdet input[type=text]{flex:1 1 180px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.pf{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.pf input{flex:1 1 220px;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
@media (max-width:760px){.prh{grid-template-columns:1fr 1fr}.phd{display:none}}
.seg2{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg2 button{border:0;border-radius:0;background:none}.seg2 button[aria-pressed=true]{background:var(--surface-2);color:var(--gold)}
@media (max-width:560px){.bar{grid-template-columns:96px 1fr 92px}}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 16px;padding-bottom:0;-webkit-overflow-scrolling:touch}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted);padding:9px 14px;white-space:nowrap;font-weight:500}
.tabs button[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
.tabs button:hover{color:var(--ink)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:600;text-align:center}
h2.sec{font:600 18px/1.2 var(--display);letter-spacing:0;text-transform:none;color:var(--ink);margin:6px 0 12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 8px;vertical-align:baseline}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Loading…</div></div>
<script>
(function () {
  "use strict";
  var SB = "https://tpqvvrdglnsdljdpzwfl.supabase.co", KEY = "sb_publishable_TcW5WxZhUPuo2MhKWaBUKQ_EjkNzSJb", SK = "ccb-session";
  var app = document.getElementById("app");
  var days = 30;
  try { days = Number(localStorage.getItem("fma-admin-days")) || 30; } catch (e) {}

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function n(x) { return Number(x || 0).toLocaleString(); }
  function usd(c) { return "$" + (Number(c || 0) / 100).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function pct(a, b) { return b > 0 ? (Math.round(a / b * 1000) / 10) + "%" : "—"; }
  function delta(cur, prev) {
    if (!prev) return cur ? '<small class="up">new</small>' : "";
    var p = Math.round((cur - prev) / prev * 100);
    return '<small class="' + (p >= 0 ? "up" : "down") + '">' + (p >= 0 ? "▲ " : "▼ ") + Math.abs(p) + "% vs previous " + days + " days</small>";
  }
  function msg(h) { app.innerHTML = '<div class="msg">' + h + "</div>"; }

  function sessionGet() { try { return JSON.parse(localStorage.getItem(SK) || "null"); } catch (e) { return null; } }
  async function token() {
    var s = sessionGet();
    if (!s || !s.access_token) return null;
    if (s.expires_at && s.expires_at - Date.now() < 60000 && s.refresh_token) {
      try {
        var r = await fetch(SB + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
        if (r.ok) {
          var b = await r.json();
          s = { access_token: b.access_token, refresh_token: b.refresh_token || s.refresh_token, expires_at: Date.now() + (b.expires_in || 3600) * 1000, email: (b.user && b.user.email) || s.email };
          localStorage.setItem(SK, JSON.stringify(s));
        } else return null;
      } catch (e) { return s.access_token; }
    }
    return s.access_token;
  }

  async function load() {
    msg("Loading…");
    var t = await token();
    if (!t) { msg('Sign in on the <a href="/dashboard/">dashboard</a> first (as the admin), then reopen this page.'); return; }
    var r;
    try { r = await fetch(SB + "/functions/v1/admin-stats", { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + t }, body: JSON.stringify({ days: days }) }); }
    catch (e) { msg("Could not reach the server. Check your connection and refresh."); return; }
    var j = await r.json().catch(function () { return {}; });
    if (r.status === 403) { msg("This page is for the Alchemist admin account only."); return; }
    if (r.status === 401) { msg('Your sign-in ended. Open the <a href="/dashboard/">dashboard</a> to sign in again, then refresh.'); return; }
    if (!r.ok || !j.ok) { msg(esc(j.error || "Something went wrong building the report.") + " Try refreshing."); return; }
    render(j);
  }

  function bars(rows, color) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.v; }).concat([1]));
    var w = 640, h = 130, bw = w / Math.max(rows.length, 1), out = '<svg viewBox="0 0 ' + w + " " + (h + 20) + '" width="100%" role="img">';
    out += '<line x1="0" x2="' + w + '" y1="' + h + '" y2="' + h + '" stroke="var(--line)"/>';
    out += '<line x1="0" x2="' + w + '" y1="' + (h / 2) + '" y2="' + (h / 2) + '" stroke="var(--line)" stroke-dasharray="3 4"/>';
    rows.forEach(function (r, i) {
      var bh = Math.round(r.v / max * (h - 6));
      out += '<rect x="' + (i * bw + bw * 0.14).toFixed(1) + '" y="' + (h - bh) + '" width="' + (bw * 0.72).toFixed(1) + '" height="' + bh + '" rx="2" fill="' + color + '"><title>' + esc(r.l + ": " + n(r.v)) + "</title></rect>";
    });
    out += '<text x="0" y="' + (h + 14) + '">' + esc(rows.length ? rows[0].l : "") + '</text><text x="' + w + '" y="' + (h + 14) + '" text-anchor="end">' + esc(rows.length ? rows[rows.length - 1].l : "") + '</text>';
    out += '<text x="' + w + '" y="12" text-anchor="end">peak ' + n(max === 1 && !rows.some(function (r) { return r.v; }) ? 0 : max) + "</text></svg>";
    return out;
  }
  function short(d) { var p = String(d).split("-"); return p.length === 3 ? p[1] + "/" + p[2] : d; }
  function table(head, rows) {
    return '<div class="scroll"><table><thead><tr>' + head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      (rows.length ? rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") : '<tr><td colspan="' + head.length + '" class="muted">Nothing yet</td></tr>') + "</tbody></table></div>";
  }
  function funnel(steps) {
    var top = Math.max(steps[0].v, 1);
    return steps.map(function (s, i) {
      var prev = i ? steps[i - 1].v : null;
      return '<div class="bar b' + (i < 3 ? 1 : i < 4 ? 2 : 3) + '"><span>' + esc(s.l) + '</span><div class="t"><i style="width:' + Math.max(s.v / top * 100, s.v ? 1 : 0).toFixed(1) + '%"></i></div><em>' + n(s.v) + " · " + pct(s.v, top) + (prev && s.v <= prev ? " (" + pct(s.v, prev) + " of prev)" : "") + "</em></div>";
    }).join("");
  }

  var STAGE = { signed_up: "Signed up only", added_brand: "Added a brand", made_content: "Made content", paying: "Paying" };
  /* ---------- tabs ---------- */
  var TABS = [["overview", "Overview"], ["traffic", "Traffic & app stats"], ["users", "Users & comps"], ["revenue", "Revenue & plans"], ["product", "Content & Reach"], ["support", "Support"]];
  var tab = "overview", J = null;
  try { var hh = (location.hash || "").replace("#", ""); if (TABS.some(function (t) { return t[0] === hh; })) tab = hh; } catch (e) {}
  function stacked(rows) {   // rows: {l, a, b, c} people / unconfirmed / bots
    var max = Math.max.apply(null, rows.map(function (r) { return r.a + r.b + r.c; }).concat([1]));
    var w = 640, h = 130, bw = w / Math.max(rows.length, 1), out = '<svg viewBox="0 0 ' + w + " " + (h + 20) + '" width="100%" role="img" aria-label="Visits per day">';
    out += '<line x1="0" x2="' + w + '" y1="' + h + '" y2="' + h + '" stroke="var(--line)"/><line x1="0" x2="' + w + '" y1="' + (h / 2) + '" y2="' + (h / 2) + '" stroke="var(--line)" stroke-dasharray="3 4"/>';
    rows.forEach(function (r, i) {
      var x = (i * bw + bw * 0.14).toFixed(1), ww = (bw * 0.72).toFixed(1), y = h, parts = [[r.a, "var(--green)", "people"], [r.b, "var(--gold)", "unconfirmed"], [r.c, "var(--muted)", "bots"]];
      parts.forEach(function (p) { var bh = Math.round(p[0] / max * (h - 6)); if (!bh) return; y -= bh; out += '<rect x="' + x + '" y="' + y + '" width="' + ww + '" height="' + bh + '" fill="' + p[1] + '"><title>' + esc(r.l + " · " + p[2] + ": " + n(p[0])) + "</title></rect>"; });
    });
    out += '<text x="0" y="' + (h + 14) + '">' + esc(rows.length ? rows[0].l : "") + '</text><text x="' + w + '" y="' + (h + 14) + '" text-anchor="end">' + esc(rows.length ? rows[rows.length - 1].l : "") + '</text><text x="' + w + '" y="12" text-anchor="end">peak ' + n(max === 1 ? 0 : max) + "</text></svg>";
    return out + '<p class="note" style="margin:6px 0 0"><span class="dot" style="background:var(--green)"></span> people <span class="dot" style="background:var(--gold)"></span> unconfirmed <span class="dot" style="background:var(--muted)"></span> bots</p>';
  }
  function waiting() { return '<p class="muted">Waiting for the database update that adds this. Everything else on the page is live.</p>'; }

  function insights(j) {
    var out = [], s = j.site, f = s.funnel, ch = s.channels || [], pl = s.visits_people != null, ppl = pl ? s.visits_people : s.visits;
    if (pl && s.visits_unconfirmed + s.visits_bots > s.visits_people * 2 && s.visits_people + s.visits_unconfirmed + s.visits_bots >= 25) out.push("Most visits (" + n(s.visits_unconfirmed + s.visits_bots) + " of " + n(s.visits_all) + ") are bots or single-page visits with no scroll or click, so they are not counted as real visitors. That is why the real numbers are lower than the old total.");
    if (ppl < 25) out.push("Only " + n(ppl) + " real visitors so far. Give the counter a couple of weeks before reading much into the percentages.");
    var steps = [["visit", f.visits], ["pricing view", f.pricing], ["demo try", f.tried], ["sign-up click", f.signup_click], ["sign-up", f.signup]];
    var worst = null;
    for (var i = 1; i < steps.length; i++) { if (steps[i - 1][1] >= 10) { var r = steps[i][1] / steps[i - 1][1]; if (!worst || r < worst.r) worst = { r: r, a: steps[i - 1][0], b: steps[i][0] }; } }
    if (worst && ppl >= 25) out.push("Biggest drop-off: " + worst.a + " → " + worst.b + " (only " + Math.round(worst.r * 100) + "% continue). Fix that step first.");
    var key = pl ? "people" : "visits";
    var good = ch.filter(function (c) { return c[key] >= 10; }).sort(function (a, b) { return b.signups / b[key] - a.signups / a[key]; })[0];
    if (good && good.signups) out.push("Best converting source: " + good.channel + " (" + pct(good.signups, good[key]) + " of " + n(good[key]) + " visitors sign up).");
    var b = s.blog; if (b && b.landed >= 10) out.push("Blog: " + n(b.landed) + " visits started on a blog post and " + n(b.landed_signup_clicks) + " clicked sign up. " + (b.landed_signup_clicks ? "" : "Add a clearer next step at the end of each post."));
    var a = j.activation;
    if (a.signed_up >= 5) {
      if (a.brand / a.signed_up < 0.6) out.push("Only " + pct(a.brand, a.signed_up) + " of new accounts add a brand. Onboarding is losing people before they see value.");
      else if (a.brand && a.generated / a.brand < 0.6) out.push("Of accounts that add a brand, only " + pct(a.generated, a.brand) + " generate any content. The first-post step needs to be easier.");
    }
    var cv = j.conversion; if (cv && cv.ext_accounts && !cv.paying) out.push(n(cv.ext_accounts) + " customer accounts and none paying yet. " + n(cv.activated) + " have made content: those are the ones to talk to.");
    var act = j.activity; if (act && act.signed_in_but_stale) out.push(n(act.signed_in_but_stale) + " customer(s) are using the app but signed in more than a week ago. They now count as active (the old numbers missed them).");
    var rc = j.reach, rm = j.revenue.reach_mrr_cents;
    if (rc.est_cost_cents > 0 && rm > 0 && rc.est_cost_cents > rm * 0.3) out.push("Reach AI cost (" + usd(rc.est_cost_cents) + " est.) is over 30% of Reach monthly revenue. Watch plan limits.");
    if (rc.calls && rc.failed / rc.calls > 0.05) out.push(Math.round(rc.failed / rc.calls * 100) + "% of Reach AI calls failed. Check the logs.");
    var stuck = (j.recent || []).filter(function (x) { return (x.stage === "signed_up" || x.stage === "added_brand") && (Date.now() - Date.parse(x.created_at)) / 86400000 >= 2; });
    if (stuck.length) out.push(n(stuck.length) + " of your last " + n((j.recent || []).length) + " accounts joined 2+ days ago and never made content. See Newest accounts and email them.");
    if (j.support && j.support.open_tickets) out.push(n(j.support.open_tickets) + " open problem report(s) waiting. See the Support tab.");
    if (j.accounts.unsure) out.push(n(j.accounts.unsure) + " new account(s) can’t be told apart between Alchemist and SpinQuest yet. Check Users → “app unclear”.");
    if (!out.length) out.push("Nothing alarming. Numbers are steady for this period.");
    return out;
  }

  function header(j) {
    return '<header><div><h1>Alchemist Admin</h1><div class="muted">Last ' + j.days + ' days · UTC · updated ' + esc(new Date(j.generated_at).toLocaleTimeString()) + '</div></div>' +
      '<div class="tools"><select id="rng" aria-label="Date range"><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option><option value="365">12 months</option></select>' +
      '<button id="rf">Refresh</button><button id="nt" title="Stops the visit counter in this browser">' + (notrack() ? "Counting me: off" : "Counting me: on") + '</button></div></header>' +
      '<nav class="tabs" role="tablist">' + TABS.map(function (t) { var badge = t[0] === "support" && j.support && j.support.open_tickets ? ' <span class="badge">' + n(j.support.open_tickets) + "</span>" : ""; return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + esc(t[1]) + badge + "</button>"; }).join("") + "</nav>";
  }

  function tOverview(j) {
    var s = j.site, f = s.funnel, a = j.accounts, v = j.revenue, ac = j.activation, act = j.activity || {}, cv = j.conversion || {}, pl = s.visits_people != null;
    var mrr = (v.content_mrr_cents || 0) + (v.reach_mrr_cents || 0), ppl = pl ? s.visits_people : s.visits;
    var h = '<div class="grid kpis">' +

  }
  /* People: everyone who signed up, how they found us, roughly where, their plans, and the account actions. */
  var peopleQ = "", peopleF = "all", peopleScope = "alch", peopleData = null;
  /* One login system is shared with SpinQuest and other apps, so "everyone" includes their players. Alchemist = tagged Alchemist, accepted our terms, or has a brand or Reach workspace. "Unclear" = no sign of either app yet, shown here so a brand-new sign-up is never hidden. */
  function isAlch(p) { if (p.app) return p.app === "alchemist" || p.app === "unknown"; return !!(p.signup_app === "alchemist" || p.brands.length || p.client_id || p.content || p.reach || p.is_admin || (Date.now() - new Date(p.created_at).getTime()) < 14 * 86400000); }
  var AREA = { America: "Americas", Europe: "Europe", Asia: "Asia", Africa: "Africa", Australia: "Oceania", Pacific: "Oceania", Atlantic: "Atlantic", Indian: "Indian Ocean" };
  function region(tz) { if (!tz) return "\u2014"; var p = String(tz).split("/"); return (p[p.length - 1] || "").replace(/_/g, " ") + (AREA[p[0]] ? " \u00b7 " + AREA[p[0]] : ""); }
  function ago(d) { if (!d) return "\u2014"; var m = Math.floor((Date.now() - Date.parse(d)) / 60000); if (m < 60) return Math.max(m, 1) + "m ago"; if (m < 2880) return Math.floor(m / 60) + "h ago"; return Math.floor(m / 1440) + "d ago"; }
  async function fnPost(name, body) {
    var t = await token(); if (!t) throw new Error("Sign in again on the dashboard.");
    var r = await fetch(SB + "/functions/v1/" + name, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + t }, body: JSON.stringify(body) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(j.error || "Something went wrong.");
    return j;
  }
  function planPill(p, kind) {

  }
  async function loadPeople() {
    var box = document.getElementById("ppBody"); if (!box) return;
    try { if (!peopleData) peopleData = await fnPost("admin-people", { action: "list" }); } catch (e) { box.textContent = e.message; return; }
    drawPeople();
  }
  function drawPeople() {
    var box = document.getElementById("ppBody"), d = peopleData; box.className = "";
    var q = peopleQ.toLowerCase();
    var nAlch = d.people.filter(isAlch).length;
    var list = d.people.filter(function (p) {
      if (peopleScope === "alch" && !isAlch(p)) return false;
      if (q && (p.email + " " + (p.name || "") + " " + p.brands.join(" ") + " " + region(p.tz)).toLowerCase().indexOf(q) < 0) return false;
      var c = p.content, free = !c || c.plan_key === "free";
      if (peopleF === "paying") return c && c.pays_by_card;
      if (peopleF === "comped") return (c && c.is_comp) || (p.reach && p.reach.is_comp);
      if (peopleF === "free") return free && !(p.reach && p.reach.plan_key && p.reach.plan_key !== "free");
      if (peopleF === "nobrand") return !p.brands.length;

    });
    box.innerHTML = '<div class="pf"><span class="seg2"><button type="button" data-ps="alch" aria-pressed="' + (peopleScope === "alch") + '">Alchemist (' + n(nAlch) + ')</button><button type="button" data-ps="all" aria-pressed="' + (peopleScope === "all") + '">Everyone (' + n(d.people.length) + ')</button></span><input id="ppQ" placeholder="Search email, name, brand or place" value="' + esc(peopleQ) + '"><span class="seg2">' +
      [["all", "All"], ["paying", "Paying"], ["comped", "Comped"], ["free", "Free"], ["nobrand", "No brand yet"]].map(function (x) { return '<button type="button" data-pf="' + x[0] + '" aria-pressed="' + (peopleF === x[0]) + '">' + x[1] + "</button>"; }).join("") + '</span></div>' +
      '<div class="pp"><div class="prh phd"><span>Person</span><span>Signed up</span><span>How they came</span><span>Where</span><span>Plans</span><span>Active · used 30d</span></div><div id="ppList"></div></div>' +
      '<p class="note">' + n(list.length) + " of " + n(d.people.length) + ". " + (peopleScope === "alch" ? "SpinQuest players share this login system. They are hidden here and appear under Everyone. \u201capp unclear\u201d means no sign of either app yet. " : "") + "Region is a guess from the browser timezone (no IP kept), so older accounts fill in as people next open the app. \u201cHow they came\u201d only exists for sign-ups after the visit counter linked them; the rest show how they log in.</p>";
    var ul = document.getElementById("ppList");

      var row = document.createElement("div"); row.className = "pr";
      var src = p.source ? p.source.channel + (p.source.campaign ? " \u00b7 " + p.source.campaign : "") : ({ google: "Google sign-in", email: "Email sign-up" }[p.provider] || p.provider);

      var c = row.querySelectorAll(".prh>*");
      c[0].querySelector("b").textContent = p.name || p.email; c[0].querySelector("span").textContent = (p.name ? p.email + " \u00b7 " : "") + (p.brands.join(", ") || "no brand yet") + (p.internal ? " \u00b7 yours" : p.app === "spinquest" ? " \u00b7 SpinQuest player" : p.app === "unknown" ? " \u00b7 app unclear" : "");
      c[1].textContent = new Date(p.created_at).toLocaleDateString(); c[2].textContent = src; c[3].textContent = region(p.tz);

  function fillDetail(dt, p) {

      '<div class="row"><span class="meta">Bonus credits: ' + n(c.bonus_credits) + '</span><input type="number" data-amt min="1" max="1000" value="20"><input type="text" data-note maxlength="200" placeholder="Why (private)"><button type="button" data-gift>Give credits</button></div>' +
      "<h4>Reach</h4>" +
