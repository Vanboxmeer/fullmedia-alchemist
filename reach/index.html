/* =====================================================================
   DEAL CHECKLIST & APPROVAL GATES
   A brand lists what has to be true before a deal moves on: an NDA signed, a contract
   signed, a client / licensing / payments approval, the right materials shared. Each item
   is tied to a checkpoint in the deal. Open items show as alerts on the row, and moving a
   deal past its checkpoint asks first. Definitions live in workspace settings (agents only,
   never visible to a client); confirmations live on the deal.
   ===================================================================== */
const GATE_CPS=[
  {k:"send",label:"Before first outreach",short:"before sending",rank:1,verb:"send this"},
  {k:"reply",label:"Before we respond to their reply",short:"before replying",rank:2,verb:"reply"},
  {k:"negotiate",label:"Before agreeing terms",short:"before agreeing terms",rank:3,verb:"agree terms"},
  {k:"close",label:"Before closing as won",short:"before closing",rank:4,verb:"close this deal"}
];
const GATE_PHASE_RANK={sent:1,replied:2,deal:3,won:4};
const GATE_PRESETS=[
  {label:"NDA signed",kind:"nda",owner:"Legal",cp:"reply",level:"block"},
  {label:"Contract / agreement signed",kind:"signature",owner:"",cp:"close",level:"block"},
  {label:"Client approval",kind:"approval",owner:"Client",cp:"negotiate",level:"block"},
  {label:"Licensing / rights cleared",kind:"licensing",owner:"Licensing",cp:"negotiate",level:"block"},
  {label:"Payment / budget approved",kind:"payment",owner:"Finance",cp:"close",level:"block"},
  {label:"Legal review done",kind:"legal",owner:"Legal",cp:"reply",level:"warn"},
  {label:"Right materials shared (deck, media kit, assets)",kind:"assets",owner:"",cp:"reply",level:"warn"}
];
function gateCp(k){ return GATE_CPS.find(c=>c.k===k)||GATE_CPS[2]; }
function brandGates(bid){ const m=state.meta.find(x=>x.id==="gates_"+bid); return m&&Array.isArray(m.items)?m.items:[]; }
function gatesFor(d){ if(typeof clientMode==="function"&&clientMode()) return []; const lead=isLead(d); return brandGates(d.brandId).filter(g=>g&&g.label&&(g.flow==="lead"?lead:g.flow==="coverage"?!lead:true)); }
/* where the deal is: 0 = not sent yet, 1..4 = sent / replied / negotiating / won; -1 = closed, held or off the table */
function gateRank(d){ const ph=phaseOf(d); if(ph==="research"||ph==="ready") return 0; return GATE_PHASE_RANK[ph]||-1; }
function gateDone(d,g){ const s=d.gates&&d.gates[g.id]; return !!(s&&(s.st==="done"||s.st==="na")); }
function gateUnmet(d,rank){ return gatesFor(d).filter(g=>g.type!=="note"&&gateCp(g.cp).rank<=rank&&!gateDone(d,g)); }
function gateNames(list){ return list.map(g=>g.label).join(", "); }
function gateAlerts(d){
  const gs=gatesFor(d); if(!gs.length) return []; const r=gateRank(d); if(r<0) return [];
  const out=[], checks=gs.filter(g=>g.type!=="note"&&!gateDone(d,g));
  const late=r>=1?checks.filter(g=>gateCp(g.cp).rank<=r):[];
  if(late.length){ const hard=late.some(g=>g.level==="block"); out.push({code:"gate",lvl:hard?"bad":"warn",text:"Not confirmed yet: "+gateNames(late)+" — this deal is already past the checkpoint. Confirm it in the checklist.",short:late.length+" check"+(late.length>1?"s":"")+" open"}); }
  const next=checks.filter(g=>gateCp(g.cp).rank===r+1);
  if(next.length&&r<4) out.push({code:"gatenext",lvl:"info",text:"Needed "+gateCp(next[0].cp).short+": "+gateNames(next)+".",short:"Next: "+next[0].label});
  return out;
}
function gateLog(id,text){ createDoc("comms",uid("comm"),{dealId:id,direction:"Note",channel:"",summary:text,date:todayISO(),createdAt:Date.now()}); }
function gateSet(id,gid,st,note){
  const d=ix().deal.get(id); if(!d) return; const cur=Object.assign({},d.gates||{}); const g=gatesFor(d).find(x=>x.id===gid);
  if(!st) delete cur[gid]; else cur[gid]={st,at:todayISO(),note:note!=null?note:((cur[gid]&&cur[gid].note)||"")};
  patchDeal(id,{gates:cur}); if(st&&g) gateLog(id,"Checklist: "+g.label+(st==="na"?" — not needed":" — confirmed")); afterRowChange(id);
}
function gateNoteSave(id,gid,val){ const d=ix().deal.get(id); if(!d||!d.gates||!d.gates[gid]) return; const cur=Object.assign({},d.gates); cur[gid]=Object.assign({},cur[gid],{note:val}); patchDeal(id,{gates:cur}); }

/* ---- the row's checklist (deal pane) ---- */
function gatesPaneHtml(d){
  const gs=gatesFor(d); if(!gs.length) return ""; const r=gateRank(d);
  const checks=gs.filter(g=>g.type!=="note").sort((a,b)=>gateCp(a.cp).rank-gateCp(b.cp).rank), notes=gs.filter(g=>g.type==="note");
  const done=checks.filter(g=>gateDone(d,g)).length;
  const rows=checks.map(g=>{
    const s=d.gates&&d.gates[g.id], ok=!!(s&&(s.st==="done"||s.st==="na")), late=!ok&&r>=1&&gateCp(g.cp).rank<=r;
    return '<div class="grow'+(ok?" ok":"")+(late?" late":"")+'"><input type="checkbox" data-p="gate" data-g="'+esc(g.id)+'"'+(s&&s.st==="done"?" checked":"")+(s&&s.st==="na"?" disabled":"")+' title="Confirm"><div class="gmain">'
      +'<div class="gl">'+esc(g.label)+(g.level==="block"?' <span class="glvl">Required</span>':'')+(s&&s.st==="na"?' <span class="glvl na">Not needed</span>':'')+'</div>'
      +'<div class="gm">'+esc(gateCp(g.cp).label)+(g.owner?' · '+esc(g.owner):'')+(ok&&s.at?' · '+(s.st==="na"?"marked":"confirmed")+' '+esc(fmtShort(s.at)):'')+'</div>'
      +(s&&s.st==="done"?'<input type="text" class="gnote" data-gn="'+esc(g.id)+'" placeholder="Note — who signed, reference, where it is saved…" value="'+esc(s.note||"")+'">':'')+'</div>'
      +(ok?'<button class="btn tiny" data-p="gateundo" data-g="'+esc(g.id)+'" title="Undo">Undo</button>':'<button class="btn tiny" data-p="gatena" data-g="'+esc(g.id)+'" title="This deal does not need it">N/A</button>')+'</div>';
  }).join("");
  const nrows=notes.filter(g=>gateCp(g.cp).rank<=Math.max(r,0)+1).map(g=>'<div class="al warn gnotebox"><span class="t">'+esc(g.label)+'</span></div>').join("");
  return '<div class="psec gsec"><h4>Checklist <span class="sp"></span><span class="mini">'+(checks.length?done+' of '+checks.length+' confirmed':'Reminders')+'</span></h4>'+nrows+rows+'</div>';
}

/* =====================================================================
   VERIFY FIRST (DYOR) — added 2026-11-01
   Reach finds and contacts partners; it does not verify them. Anyone can list an option in
   the public library and a closed-deal history proves nothing about a new seller, so the
   duty to check who they are sits with the user. This block teaches the checks, asks for
   them before a deal is negotiated or won and before money is scheduled, flags drafts that
   ask for credentials or payment details, and records what the user says they checked.
   ===================================================================== */
const VERIFY_CHECKS=[
  {k:"who",t:"They are who they say they are",d:["Match the name, website and social handle in at least two independent places: their own site, the platform's profile, a business registry or LinkedIn.","Look up how old the domain is (a WHOIS lookup). Their email domain should match their website, not a free address or a look-alike spelling.","Search their name or handle with words like “scam”, “review” and “complaint”. Read reviews on sites they do not control."]},
  {k:"reach",t:"Their audience or traffic is real",d:["Ask for current analytics screenshots or a media kit, then compare them with what you can see in public.","Look for sudden follower jumps, very low engagement for the size, and generic or repeated comments.","For sites, check traffic with an independent tool (for example Similarweb or Ahrefs) and open the pages they say they will place you on."]},
  {k:"contact",t:"You spoke to them on a channel you found yourself",d:["Reach them through the contact on their official site or verified profile, not only through a link or number in the message they sent you.","Get on a short video call. A real business or creator can usually do this.","Ask for two past clients you can contact, and contact them yourself. Run a reverse image search on profile pictures."]},
  {k:"pay",t:"You know how the money moves, and it is protected",d:["Prefer a method with buyer protection or escrow: a card, a marketplace's own checkout, or an escrow service for domains, sites and accounts.","Be very careful with wire transfers, crypto, gift cards and instant payment apps. They are hard or impossible to reverse.","With someone new, start small or pay in milestones, not 100% up front.","Check the account name matches the person or business you verified. If payment details change, confirm them by phone or on a second channel before you send anything."]},
  {k:"info",t:"You are only sharing what you must",d:["Never share passwords, one-time codes, API keys, seed phrases, or ID, bank or card numbers.","If a partner needs access to a page, ad account or store, add them with a limited role through the platform's own partner or invite feature. Do not hand over a login.","Sign an NDA before you share unreleased or confidential material, and share files through links you can switch off."]},
  {k:"paper",t:"The deal is in writing",d:["Put the price, deliverables, dates, usage rights and what happens if something is not delivered in writing, even if it is an email you both confirm.","Keep copies of the messages and any receipts."]}
];
const VERIFY_FLAGS=["Pressure to decide or pay right now.","A price far below the market, or an offer that sounds too good.","Payment asked for before anything is shown, or only by wire, crypto or gift card.","A request for your password, a code sent to your phone, or admin access to an account.","A “verification”, “release” or “insurance” fee.","A cheque or payment that is larger than the price, with a request to send the difference back.","They will not get on a call, or their details do not match from one place to the next.","A website or email address that is almost, but not exactly, a name you know."];
function dyorDone(d){ return !!(d&&d.dyor&&d.dyor.at); }
function dyorNeeded(d){ return !!d&&!(typeof clientMode==="function"&&clientMode())&&!dyorDone(d); }
const RISK_RULES=[
  ["a password, code or key",/pass ?word|passcode|log ?in (details|credentials|info)|credentials|2fa|verification code|one[- ]time (code|pass)|\botp\b|api key|secret key|seed phrase|private key/i],
  ["payment details",/bank (account|details|transfer)|routing number|\biban\b|\bswift\b|wire (transfer|me|the)|card number|\bcvv\b|venmo|cash ?app|zelle|crypto|wallet address|bitcoin|usdt|gift ?card|western union/i],
  ["identity documents",/passport|driver'?s licen[cs]e|\bssn\b|social security|tax id|photo id|id (card|document)/i],
  ["account or asset access",/admin (access|rights)|add me as (an )?admin|transfer (the |your |of )?(domain|account|channel|page|handle|site)|ownership transfer|share (your )?(login|account)/i]
];
function riskScan(text){ const t=String(text||""); if(t.length<8) return []; return RISK_RULES.filter(r=>r[1].test(t)).map(r=>r[0]); }
function riskBox(text){ const f=riskScan(text); if(!f.length) return ""; return '<div class="al warn" style="margin:0 0 8px"><span class="t"><b>This message mentions '+esc(f.join(", "))+'.</b> Be sure you know who you are dealing with before you share or ask for it. <button class="lnk" data-p="verify" type="button">How to verify</button></span></div>'; }
function dyorPaneHtml(d){
  if(typeof clientMode==="function"&&clientMode()) return "";
  const r=gateRank(d), done=dyorDone(d); if(!done&&r<2) return "";
  const dy=d.dyor||{};
  return '<div class="psec gsec"><h4>Verify first <span class="sp"></span><span class="mini">'+(done?(dy.done||[]).length+' of '+VERIFY_CHECKS.length+' checks ticked · '+esc(fmtShort(dy.at)):'Not done yet')+'</span></h4>'
    +'<div class="mini" style="margin:0 0 8px">Reach does not verify anyone. Before you share sensitive information or send money or assets, check them yourself.</div>'
    +'<button class="btn tiny'+(done?'':' primary')+'" data-p="verify" type="button">'+(done?'Review my checks':'Verify this partner')+'</button></div>';
}
function openVerify(id,go,cancel){
  const d=id?ix().deal.get(id):null, prev=(d&&d.dyor)||null, gate=typeof go==="function";

    +'<details class="more" style="margin:4px 0 0 '+(d?'26':'0')+'px"'+(d?'':' open')+'><summary>How to check</summary><ul style="margin:6px 0 2px 18px;padding:0;font-weight:400;font-size:13px;line-height:1.5">'+c.d.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></details></div>').join("");

    +(d?'<div class="field" style="margin-top:12px"><label>Note <span class="mini">(optional, saved on the deal)</span></label><input type="text" id="vfNote" value="'+esc(note)+'" placeholder="e.g. Called them on the number from their site, paying via escrow"></div>'
      +'<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-top:12px;font-size:13px"><input type="checkbox" id="vfAck"'+(ack?" checked":"")+' style="margin-top:3px"><span>I understand Reach and UPM do not verify partners, and that verifying them is my responsibility.</span></label>':'')
    +'</div><div class="mfoot"><button class="btn" id="mCancel">'+(d?'Cancel':'Close')+'</button>'+(d?'<button class="btn primary" id="vfGo"'+(ack?'':' disabled')+'>'+(gate?'Continue':'Save my checks')+'</button>':'')+'</div>';
  openModal(html,true);

function payGuard(id,go,cancel){
  const d=ix().deal.get(id); if(!d||(typeof clientMode==="function"&&clientMode())) return go();
  if(dyorNeeded(d)) return openVerify(id,go,cancel);
  const li=["Confirm the payment details on a second channel: call or message them on a contact you found yourself, not the one printed on the invoice.","Check the account name matches the person or business you verified.","Prefer buyer protection or escrow. Be careful with wire transfers, crypto, gift cards and instant payment apps.","With someone new, start small or pay in milestones."];
  openModal('<div class="mhead"><h3>Before money moves</h3><button class="iconbtn" id="mClose">&times;</button></div><div class="mbody"><div class="hint" style="margin:0 0 8px">Reach does not verify who gets paid. Check these yourself first.</div><ul style="margin:0 0 4px 18px;padding:0;font-size:13.5px;line-height:1.55">'+li.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div><div class="mfoot"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="pgGo">I have checked, continue</button></div>',false);

document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-verify-guide]"); if(b){ e.preventDefault(); openVerify(null); } });
const VERIFY_BANNER='<div class="al warn" style="margin:10px 0"><span class="t"><b>Not verified.</b> Anyone can list an option here. Neither UPM nor Reach has checked this seller, and their past deals do not prove they are real. Verify them yourself before you pay or share anything. <button class="lnk" data-verify-guide type="button">How to verify</button></span></div>';

/* ---- ask before a deal moves past a checkpoint ---- */
function gateGuard(id,rank,go,o){
  o=o||{}; const d=ix().deal.get(id); if(!d) return false;
  if(rank>=3&&dyorNeeded(d)){ if(o.bulk) return false; openVerify(id,()=>{ if(gateGuard(id,rank,go,o)) go(); },o.cancel); return false; }
  const un=gateUnmet(d,rank); if(!un.length) return true;
  if(o.bulk) return false; gateModal(id,rank,go,o.cancel); return false;
}
function gateModal(id,rank,go,cancel){
  const cp=GATE_CPS.find(c=>c.rank===rank)||GATE_CPS[0]; let reason="", closed=false;

const MAIL_STALE_DAYS=2;
function lastMailCheck(){ return Math.max(Number(wsMeta().lastMailCheck)||0,INBOX_LIVE?INBOX_LAST:0); }
function lastCheckText(){ const t=lastMailCheck(); if(!t) return "never"; const iso=isoOf(new Date(t)); return agoText(iso); }
function mailStale(){ const t=lastMailCheck(); return !t||(Date.now()-t)>MAIL_STALE_DAYS*86400000; }

/* what kind of place do we have to look for this row's answer? */
function chanLabel(d){
  const i=dmInfo(d), em=emailOf(d);
  if(em) return mailCovered()?"Email (Gmail)":"Email (Gmail not connected)";
  const l=i.label||"";
  if(/Instagram/.test(l)) return "Instagram DMs"; if(/TikTok/.test(l)) return "TikTok DMs"; if(/Open X/.test(l)) return "X DMs"; if(/Telegram/.test(l)) return "Telegram";
  if(/Discord/.test(l)) return "Discord"; if(/Reddit|mods/.test(l)) return "Reddit messages"; if(/YouTube/.test(l)) return "YouTube"; if(/Twitch/.test(l)) return "Twitch";
  if(i.href) return "Contact form / site ("+hostOf(i.href)+")";
  return "No contact route on file";
}
function checkTracked(){ return trackedFor(state.currentBrandId||""); }
/* rows Gmail can look at vs rows that need a human */
function checkSplit(){
  const rows=checkTracked(), gm=mailCovered(), tdy=todayISO(), skip=addDays(tdy,-2);
  const auto=[], manual=[];
  rows.forEach(d=>{ const ph=phaseOf(d); if(ph==="ready") return; if((targetForDeal(d)||{}).orderVia) return; const em=emailOf(d);
    if(em&&gm){ auto.push(d); return; }
    if(ph==="replied"){ const s=stallOf(d); if(s&&s.on==="us") return; }  /* we already know they answered and the ball is ours */

}

/* =====================================================================
   PAUSED / CANCELLED — a brand or a campaign can be put on hold. Nothing is deleted or re-staged:
   the hold is read live, so resuming is one click. While held, nudges stop, follow-up dates stop
   nagging, "ready to send" rows get a warning, and every open conversation gets a professional
   note (drafts only — never sent) that keeps the door open for other brands and campaigns.
   ===================================================================== */
const HOLD_STATUSES=["Paused","Cancelled"];
function holdOf(d){
  const I=ix(), b=I.brand.get(d.brandId), w=I.wave.get(d.waveId);
  if(b&&HOLD_STATUSES.includes(b.status)) return {kind:b.status,scope:"brand",id:b.id,name:b.name||"This brand",note:b.statusNote||"",brand:b.name||""};
  if(w&&HOLD_STATUSES.includes(w.status)) return {kind:w.status,scope:"campaign",id:w.id,name:w.name||"This campaign",note:w.statusNote||"",brand:(b&&b.name)||""};
  return null; }
/* A paused/cancelled campaign or brand is OUT OF THE WAY: its open rows leave every work tab and count (Needs me, drafts, ready,
   awaiting, stalled, follow-ups, replies, deals and the header badges). They live in the "Paused" tab, which lights up when someone
   in a paused campaign has replied. Exception: if you open that campaign (or brand) yourself, you see its rows normally. */
function hiddenByHold(d){ const h=holdOf(d); if(!h||!isOpen(phaseOf(d))) return false;
  const w=state.wb||{}; if(w.wave&&w.wave===d.waveId) return false;
  if(h.scope==="brand"&&state.currentBrandId&&state.currentBrandId===d.brandId) return false;
  return true; }
/* when a hold was lifted, ladders restart from that day instead of dumping every row as overdue */
function resumeDate(d){ const I=ix(), b=I.brand.get(d.brandId)||{}, w=I.wave.get(d.waveId)||{}; return [b.resumedAt,w.resumedAt].filter(x=>/^\d{4}-/.test(x||"")).sort().pop()||""; }
function inConversation(d){ const ph=phaseOf(d); return ph==="replied"||ph==="deal"; }
/* held and nothing for a human to do except (maybe) answer a reply */
function heldQuiet(d){ return !!holdOf(d)&&!inConversation(d)&&!d.suggest; }
function holdTplFor(d){ const h=holdOf(d); if(h) return h.kind==="Paused"?"X1":"X2"; return ""; }
function holdLabel(h){ return (h.kind==="Paused"?"⏸ ":"⛔ ")+h.name+" is "+h.kind.toLowerCase(); }

function holdRows(){ return wbBase().filter(d=>holdOf(d)&&isOpen(phaseOf(d))); }
function holdBanner(){
  if(clientMode()) return ""; const rows=holdRows(); if(!rows.length) return "";
  const g=new Map(); rows.forEach(d=>{ const h=holdOf(d), k=h.scope+":"+h.id; if(!g.has(k)) g.set(k,{h,rows:[]}); g.get(k).rows.push(d); });
  return Array.from(g.values()).filter(x=>!bnHidden("hold_"+x.h.id)).slice(0,4).map(x=>{ const talk=x.rows.filter(inConversation), need=talk.filter(d=>!(d.holdNote)&&!hasDraft(d)).length;
    return '<div class="banner warn"><span><b>'+esc(holdLabel(x.h))+'.</b> '+x.rows.length+' open row'+(x.rows.length===1?"":"s")+' on hold — no nudges, no follow-up alerts.'+(talk.length?' <b>'+talk.length+'</b> '+(talk.length===1?"conversation is":"conversations are")+' open with real people'+(need?' — '+need+' still need'+(need===1?"s":"")+' a polite note, so nobody is left hanging.':' — they already have drafts; check the wording keeps the door open.'):"")+'</span><span class="sp"></span>'
      +(talk.some(d=>phaseOf(d)==="replied")?'<button class="btn small primary" data-hold="view">See '+talk.filter(d=>phaseOf(d)==="replied").length+' repl'+(talk.filter(d=>phaseOf(d)==="replied").length===1?'y':'ies')+'</button>':'')
      +(need?'<button class="btn small primary" data-hold="notes" data-scope="'+esc(x.h.scope)+'" data-id="'+esc(x.h.id)+'">Draft '+need+' polite note'+(need===1?"":"s")+'</button>':'')
      +'<button class="btn small" data-hold="resume" data-scope="'+esc(x.h.scope)+'" data-id="'+esc(x.h.id)+'">Resume</button>'+BN_X("hold_"+x.h.id)+'</div>'; }).join("");
}
function wireHoldBanner(root){
  (root||document).querySelectorAll("[data-hold]").forEach(b=>b.addEventListener("click",()=>{ const a=b.dataset.hold, sc=b.dataset.scope, id=b.dataset.id;
    if(a==="view"){ state.wb.view="hold"; saveWb(); render(); return; } if(a==="notes") return openHoldNotes(sc,id); if(a==="resume") return setHold(sc,id,"Active",""); }));
}
function holdTarget(sc,id){ return sc==="brand"?brandById(id):ix().wave.get(id); }
function setHold(sc,id,status,note){
  const o=holdTarget(sc,id); if(!o) return; const coll=sc==="brand"?"brands":"waves"; const was=o.status||"Active";
  const p={status,statusNote:note||"",statusAt:todayISO()}; if(status==="Active"&&HOLD_STATUSES.includes(was)) p.resumedAt=todayISO();
  patchDoc(coll,id,p); stallCache.clear(); if(typeof alertCache!=="undefined") alertCache.clear();
  toast((o.name||"It")+(status==="Active"?" resumed — follow-up timers restart from today":" marked "+status.toLowerCase()+" — nudges and follow-up alerts are off"));
  render();
  if(HOLD_STATUSES.includes(status)){ const rows=(ix().byBrand.get(sc==="brand"?id:o.brandId)||[]).filter(d=>(sc==="brand"||d.waveId===id)&&isOpen(phaseOf(d))&&inConversation(d)); if(rows.length) setTimeout(()=>openHoldNotes(sc,id),250); }
}
function openHoldPicker(brandId,focus){
  const b=brandById(brandId); if(!b) return;
  const allRows=ix().byBrand.get(brandId)||[];
  const nOpen=(sc,id)=>allRows.filter(d=>(sc==="brand"||d.waveId===id)&&isOpen(phaseOf(d))).length;
  const nTalk=(sc,id)=>allRows.filter(d=>(sc==="brand"||d.waveId===id)&&isOpen(phaseOf(d))&&inConversation(d)).length;
  const items=[{sc:"brand",id:b.id,name:b.name||"This brand",cur:b.status||"Active",sub:"Whole brand — every campaign below"}].concat(wavesForBrand(brandId).map(w=>({sc:"campaign",id:w.id,name:w.name||"Campaign",cur:w.status||"Active",sub:FLOW_NAME[waveFlow(w)]+" campaign"})));
  items.forEach(it=>{ it.n=nOpen(it.sc,it.id); it.pre=(focus&&focus.sc===it.sc&&focus.id===it.id&&it.cur==="Active")?"Paused":it.cur; });
  const opts=(it)=>{ const l=["Active","Paused","Cancelled"]; if(l.indexOf(it.cur)<0) l.unshift(it.cur); return l.map(s=>'<option'+(s===it.pre?" selected":"")+'>'+esc(s)+'</option>').join(""); };
  const row=(it,i)=>'<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)"><div style="flex:1 1 auto;min-width:0"><div style="font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)">'+(it.sc==="brand"?"🏢 ":"")+esc(it.name)+'</div><div style="font-size:11px;color:var(--fg-faint)">'+esc(it.sub)+" · "+it.n+" open row"+(it.n===1?"":"s")+'</div></div><select data-hp="'+i+'" style="width:140px;flex:none;min-width:0">'+opts(it)+'</select></div>';
  openModal('<div class="mhead"><div><h3>Pause or resume — '+esc(b.name||"brand")+'</h3><div class="ikstep">Pick a status for the whole brand or for any one campaign</div></div><button class="iconbtn" id="mClose">&times;</button></div><div class="mbody">'
   +items.map(row).join("")
   +'<div class="field" style="margin-top:12px"><label>Reason (private note, optional)</label><input type="text" id="hNote" placeholder="e.g. client budget freeze until January"></div>'
   +'<div class="al info"><span class="t"><b>Paused</b>: nudges, follow-up alerts and “ready to send” stop for that brand or campaign; nothing is changed or deleted, and resuming restarts the timers from that day. <b>Cancelled</b>: the same, and the polite note says it is not going ahead for now. Pausing the whole brand holds all its campaigns; pausing one campaign leaves the others running. Nothing is sent for you.</span></div></div>'
   +'<div class="mfoot"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="hpSave">Save</button></div>'); wireClose();
  document.getElementById("hpSave").addEventListener("click",()=>{
    const note=((document.getElementById("hNote")||{}).value||"").trim();
    const changed=[]; document.querySelectorAll("[data-hp]").forEach(sel=>{ const it=items[+sel.dataset.hp]; if(sel.value!==it.cur) changed.push(Object.assign({},it,{st:sel.value})); });
    closeModal();
    if(!changed.length){ toast("No change — pick Paused or Cancelled on the brand or a campaign to put it on hold"); return; }
    changed.forEach(it=>{ const p={status:it.st,statusNote:it.st==="Active"?"":note,statusAt:todayISO()}; if(it.st==="Active"&&HOLD_STATUSES.includes(it.cur)) p.resumedAt=todayISO(); patchDoc(it.sc==="brand"?"brands":"waves",it.id,p); });
    stallCache.clear(); if(typeof alertCache!=="undefined") alertCache.clear();
    toast(changed.map(it=>it.name+": "+it.st.toLowerCase()).join(" · ").slice(0,170)+" — "+(changed.some(it=>HOLD_STATUSES.includes(it.st))?"nudges and follow-up alerts are off for held items":"follow-up timers restart from today"));
    render();
    const held=changed.filter(it=>HOLD_STATUSES.includes(it.st)&&nTalk(it.sc,it.id)>0); if(held.length) setTimeout(()=>openHoldNotes(held[0].sc,held[0].id),250);
  });
}
function openHoldModal(sc,id){
  const o=holdTarget(sc,id); if(!o) return; const cur=o.status||"Active"; const word=sc==="brand"?"brand":"campaign"; const pre=cur==="Active"?"Paused":cur; /* opened from the Pause button: start on Paused so one click on Save pauses it */
  const rows=(ix().byBrand.get(sc==="brand"?id:o.brandId)||[]).filter(d=>(sc==="brand"||d.waveId===id)&&isOpen(phaseOf(d)));
  const talk=rows.filter(inConversation).length;
  openModal('<div class="mhead"><div><h3>'+(cur==="Active"?"Pause or cancel":"Status")+' — '+esc(o.name)+'</h3><div class="ikstep">'+rows.length+' open row'+(rows.length===1?"":"s")+' · '+talk+' in conversation</div></div><button class="iconbtn" id="mClose">&times;</button></div><div class="mbody">'
   +'<div class="field"><label>This '+word+' is</label><select id="hSt">'+["Active","Paused","Cancelled"].map(s=>'<option'+(s===pre?" selected":"")+'>'+s+'</option>').join("")+'</select></div>'
   +'<div class="field"><label>Reason (private note)</label><input type="text" id="hNote" value="'+esc(o.statusNote||"")+'" placeholder="e.g. client budget freeze until January"></div>'
   +'<div class="al info"><span class="t"><b>Paused</b>: nudges, follow-up alerts and “ready to send” stop; nothing is changed or deleted, and resuming restarts the timers from that day. <b>Cancelled</b>: the same, and the polite note says it is not going ahead for now. Either way you are offered polite notes for open conversations so you can end well and keep the relationship for other projects. Nothing is sent for you.</span></div></div>'
   +'<div class="mfoot"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="hSave">Save</button></div>'); wireClose();
  document.getElementById("hSave").addEventListener("click",()=>{ const st=document.getElementById("hSt").value; const nt=(document.getElementById("hNote")||{}).value||""; closeModal(); if(st===cur&&nt===(o.statusNote||"")){ toast((o.name||"It")+" is already "+cur.toLowerCase()+" — pick Paused or Cancelled to put it on hold"); return; } setHold(sc,id,st,nt.trim()); });
  try{ const hn=document.getElementById("hNote"); if(hn&&pre!==cur) hn.focus(); }catch(e){}
}
/* draft polite notes for every open conversation under a hold — review, edit, send yourself */
function openHoldNotes(sc,id){
  const o=holdTarget(sc,id); if(!o) return;
  const rows=(ix().byBrand.get(sc==="brand"?id:o.brandId)||[]).filter(d=>(sc==="brand"||d.waveId===id)&&isOpen(phaseOf(d))&&inConversation(d));
  const todo=rows.filter(d=>!hasDraft(d)), keep=rows.length-todo.length; const key=o.status==="Paused"?"X1":"X2";
  openModal('<div class="mhead"><div><h3>Polite notes — '+esc(o.name)+'</h3><div class="ikstep">'+esc(o.status)+' · '+rows.length+' open conversation'+(rows.length===1?"":"s")+'</div></div><button class="iconbtn" id="mClose">&times;</button></div><div class="mbody">'
   +'<p style="font-size:13px;line-height:1.6;margin:0 0 10px">These people have replied to us. Going quiet on them wastes goodwill we want for other brands and campaigns, so each gets a short, courteous note that says where things stand and keeps the door open. They are saved as <b>drafts only</b>.</p>'
   +'<div class="al info"><span class="t"><b>Template:</b> '+esc(TPL[key].label)+'</span></div><pre class="tplprev" style="white-space:pre-wrap;font-size:12px;margin:8px 0;padding:8px;border:1px solid var(--border);border-radius:8px">'+esc(TPL[key].body)+'</pre>'
   +'<div class="mini">'+todo.length+' draft'+(todo.length===1?"":"s")+' will be written'+(keep?' · '+keep+' row'+(keep===1?"":"s")+' already have a draft and are left alone':"")+'. Pick the right wording per person in the row’s Message menu (there are also “not the right fit” and “closing politely” options).</div></div>'
   +'<div class="mfoot"><button class="btn" id="mCancel">Not now</button><button class="btn primary" id="hGo"'+(todo.length?"":" disabled")+'>Write '+todo.length+' draft'+(todo.length===1?"":"s")+'</button></div>'); wireClose();
  document.getElementById("hGo").addEventListener("click",()=>{ closeModal(); let n=0; todo.forEach(d=>{ const m=mergeTpl(d,key); patchDeal(d.id,{subject:m.subject,draft:m.body,draftKind:"reply",draftState:"",holdNote:todayISO()}); n++; }); stallCache.clear(); toast(n+" polite draft"+(n===1?"":"s")+" ready — review each, then send it yourself"); state.wb.view="replies"; saveWb(); render(); });
}
/* pane alert text + one-click insert */
function holdAlert(d){ const h=holdOf(d); if(!h||!isOpen(phaseOf(d))) return null;
  return inConversation(d)?{text:h.name+" is "+h.kind.toLowerCase()+". Don't leave them hanging — send a short, polite note that keeps the door open for other work.",btn:true}
    :{text:h.name+" is "+h.kind.toLowerCase()+" — don't send new outreach on this row until it resumes.",btn:false}; }
function insertHoldNote(d,key,force){
  const m=mergeTpl(d,key); if(hasDraft(d)&&!force) return false;
  patchDeal(d.id,{subject:m.subject,draft:m.body,draftKind:"reply",draftState:"",holdNote:todayISO()}); afterRowChange(d.id); return true; }


boot();
</script>

<script>

(function () {

  var STEPS = [

  ];
  function seen() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
