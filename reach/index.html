<style>
/* layout: left brand/nav rail · sticky section header · scrolling data work area.
   Two deal-flow pipelines per brand — Coverage (creator/media) and Leads & Introductions (client/partner/user biz-dev) — are first-class and colour-separated. */
:root{
  --bg:#f3f0e7; --surface:#fffdf8; --surface-2:#f0ece1; --surface-3:#e6e1d3;
  --border:#ddd6c5; --fg:#1c2018; --fg-dim:#4f564a; --fg-faint:#666d5e;
  --accent:#b0720f; --accent-fg:#fffaf0; --accent-soft:#f3e5c4;
  --cov:#b0720f; --cov-soft:#f3e5c4;           /* coverage = amber */
  --lead:#2f6ea8; --lead-soft:#dfe9f2;          /* leads/intros = blue */
  --good:#2f8a52; --good-soft:#e1f0e5; --warn:#b4790a; --warn-soft:#f6e7cc;
  --bad:#b23a28; --bad-soft:#f6e0db; --info:#2f6ea8; --info-soft:#dfe9f2; --purple:#7e4fc9; --purple-soft:#e9ddf6;
  --font-display:'Fraunces',Georgia,serif; --font-body:'IBM Plex Sans',-apple-system,system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(35,31,26,.06), 0 8px 24px -12px rgba(35,31,26,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12160f; --surface:#181d15; --surface-2:#1f251b; --surface-3:#262d21;
    --border:#2c3428; --fg:#ece6d6; --fg-dim:#b9bcaa; --fg-faint:#949d8d;
    --accent:#e8a33d; --accent-fg:#241a06; --accent-soft:#2e2a14;
    --cov:#e8a33d; --cov-soft:#2e2a14; --lead:#6aa7e8; --lead-soft:#1a2a3a;
    --good:#3aa880; --good-soft:#173328; --warn:#e8a33d; --warn-soft:#2e2a14;
    --bad:#e06a52; --bad-soft:#38211b; --info:#6aa7e8; --info-soft:#1a2a3a; --purple:#c6a8ef; --purple-soft:#2e2140;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12160f; --surface:#181d15; --surface-2:#1f251b; --surface-3:#262d21;
  --border:#2c3428; --fg:#ece6d6; --fg-dim:#b9bcaa; --fg-faint:#949d8d;
  --accent:#e8a33d; --accent-fg:#241a06; --accent-soft:#2e2a14;
  --cov:#e8a33d; --cov-soft:#2e2a14; --lead:#6aa7e8; --lead-soft:#1a2a3a;
  --good:#3aa880; --good-soft:#173328; --warn:#e8a33d; --warn-soft:#2e2a14;
  --bad:#e06a52; --bad-soft:#38211b; --info:#6aa7e8; --info-soft:#1a2a3a; --purple:#c6a8ef; --purple-soft:#2e2140;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:var(--font-display);font-weight:600;text-wrap:balance}
.mono{font-family:var(--font-mono)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}
#app{display:flex;height:100%;min-height:100vh}

#sidebar{width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0) max(14px,env(safe-area-inset-left,0px))}
#sidebar .brand-mark{display:flex;align-items:center;gap:9px;padding:16px 12px 10px}
#sidebar .brand-mark .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
#sidebar .brand-mark .name{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.01em}
#sidebar .brand-mark .sub{font-size:10px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.08em;margin-left:auto}
#brandList{list-style:none;margin:4px 0 10px;padding:0 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;max-height:230px}
.brand-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;min-width:0}
.brand-item:hover{background:var(--surface-2)}
.brand-item.active{background:var(--accent-soft);border-color:var(--accent)}
.brand-item .swatch{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.brand-item .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;min-width:0}
.brand-item .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--fg-faint);flex:0 0 auto}
#addBrandBtn{margin:0 12px 12px;padding:7px 10px;border-radius:8px;border:1px dashed var(--border);background:transparent;color:var(--fg-dim);font-size:12.5px;cursor:pointer;text-align:left}
#addBrandBtn:hover{border-color:var(--accent);color:var(--accent)}
.navwrap{overflow-y:auto;flex:1}
.side-nav{list-style:none;margin:0;padding:8px 8px 4px;display:flex;flex-direction:column;gap:2px}
.side-nav.top{border-top:1px solid var(--border)}
.navgroup{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;padding:10px 12px 4px;display:flex;align-items:center;gap:6px}
.navgroup .gd{width:7px;height:7px;border-radius:50%}
.navgroup.cov{color:var(--cov)} .navgroup.cov .gd{background:var(--cov)}
.navgroup.lead{color:var(--lead)} .navgroup.lead .gd{background:var(--lead)}
.side-nav li{padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--fg-dim);font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.side-nav li:hover{background:var(--surface-2);color:var(--fg)}
.side-nav li.active{background:var(--surface-3);color:var(--fg)}
.side-nav li .badge{font-family:var(--font-mono);font-size:10.5px;background:var(--bad-soft);color:var(--bad);border-radius:20px;padding:1px 6px}
.side-nav li .ct{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint)}
#sidebar .foot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px}
.footrow{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left}
.footrow:hover{border-color:var(--accent)}
.footrow .wsdot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.footrow .wslabel{font-size:12px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.footrow .wsplan{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:1px 7px;flex:0 0 auto}
#themeToggle{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:11px;color:var(--fg-dim);cursor:pointer}

#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--border);padding:14px max(20px,env(safe-area-inset-right,0px)) 12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#topbar h1{font-size:19px;margin:0}
#topbar .crumb{color:var(--fg-faint);font-size:12px}
.flowtag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:20px}
.flowtag.cov{background:var(--cov-soft);color:var(--cov)}
.flowtag.lead{background:var(--lead-soft);color:var(--lead)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--fg-faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary.lead{background:var(--lead);border-color:var(--lead);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:4px 9px;font-size:11.5px}
.btn.danger{color:var(--bad)}
#view{flex:1;overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 50px 20px}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.stat.accent-cov{border-left:3px solid var(--cov)} .stat.accent-lead{border-left:3px solid var(--lead)}
.stat .n{font-family:var(--font-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

.quota-bar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:18px}
.quota-bar-wrap .qtop{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-dim);margin-bottom:6px}
.quota-bar-wrap .qtrack{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.quota-bar-wrap .qfill{height:100%;background:var(--cov);border-radius:5px}
.quota-bar-wrap .qfill.over{background:var(--bad)}

.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-dim);font-weight:700;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}
.section-title .dot{width:8px;height:8px;border-radius:50%}
.section-title.cov .dot{background:var(--cov)} .section-title.lead .dot{background:var(--lead)}

.profilecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.profilecard .what{font-size:13px;margin-bottom:8px}
.profilecard .bits{font-size:11.5px;color:var(--fg-dim);display:flex;gap:10px;flex-wrap:wrap}

.wave-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.wave-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.wave-card:hover{border-color:var(--accent)}
.wave-card.cov{border-top:3px solid var(--cov)} .wave-card.lead{border-top:3px solid var(--lead)}
.wave-card .wtitle{font-weight:700;font-size:14px}
.wave-card .wmeta{font-size:11.5px;color:var(--fg-faint)}
.progress{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;display:flex}
.progress span{height:100%}
.wave-card .wfoot{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-dim);font-family:var(--font-mono)}
.wave-card .legacy{font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:4px 8px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.p-neutral{background:var(--surface-3);color:var(--fg-dim)}
.pill.p-info{background:var(--info-soft);color:var(--info)}
.pill.p-warn{background:var(--warn-soft);color:var(--warn)}
.pill.p-purple{background:var(--purple-soft);color:var(--purple)}
.pill.p-good{background:var(--good-soft);color:var(--good)}
.pill.p-bad{background:var(--bad-soft);color:var(--bad)}
.pill.p-cov{background:var(--cov-soft);color:var(--cov)}
.pill.p-lead{background:var(--lead-soft);color:var(--lead)}

table{width:100%;border-collapse:collapse;font-size:12.8px}
.tablewrap{border:1px solid var(--border);border-radius:var(--radius);overflow:auto;background:var(--surface)}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-faint);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.ellipsis{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copybtn{border:1px solid var(--border);background:var(--surface-2);border-radius:5px;font-size:10.5px;padding:1px 6px;cursor:pointer;color:var(--fg-dim)}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font-size:12.5px}
.toolbar input[type=search]{min-width:200px}
.check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-dim)}

.empty{border:1px dashed var(--border);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--fg-dim)}
.empty .big{font-family:var(--font-display);font-size:17px;color:var(--fg);margin-bottom:4px}
.empty .btn{margin-top:14px}

#overlay{position:fixed;inset:0;background:rgba(10,8,5,.4);z-index:20;display:none}
#overlay.show{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--surface);border-left:1px solid var(--border);z-index:21;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#drawer.show{transform:translateX(0)}
#drawer .dhead{padding:16px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
#drawer .dhead.cov{border-top:3px solid var(--cov)} #drawer .dhead.lead{border-top:3px solid var(--lead)}
#drawer .dhead .ti{flex:1;min-width:0}
#drawer .dhead h2{font-size:17px;margin:0 0 3px}
#drawer .dhead .sub{font-size:12px;color:var(--fg-dim)}
#drawer .dbody{flex:1;overflow-y:auto;padding:16px 20px 30px}
#drawer .field{margin-bottom:14px}
#drawer label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-faint);font-weight:700;margin-bottom:5px}
#drawer input[type=text],#drawer input[type=date],#drawer input[type=number],#drawer select,#drawer textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--fg);font-size:13px}
#drawer textarea{resize:vertical;min-height:70px;font-family:var(--font-body)}
#drawer .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#drawer .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
#drawer .contactbox{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
#drawer .contactbox .crow{display:flex;justify-content:space-between;align-items:center;gap:8px}
#drawer .subsection{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-faint);font-weight:700;margin:20px 0 10px;border-top:1px solid var(--border);padding-top:14px}
#drawer .subsection:first-of-type{border-top:none;padding-top:0;margin-top:4px}
.timeline{display:flex;flex-direction:column;gap:10px}
.timeline .tl-item{border-left:2px solid var(--border);padding-left:12px;position:relative}
.timeline .tl-item::before{content:"";position:absolute;left:-5px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timeline .tl-date{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-faint)}
.timeline .tl-body{font-size:12.5px;margin-top:2px}
.rate-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border)}
.rate-row:last-child{border-bottom:none}
.checkline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-dim)}

#modalOverlay{position:fixed;inset:0;background:rgba(10,8,5,.45);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#modalOverlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:460px;width:100%;box-shadow:var(--shadow);max-height:86vh;display:flex;flex-direction:column}
.modal.wide{max-width:640px}
.modal .mhead{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal .mhead h3{margin:0;font-size:15px}
.modal .mbody{padding:16px 18px;overflow-y:auto}
.modal .mfoot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.modal .field{margin-bottom:12px}
.modal label{display:block;font-size:11px;color:var(--fg-dim);margin-bottom:5px;font-weight:600}
.modal input,.modal select,.modal textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--fg);font-size:13px}
.modal textarea{min-height:64px;resize:vertical}
.modal textarea.importbox{min-height:140px;font-family:var(--font-mono);font-size:11.5px}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .hint{font-size:11px;color:var(--fg-faint);margin-top:4px;line-height:1.5}
.modal .colref{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-dim);margin-bottom:10px;line-height:1.6;word-break:break-word}
.importresult{font-size:12px;padding:8px 10px;border-radius:8px;margin-top:10px}
.importresult.ok{background:var(--good-soft);color:var(--good)}
.importresult.warn{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--fg-dim)}
.seg button.on{background:var(--surface-3);color:var(--fg)}
.iconbtn{background:none;border:none;color:var(--fg-faint);cursor:pointer;font-size:16px;line-height:1;padding:4px}
.iconbtn:hover{color:var(--fg)}

.dnideas{display:flex;flex-wrap:wrap;gap:6px}.dnadd{display:flex;gap:8px;align-items:center;margin-top:8px}.dnboxes[hidden]{display:none}.dnboxes{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:10px;border:1px solid var(--border);border-radius:var(--radius)}.dnchk{display:flex;align-items:center;gap:8px;font-size:13px}.dnlist{margin-top:14px;display:flex;flex-direction:column;gap:10px}.dnrow{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:var(--radius)}.dnrow.off{opacity:.55}.dnmain{flex:1;min-width:0}.dntxt{width:100%;resize:vertical}

  /* filters: search on its own line, then one scrolling strip */

  .wbfilters::-webkit-scrollbar{display:none}
  .wbfilters>*{flex:none}
  .wbfilters input[type=search]{order:-2;position:sticky;left:0;width:min(64vw,250px);min-height:44px;padding:10px 12px}

  .wbfilters .sp{display:none}
  .wbfilters .cnt{padding:0 6px}
  .wbmore{flex-wrap:wrap}.wbmore select,.wbmore .check{min-height:44px}
  /* rows become cards */

  table.wbt{display:block;min-width:0;width:100%}
  .wbt thead{display:none}
  .wbt tbody{display:block}
  .wbt tbody tr{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;grid-template-areas:"chk target al pri" "chk status status act" "chk contact contact contact";gap:6px 8px;align-items:center;padding:12px 12px 12px 4px;border-bottom:1px solid var(--border);background:var(--surface)}
  .wbt tbody tr.active{background:var(--accent-soft)}
  .wbt tbody tr.cov{box-shadow:inset 3px 0 0 var(--cov)}
  .wbt tbody tr.lead{box-shadow:inset 3px 0 0 var(--lead)}
  .wbt tbody tr{height:auto!important;grid-template-rows:auto auto auto}
  .wbt .c-target .ts{overflow:visible;text-overflow:clip}
  .wbt td{height:auto!important;display:block;padding:0!important;border:0!important;min-width:0!important;width:auto!important;max-width:none!important;position:static!important;background:transparent!important;box-shadow:none!important}
  .wbt td.c-chk{grid-area:chk;display:flex;align-items:center;justify-content:center;align-self:stretch}
  .wbt td.c-chk input{width:22px;height:22px}
  .wbt td.c-target{grid-area:target}
  .wbt td.c-al{grid-area:al}
  .wbt td.c-pri{grid-area:pri}
  .wbt td.c-status{grid-area:status}
  .wbt td.c-act{grid-area:act;justify-self:end}
  .wbt td.c-contact{grid-area:contact;display:flex!important;align-items:center;gap:6px;flex-wrap:wrap}
  .wbt td.c-contact:empty,.wbt td.c-contact .reach:empty{display:none!important}
  .msort{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;align-items:center}
  .msort::-webkit-scrollbar{display:none}
  .msort .msl{font:600 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);flex:none}
  .sortchip{flex:none;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--fg-dim);font-size:13px;white-space:nowrap}
  .sortchip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
  .wbt .reach .abtn.vw{min-width:0;min-height:34px;padding:6px 12px;font-size:13px}
  .wbt td.c-camp,.wbt td.c-msg,.wbt td.c-next,.wbt td.c-fu,.wbt td.c-rate,.wbt td.c-sent,.wbt td.c-touch{display:none!important}
  .wbt .c-target .tn{font-size:15px;white-space:normal}
  .wbt .c-target .ts{white-space:normal;font-size:12.5px}
  .wbt .why{white-space:normal;font-size:12px}
  .wbt .stsel{font-size:13px!important;min-height:40px;padding:8px 28px 8px 14px;max-width:100%}
  .wbt .abtn{min-height:40px;min-width:84px;font-size:13.5px;padding:8px 14px;border-radius:9px}
  .wbt .adot{min-width:26px;height:26px;line-height:26px}
  .wbt .pri{min-width:40px;height:34px;line-height:34px;font-size:14px}
  /* deal panel: message and send first, details after */
  .pb>*{order:5}
  .pb>.al{order:0}
  .pb>.psec:has(>.alist){order:0}
  .pb>#pSent{order:1}

  .sendbar .sbrow{flex-wrap:wrap}

  .ph .stsel{min-height:40px}
  .fldrow .fv .btn{min-height:40px}
  .bulkbar{padding:10px 12px;gap:8px}
  .bulkbar select,.bulkbar input[type=date]{min-height:40px;font-size:16px;padding:6px 10px}
  .bulkbar .btn{font-size:13px}
}

/* ---- table sorting helpers ---- */
function cmpVal(a,b){ a=(a==null?"":a); b=(b==null?"":b); const ba=(a===""),bb=(b==="");
  if(ba&&bb) return 0; if(ba) return 1; if(bb) return -1;
  if(typeof a==="number"&&typeof b==="number") return a-b;
  const na=parseFloat(String(a).replace(/[^0-9.\-]/g,"")), nb=parseFloat(String(b).replace(/[^0-9.\-]/g,""));
  if(/\d/.test(String(a))&&/\d/.test(String(b))&&!isNaN(na)&&!isNaN(nb)&&!/[a-z]{3}/i.test(String(a)+String(b))){ if(na!==nb) return na-nb; }
  return String(a).toLowerCase().localeCompare(String(b).toLowerCase()); }
function sortRows(rows,acc,dir){ const r=rows.map(x=>[acc(x),x]); r.sort((p,q)=>cmpVal(p[0],q[0])); const out=r.map(p=>p[1]); if(dir==="desc") out.reverse(); return out; }
function toggleSort(s,col){ if(s.col===col) s.dir=s.dir==="asc"?"desc":"asc"; else {s.col=col;s.dir=(col==="pri"?"desc":"asc");} }
function sortTh(s,col,label,cls){ const on=s.col===col; return '<th class="sortable'+(cls?" "+cls:"")+'" data-sc="'+col+'">'+esc(label)+(on?' <span class="scar">'+(s.dir==="asc"?"▲":"▼")+'</span>':'')+'</th>'; }
function dnum(v){ if(!v) return ""; const t=Date.parse(v); return isNaN(t)?v:t; }
function priceNum(v){ if(!v) return ""; const n=parseFloat(String(v).replace(/[^0-9.]/g,"")); return isNaN(n)?v:n; }

function renderWaveCards(brand,type){

  const cards='<div class="wave-grid">'+waves.map(w=>{
    const wd=dealsForWave(w.id); const total=wd.length||1;
    const segs = type==="lead" ? [
      [wd.filter(d=>["New","Researching","Ready to Reach Out"].includes(d.dealStage)).length,"var(--fg-faint)"],
      [cnt(wd,"dealStage","Contacted"),"var(--warn)"],
      [wd.filter(d=>["In Conversation","Intro / Proposal Sent","Negotiating"].includes(d.dealStage)).length,"var(--purple)"],
      [cnt(wd,"dealStage","Won - Client"),"var(--good)"],
      [cnt(wd,"dealStage","Lost"),"var(--bad)"]
    ] : [
      [cnt(wd,"outreachStatus","Needs Research"),"var(--fg-faint)"],

      [cnt(wd,"outreachStatus","Sent - Awaiting Reply"),"var(--warn)"],
      [cnt(wd,"outreachStatus","Replied / In Discussion"),"var(--purple)"],
      [cnt(wd,"dealStage","Closed - Won"),"var(--good)"],

    ];

  }).join("")+'</div>';
  return cards+'<div style="margin:10px 0 4px"><button class="btn small '+(type==="lead"?"primary lead":"primary")+'" data-newwave="'+type+'">+ New '+label+'</button></div>';

/* ---- Add a brand: a name and, if there is one, a website -----------------
   2026-10-29. This was a six-step wizard. Its last step saved through a path that
   never showed the new brand until the next sync (so it looked unsaved), and a new
   workspace's empty "My brand" placeholder used up the free plan's only slot, so a
   real brand was refused. Now: name + website, saved at once (the placeholder is
   reused), then the site is read and the brief filled in. Everything else is
   edited later from the brand page. */
function isPlaceholderBrand(b){ return !!b && /^my brand$/i.test(String(b.name||"").trim()) && !String(b.officialSite||"").trim() && !String(b.whatItIs||"").trim() && !String(b.mission||"").trim(); }
function siteUrl(v){ v=String(v||"").trim(); if(!v) return ""; if(!/^https?:\/\//i.test(v)) v="https://"+v; try{ const u=new URL(v); return u.hostname.indexOf(".")>0?u.toString().replace(/\/$/,""):""; }catch(e){ return ""; } }
function nameFromSite(u){ try{ return new URL(u).hostname.replace(/^www\./,"").split(".")[0].split(/[-_]+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" "); }catch(e){ return ""; } }
function brandSaveError(e){ const m=String((e&&(e.message||e.code))||""); if(/row-level security|42501|violates/i.test(m)) return "Your plan’s brand limit is reached. Archive a brand you don’t use, or upgrade your plan."; return "Couldn’t save: "+(m||"unknown error"); }

async function saveIntakeBrand(){
  const d=state.intake.data, T=v=>String(v||"").trim();
  const base={ name:T(d.name), usesCoverage:d.pipeline!=="lead", usesLeads:d.pipeline!=="coverage", officialSite:T(d.officialSite), whatItIs:T(d.whatItIs), mission:T(d.mission), targetAudience:T(d.targetAudience), brandTone:T(d.brandTone), proofPoints:T(d.proofPoints), keyMessages:T(d.keyMessages), blockWords:T(d.blockWords), campaignStatus:"Not started" };
  if(!base.name) throw new Error("Give the brand a name first");
  const ph=state.brands.find(isPlaceholderBrand);
  let id;
  if(ph){ id=ph.id; Object.assign(ph,base); markDirty(); noteLocal("brands",id); await D("brands/"+id).update(base); }
  else {
    id=uid("brand"); const rec=Object.assign({ color:BRAND_COLORS[state.brands.length%BRAND_COLORS.length], createdAt:Date.now() },base);
    state.brands.push(Object.assign({id},rec)); markDirty(); noteLocal("brands",id);
    try{ await D("brands/"+id).set(rec); }catch(e){ state.brands=state.brands.filter(x=>x.id!==id); throw e; }
  }
  const ccId=state.intake&&state.intake.ccBrandId;
  if(ccId){ try{ const R=await reachApi(); if(R&&R.bridge) await R.bridge("link",{legacyId:id,ccBrandId:ccId}); }catch(e){} }
  return id;
}

function importBox(title,flow,cols,hint){ return '<div class="mhead"><h3>'+title+'</h3><button class="iconbtn" id="mClose">&times;</button></div><div class="mbody"><div class="hint">Paste tab-separated rows (no header) in this column order — leave any you don\'t have blank:</div><div class="colref">'+cols.map((c,i)=>(i+1)+". "+c).join(" · ")+'</div><textarea id="mPaste" class="importbox" placeholder="Paste rows here…"></textarea>'+(hint?'<div class="hint">'+hint+'</div>':'')+'<div id="impOut"></div></div><div class="mfoot"><button class="btn" id="mCancel">Close</button><button class="btn primary" id="mSave">Import</button></div>'; }

/* =====================================================================
   ALERTS — the advice layer. Every rule is explicit and dismissable per row.
   ===================================================================== */
const RECENT_DAYS=7, FU1_DAYS=4, FU2_DAYS=10, NOREPLY_DAYS=21;
const AGENCY_DOMAINS=["pbnj.gg","keycreators.com","ace-creators.com","sidequestmedia.com"];
const LVL_RANK={bad:0,warn:1,info:2,good:3};
function rampLimit(){ return Number(wsMeta().rampPerDay)||10; }
function suggestText(s){ const ev=s.evidence?(" — “"+String(s.evidence).slice(0,90)+"”"):"";
  if(s.type==="sent") return "Your mail to them is in Gmail"+(s.date?" (sent "+fmtShort(s.date)+")":"")+ev+". Confirm to mark it sent.";
  if(s.type==="replied") return "They replied"+(s.date?" on "+fmtShort(s.date):"")+ev+". Read it and answer before you send anything else to them.";
  if(s.type==="bounced") return "The Alchemist found a bounce"+(s.date?" on "+fmtShort(s.date):"")+ev+". Mark as bounced?";
  if(s.type==="noreply_close") return "The Alchemist suggests closing this out: "+(s.evidence||"no reply after follow-ups")+".";
  return "Agent suggestion: "+(s.evidence||s.type); }
function alertsFor(d){
  const I=ix(); if(alertCache.has(d.id)) return alertCache.get(d.id);
  const out=[]; const add=(code,lvl,text,short)=>out.push({code,lvl,text,short:short||text});
  const t=I.today, ph=phaseOf(d), tg=targetForDeal(d), brand=I.brand.get(d.brandId)||{}, name=nameOf(d), open=isOpen(ph), lead=isLead(d);
  const key=targetKey(d), em=emailOf(d).toLowerCase(), dom=(em.split("@")[1]||"");
  const sameT=(I.byTarget.get(key)||[]).filter(x=>x.id!==d.id);
  const sameE=em?(I.byEmail.get(em)||[]).filter(x=>x.id!==d.id&&targetKey(x)!==key):[];
  const others=sameT.concat(sameE);
  const bn=(x)=>((I.brand.get(x.brandId)||{}).name||"another brand");
  const when=(n)=>n===0?"today":n===1?"yesterday":n+" days ago";
  { const ha=holdAlert(d); if(ha) add("hold","warn",ha.text,"On hold"); }
  gateAlerts(d).forEach(a=>add(a.code,a.lvl,a.text,a.short));
  if(tg&&tg.orderVia&&open) add("deck","info","This is a UPM deck option — the price is already known. If the client orders it, it is settled in the agency Telegram chat; no rate-card email is needed.","Deck option");
  /* recent-contact guard */
  if(open&&(ph==="research"||ph==="ready")){
    const hist=others.slice(); if(d.sentDate||d.lastSentDate) hist.push(d);
    const seen=new Set();
    hist.forEach(x=>{ const ds=x.lastSentDate||x.sentDate; if(!ds) return; const n=daysAgo(ds); if(n==null||n<0) return;
      const who=x.id===d.id?"on this row":(x.brandId===d.brandId?"in this brand":"for "+bn(x));
      if(n<=RECENT_DAYS && !seen.has("w")){ seen.add("w"); add("recent:"+x.id,"warn","You already messaged "+name+" "+who+" "+when(n)+" ("+fmtShort(ds)+"). Give them time to reply before another message — or fold this into the same thread.","Contacted "+n+"d ago"); }
      else if(n<=30 && !seen.has("i")){ seen.add("i"); add("recent:"+x.id,"info","Contacted "+who+" "+n+" days ago — check whether they replied before reaching out again.","Contacted "+n+"d ago"); } });
  }
  /* history with this target / inbox */
  let shown=0;
  others.forEach(x=>{ if(shown>=4) return;
    const lr=latestRate(x);
    if(x.dealStage==="Closed - Won"||x.dealStage==="Won - Client"){ add("won:"+x.id,"good","You've closed a deal with them before ("+bn(x)+(x.agreedPrice?", "+x.agreedPrice:"")+").","Past deal"); shown++; }
    else if(x.outreachStatus==="Declined"){ add("decl:"+x.id,"warn","They declined "+bn(x)+(x.repliedDate?" on "+fmtShort(x.repliedDate):"")+" — check why before pitching.","Declined before"); shown++; }
    else if(x.outreachStatus==="Bounced"&&sameT.includes(x)){ add("bounce:"+x.id,"warn","An earlier email to them bounced ("+bn(x)+"). Verify the address.","Bounced before"); shown++; }
    else if(x.repliedDate){ add("repl:"+x.id,"info","They replied to "+bn(x)+" on "+fmtShort(x.repliedDate)+" — a warm contact.","Replied before"); shown++; }
    if(lr&&open&&(ph==="research"||ph==="ready"||ph==="replied"||ph==="deal")){ add("rate:"+x.id,"info","Last quote on file: "+lr.amount+" ("+bn(x)+", "+fmtShort(lr.quotedDate)+") — a useful anchor.","Prior quote "+lr.amount); shown++; } });
  /* safety */
  const dncTxt=((brand.doNotContact||"")+"").toLowerCase();
  if(open&&dncTxt&&((name.length>2&&dncTxt.includes(name.toLowerCase()))||(dom&&dncTxt.includes(dom.toLowerCase())))) add("dnc","bad","Matches this brand's do-not-contact list.","Do-not-contact");
  if(open&&(ph==="research"||ph==="ready")&&hasDraft(d)&&!d.sentDate){ const wv=waveOf(d); if(wv&&(wv.message||"").trim()){ const age=wv.messageAt?Math.floor((Date.now()-wv.messageAt)/86400000):null; if(age===null) add("stale0","info","This campaign's status message has no date — refresh it from the latest news before sending.","Status undated"); else if(age>=7) add("stale","warn","The campaign status behind this draft is "+age+" days old — refresh it, then redraft, so it isn't old news.","Status "+age+"d old"); } }

     ?"Hi {{First}},\n\nI haven't heard back on {{Subj}}, so I'm closing this out on my side for now. If the timing changes, reply here and I'll pick it up, and I'd like to keep in touch for other projects.\n\nThanks,\n{{Sender}}"

   +'<div class="nr-row"><span>Min days between messages to the same person</span><input type="number" id="nrGap" min="0" max="30" value="'+gapDays()+'"><span class="mini">across all brands (0 = off)</span></div>'
   +'<div class="nr-row"><span>Auto-send</span><span class="pill p-neutral">Standalone app</span><span class="mini">Not possible inside Claude: nothing is sent without your click.</span></div>'
   +'</div>'+foot("Save"),true);

    document.querySelectorAll("[data-cc]").forEach(i=>{ const b=brandById(i.dataset.cc); if(b&&(b.clientContact||"")!==i.value.trim()) patchDoc("brands",b.id,{clientContact:i.value.trim()}); });

/* =====================================================================
   CLIENT VIEW — the same top bar and the same brand, scoped to ONE brand, where a client
   reviews drafts / options / deals and approves, declines or suggests changes.
   Agencies see exactly this via "Client view" (preview). Clients cannot read internal data at all
   (db rules: admin-only); they read only share/* and feedback/*.
   ===================================================================== */
const CLIENT={brandId:"",preview:false,previewBrand:"",myId:"",myName:"",canWrite:true,tab:"review"};
function clientMode(){ return !!(CLIENT.brandId||CLIENT.preview); }
function clientBrandId(){ return CLIENT.brandId||(CLIENT.preview?CLIENT.previewBrand:""); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return String(h); }
function draftStamp(d){ return hashStr((d.subject||"")+"|"+(d.draft||"")); }
function fbFor(d){ return ix().fbBy.get(d.id)||[]; }
const ASK_LABEL={draft:"Approve this message",option:"Approve this option",deal:"Decide on this deal",info:"Information needed"};
const DEC_LABEL={approve:"Approved",decline:"Declined",suggest:"Changes requested"};
const DEC_PILL={approve:"p-good",decline:"p-bad",suggest:"p-warn"};
function askOf(d){ const a=d.clientAsk; return a&&a.at?a:null; }
function decisionOf(d){ const a=askOf(d); if(!a) return null; const L=fbFor(d).filter(f=>!f.fromAgency&&(f.kind==="approve"||f.kind==="decline"||f.kind==="suggest")&&(f.createdAt||0)>=a.at); return L.length?L[L.length-1]:null; }
function clientPending(d){ const a=askOf(d); return !!a&&!a.done&&!decisionOf(d); }
function clientAnswered(d){ const a=askOf(d); return !!a&&!a.done&&!!decisionOf(d); }
function msIso(ms){ return isoOf(new Date(ms)); }
function clientStatus(d){ const ph=phaseOf(d); return ({research:"In preparation",ready:"In preparation",sent:"Contacted — awaiting reply",replied:"In discussion",deal:"In discussion",won:"Agreed",closed:"Closed",dnc:"Closed",hold:"On hold"})[ph]||"In preparation"; }
function staleAfterDecision(d,dec){ return !!(dec&&dec.stamp&&dec.stamp!==draftStamp(d)&&(askOf(d)||{}).what==="draft"); }

/* ---------- client shell ---------- */

async function findClientBrand(myId){

    try{ unsub=db.collection("share").onSnapshot((snap)=>{ const docs=(snap&&snap.docs)||[]; for(const d of docs){ const data=(d.data&&d.data())||{}; if(data.kind==="brand"&&Array.isArray(data.clientUserIds)&&data.clientUserIds.includes(myId)){ fin(data.brandId); return; } } fin(""); },()=>fin("")); }catch(e){ fin(""); }
    setTimeout(()=>fin(""),2500); }); }

/* ---------- what a client may read: a sanitized copy, written by the agency ----------
   Clients are never given the internal collections (database rules: admin only). They read only
   share/* (the brand shell, its campaigns, and the specific items sent for review) and feedback/*.
   The copy carries no contact details, notes, rates, markup or other brands. */
function waveStatsOf(w){ const dd=ix().byWave.get(w.id)||[]; let progress=0, agreed=0; dd.forEach(d=>{ const ph=phaseOf(d); if(ph==="sent"||ph==="replied"||ph==="deal") progress++; else if(ph==="won") agreed++; }); return {total:dd.length,progress,agreed}; }
function buildShare(){
  const out=new Map(), I=ix();
  state.brands.forEach(b=>{
    const ids=(Array.isArray(b.clientUserIds)?b.clientUserIds:[]).filter(Boolean), deals=I.byBrand.get(b.id)||[];
    const picked=deals.filter(d=>{ const ph=phaseOf(d); return askOf(d)||ph==="deal"||ph==="won"; });
    if(!ids.length&&!picked.some(askOf)) return;
    const waves=state.waves.filter(w=>w.brandId===b.id).map(w=>({id:w.id,name:w.name||"",pipelineType:w.pipelineType||"coverage",mode:w.mode||"",status:w.status||"",nextStep:w.nextStep||"",createdAt:w.createdAt||0,stats:waveStatsOf(w)}));
    const bd={kind:"brand",brandId:b.id,name:b.name||"",color:b.color||"",wsName:wsMeta().wsName||"",clientUserIds:ids,waves}; bd.h=hashStr(JSON.stringify(bd)); out.set("b_"+b.id,bd);
    picked.forEach(d=>{ const t=targetForDeal(d), a=askOf(d), full=a&&(a.what==="draft"||a.what==="info");
      const dd={kind:"deal",brandId:b.id,dealId:d.id,waveId:d.waveId||"",dealType:d.dealType||"coverage",targetName:nameOf(d),outreachStatus:d.outreachStatus||"",dealStage:d.dealStage||"",reviewState:d.reviewState||"",clientAsk:a||null,
        subject:full?(d.subject||""):"",draft:full?(d.draft||""):"",fitReason:a?(d.fitReason||""):"",deliverables:d.deliverables||"",clientQuote:d.clientQuote||"",publishDate:d.publishDate||"",
        target:{platform:t.platform||"",type:t.type||"",niche:t.niche||"",followers:t.followers||"",category:t.category||"",website:t.website||"",language:t.language||""}};
      dd.h=hashStr(JSON.stringify(dd)); out.set("d_"+d.id,dd); }); });
  return out; }
let shareT=0;
function scheduleShareSync(){ if(!db||!viewerIsAdmin||CLIENT.brandId||WS!==""||state.loading||!loadedCols.has("share")) return; clearTimeout(shareT); shareT=setTimeout(syncShare,1200); }
function syncShare(){
  shareT=0; if(!db||state.loading||!loadedCols.has("share")||CLIENT.brandId) return 0; const want=buildShare(), have=new Map(state.share.map(x=>[x.id,x])); let n=0;
  want.forEach((doc,id)=>{ const cur=have.get(id); if(!cur||cur.h!==doc.h){ n++; state.share=state.share.filter(x=>x.id!==id).concat([Object.assign({id},doc)]); noteLocal("share",id); D("share/"+id).set(doc).catch(dbFail); } });
  have.forEach((cur,id)=>{ if(!want.has(id)){ n++; state.share=state.share.filter(x=>x.id!==id); noteLocal("share",id); D("share/"+id).delete().catch(dbFail); } });
  return n; }
function applyShare(rows){
  const bid=CLIENT.brandId, b=rows.find(r=>r.kind==="brand"&&r.brandId===bid);
  state.brands=b?[{id:b.brandId,name:b.name,color:b.color,clientUserIds:b.clientUserIds}]:[];
  state.waves=b?(b.waves||[]).map(w=>Object.assign({},w,{brandId:bid})):[];
  state.meta=b?[{id:"workspace",wsName:b.wsName}]:[];
  state.options=[]; state.leads=[];
  state.deals=rows.filter(r=>r.kind==="deal"&&r.brandId===bid).map(r=>{ const lead=r.dealType==="lead", tid="sh_"+r.dealId, t=Object.assign({id:tid},r.target||{});
    if(lead){ t.name=r.targetName; state.leads.push(t); } else { t.channelName=r.targetName; state.options.push(t); }
    return {id:r.dealId,brandId:bid,waveId:r.waveId,dealType:r.dealType,targetName:r.targetName,optionId:lead?"":tid,leadId:lead?tid:"",outreachStatus:r.outreachStatus,dealStage:r.dealStage,reviewState:r.reviewState,clientAsk:r.clientAsk||null,subject:r.subject,draft:r.draft,fitReason:r.fitReason,deliverables:r.deliverables,clientQuote:r.clientQuote,publishDate:r.publishDate}; }); }

        +'<div class="cl-stats"><span><b>'+c(clientPending)+'</b> to review</span><span><b>'+c(d=>{ const x=decisionOf(d); return x&&x.kind==="approve"; })+'</b> approved</span><span><b>'+(st.progress||0)+'</b> in progress</span><span><b>'+(st.agreed||0)+'</b> agreed</span></div></div>'; }).join("")+'</div>':'<div class="empty">No campaigns yet.</div>');

/* 2026-10-30: Brad: "improve the SDR agent so it finds the top prospects of any list, not just what fits".
   Every row, found or imported, gets a 0-100 priority from five things we can read on the row itself:
   audience (30), fit (25), a way to reach them (25), proof and price known (10), where the deal stands (10).
   Rows that are won, lost, on hold or do-not-contact are not ranked. Nothing is sent anywhere; it only

function followersNum(v){ const m=String(v==null?"":v).toLowerCase().replace(/,/g,"").match(/([\d.]+)\s*([kmb])?/); if(!m) return null; let n=parseFloat(m[1]); if(!isFinite(n)) return null; n*=(m[2]==="k"?1e3:m[2]==="m"?1e6:m[2]==="b"?1e9:1); return n>0?n:null; }
function priorityOf(d){

  const t=targetForDeal(d), lead=isLead(d), parts=[];

  const fs=parseFloat(String(t.fitScore||d.fitScore||"").replace(/[^0-9.]/g,""));
  const fit=(isFinite(fs)&&fs>0)?Math.min(10,fs)*2.5:12;

/* =====================================================================
   AI ADAPTER — every AI call in the app goes through aiJson().
   Today the provider is the Claude artifact runtime ("sample"). For a stand-alone product the provider
   becomes a server-side gateway that holds our own OpenAI / Anthropic API keys (never in the page),
   authenticates the user, enforces the plan quota and meters usage. Only this file changes then.
   See the production roadmap. Meter below records every call so cost per feature / brand is known.
   ===================================================================== */
const AI={provider:"artifact",gatewayUrl:"",meter:{calls:0,inChars:0,outChars:0,ms:0,toolCalls:0,byFeature:{}}};
function aiAvailable(){ return AI.provider==="gateway"?!!AI.gatewayUrl:!!sampleCap; }
function aiMeterAdd(feature,inChars,outChars,ms){ const m=AI.meter, f=m.byFeature[feature||"other"]||(m.byFeature[feature||"other"]={calls:0,inChars:0,outChars:0});
  m.calls++; m.inChars+=inChars; m.outChars+=outChars; m.ms+=ms; f.calls++; f.inChars+=inChars; f.outChars+=outChars; }
async function aiGateway(){ throw {code:"unavailable",message:"The AI gateway isn't configured — this view uses the Claude runtime."}; }
/* o: {tools, tier:"quick"|"default"|"complex", signal, cache, feature} -> parsed JSON (same shape sample.json returns) */
async function aiJson(prompt,o){ o=o||{}; const t0=Date.now(); let out;
  try{
    if(AI.provider==="gateway") out=await aiGateway(prompt,o);
    else{ if(!sampleCap) throw {code:"unavailable",message:"The Alchemist isn't available in this view"};
      const opt={modelTier:o.tier||"quick"}; if(o.tools) opt.tools=o.tools; if(o.signal) opt.signal=o.signal; if(o.cache!==undefined) opt.cache=o.cache; if(o.images) opt.images=o.images; out=await sampleCap.json(prompt,opt); }
  } finally { aiMeterAdd(o.feature,String(prompt||"").length,0,Date.now()-t0); }
  try{ AI.meter.outChars+=JSON.stringify(out||"").length; }catch(e){}
  return out; }

/* =====================================================================
   BRAND KNOWLEDGE + GUARDRAILS
   What the brand is, who it is for, where those people gather, what may be
   said — and who we must NEVER approach (competitors, blocked words, do-not-contact).
   Research, drafting and row alerts all read this, so campaigns start on target.
   ===================================================================== */
const KB_FIELDS=[
  {k:"whatItIs",label:"What it is",need:true,hint:"One or two plain lines — product, category, stage."},
  {k:"targetAudience",label:"Target audience",need:true,hint:"Who it is for. Research aims at these people."},
  {k:"audienceHangouts",label:"Where the audience gathers",need:true,hint:"Subreddits, Discords, creators, sites, events — real places to find them."},
  {k:"keyMessages",label:"Key messages",need:true,hint:"What outreach may say: the story and the invite. Facts only."},
  {k:"proofPoints",label:"Proof points",need:true,hint:"The only claims outreach may cite (real launches, numbers, partners)."},
  {k:"competitors",label:"Competitors",need:true,hint:"Rival products / platforms / communities. Never approached, never named in outreach."},
  {k:"brandTone",label:"Tone / voice",need:false},
  {k:"mission",label:"Mission",need:false}
];
function kbList(s){ return String(s||"").split(/[\n,;]+/).map(x=>x.trim()).filter(x=>x.length>1); }
function kbNorm(s){ return " "+String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()+" "; }
function kbSq(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,""); }
function kbHost(u){ try{ return new URL(/^https?:/i.test(u)?u:"https://"+u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
/* does term appear in text? long terms match inside squashed text (fiveminsider.com ⊃ fivem); short terms need whole words */
function kbHas(term,ident){ const sq=kbSq(term); if(sq.length<2) return false; if(sq.length>=4) return kbSq(ident).includes(sq); return kbNorm(ident).includes(" "+kbNorm(term).trim()+" "); }
/* o = {name, urls:[...], emails:[...], site, niche, type, platform} — competitors match only who/where they are; block words also match what they cover */
function blockHit(brand,o){
  if(!brand) return null;
  const ident=[o.name,o.site].concat(o.urls||[]).concat((o.urls||[]).map(kbHost)).concat((o.emails||[]).map(e=>String(e||"").split("@")[1]||"")).join(" ");
  const loose=ident+" "+[o.niche,o.type,o.platform].join(" ");
  const comp=kbList(brand.competitors).find(t=>kbHas(t,ident)); if(comp) return {kind:"competitor",term:comp};
  const bw=kbList(brand.blockWords).find(t=>kbHas(t,loose)); if(bw) return {kind:"blocked word",term:bw};
  return null;
}

/* =====================================================================
   CONNECTIONS — connectors that live INSIDE the app.
   Each viewer (agency staff or a subscriber) connects their OWN accounts in claude.ai; the page calls
   them through the `mcp` capability with that viewer's credentials, and drives them with the in-app
   agent (`sample` + tools). The Alchemist only gets READ tools (search / fetch / read thread) — it can never
   send, draft, label or change anything. Everything it reports is checked against what the tools
   actually returned before it is saved, so an invented contact or an invented reply is dropped.
   ===================================================================== */
let mcpCap=null, permCap=null;
const CONNECTORS=[
 {key:"gmail",server:"Gmail",label:"Gmail",icon:"✉",tools:["search_threads","get_thread"],
  does:"Progress report: finds replies in your inbox, spots outreach you sent but didn't mark as sent, and notices bounces. Read-only.",
  privacy:"Claude reads the threads that involve your tracked contacts. Alchemist Reach saves only the subject, a short quote and (for replies) the reply text.",
  add:"Inbox scanning isn’t switched on yet."},
 {key:"web",server:"Parallel Search",label:"Web research",icon:"🔎",tools:["web_search","web_fetch"],
  does:"Find more options: searches the web and reads public pages to find real channels, sites and communities with a contact you can verify. Built in — runs on your plan’s AI allowance, on phone or desktop.",
  privacy:"Only the search terms and page addresses go out. Every contact it adds is checked against the pages it actually read.",
  add:"Web research is built in. If it shows as unavailable, press Check connections."}
];
const conn={gmail:{st:"checking"},web:{st:"checking"}};
function CN(key){ return CONNECTORS.find(c=>c.key===key); }
function connUsable(key){ const s=conn[key]&&conn[key].st; return (s==="ready"||s==="allow")&&!!mcpCap; }
async function connRefresh(){
  if(!mcpCap){ CONNECTORS.forEach(c=>{ conn[c.key]={st:"unavailable"}; }); return; }
  let res=null; try{ res=await mcpCap.listTools(); }catch(e){ res=null; }
  for(const c of CONNECTORS){
    const s=res&&(res.servers||[]).find(x=>x.server===c.server&&x.kind!=="artifact");
    let st; const tools=s?(s.tools||[]):[];
    if(!res) st="unknown";
    else if(!s||!tools.length) st=(res.servers||[]).some(x=>x.kind==="builtin")?"soon":"missing";
    else if(s.authStatus==="needs_reauth") st="reauth";
    else st=(s.authStatus==="connected"&&tools.some(t=>t.description))?"ready":"allow";
    if((st==="ready"||st==="allow")&&permCap){ try{ const p=await permCap.state("mcp:"+c.server); if(p==="denied") st="off"; }catch(e){} }
    conn[c.key]={st,tools:tools.map(t=>t.name),builtin:!!(s&&s.kind==="builtin")};
  }
}
function connErr(e,key){ const c=key?CN(key):null; const nm=c?c.label:"The connector"; const code=e&&e.code;
  if(code==="needs_reauth") return nm+" needs reconnecting — open claude.ai → Settings → Connectors and reconnect it.";
  if(code==="server_not_connected"||code==="server_not_found") return nm+" isn't connected for your account. "+(c?c.add:"");
  if(code==="not_in_manifest"||code==="approval_required"||code==="consent_required"||code==="not_granted") return "You haven't allowed "+nm+" for Alchemist Reach — open Connections and allow it.";
  if(code==="selection_required") return "You have more than one "+nm+" connector — choose one in the permission prompt.";
  if(code==="blocked_by_policy") return nm+" is blocked by your organisation's policy.";
  if(code==="cancelled") return "Stopped.";
  return (c?nm+": ":"")+((e&&e.message)?String(e.message).slice(0,160):"unexpected error");
}
/* ---------- verification helpers ---------- */
function squash(s){ return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9@]+/g,""); }
function urlSq(u){ return squash(String(u||"").replace(/^https?:\/\/(www\.)?/i,"").replace(/[?#].*$/,"")); }
function inCorpus(run,s,min){ const q=squash(s); return q.length>=(min||4)&&run.sq.includes(q); }
function urlIn(run,u){ const q=urlSq(u); return q.length>=6&&run.sq.includes(q); }
function decodeEnt(t){ return String(t).replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n)).replace(/&#x([0-9a-f]+);/gi,(m,n)=>String.fromCharCode(parseInt(n,16))).replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&"); }
function flatStrings(v,out){ if(v==null) return; if(typeof v==="string") out.push(decodeEnt(v)); else if(Array.isArray(v)) v.forEach(x=>flatStrings(x,out)); else if(typeof v==="object") Object.keys(v).forEach(k=>flatStrings(v[k],out)); }
/* Web tools return long page excerpts: show the Alchemist a compact view that always surfaces any email addresses found. */
function compactShown(p){
  try{ if(p&&Array.isArray(p.results)&&p.results.every(x=>x&&typeof x==="object"&&("url" in x))){
    return JSON.stringify({results:p.results.map(x=>{ const ex=(Array.isArray(x.excerpts)?x.excerpts.join(" "):String(x.excerpts||"")); const emails=Array.from(new Set((ex.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g)||[]))).slice(0,6); return {url:x.url,title:x.title,emails:emails,excerpt:ex.replace(/\s+/g," ").slice(0,900)}; })}); }
  }catch(e){}
  return JSON.stringify(p);
}
function chunksOf(p){ /* one chunk per result item (page / thread) so name + contact must come from the SAME page */
  try{ if(p&&typeof p==="object"&&!Array.isArray(p)){ const k=Object.keys(p).find(x=>Array.isArray(p[x])&&p[x].length&&typeof p[x][0]==="object"); if(k) return p[k].map(it=>{ const a=[]; flatStrings(it,a); return squash(a.join("\n")); }); } }catch(e){}
  const a=[]; flatStrings(p,a); return [squash(a.join("\n"))];
}
function chunkHas(run,parts,min){ const qs=parts.filter(Boolean).map(x=>squash(x)); if(qs.some(q=>q.length<(min||4))) return false; return run.chunks.some(c=>qs.every(q=>c.includes(q))); }
function chunkHasUrl(run,name,u){ const q=urlSq(u), n=squash(name); return q.length>=6&&n.length>=4&&run.chunks.some(c=>c.includes(q)&&c.includes(n)); }
function resultTexts(r){
  const out=[]; let shown="", chunks=[];
  if(r&&r.payload!==undefined&&r.payload!==null){ if(typeof r.payload==="string"){ shown=r.payload; out.push(decodeEnt(r.payload)); chunks=[squash(decodeEnt(r.payload))]; } else { shown=compactShown(r.payload); flatStrings(r.payload,out); chunks=chunksOf(r.payload); } }
  else { const t=((r&&r.content)||[]).filter(b=>b&&b.type==="text").map(b=>b.text).join("\n"); shown=t; try{ const j=JSON.parse(t); flatStrings(j,out); chunks=chunksOf(j); }catch(e){ out.push(t); chunks=[squash(decodeEnt(t))]; } }
  return {shown,flat:out.join("\n"),chunks};
}
function trimSchema(s){
  const p={}; Object.keys((s&&s.properties)||{}).forEach(k=>{ if(k==="model_name"||k==="session_id") return; const o=s.properties[k]||{}; const q={type:o.type||"string"}; if(o.items) q.items={type:(o.items&&o.items.type)||"string"}; if(o.enum) q.enum=o.enum; if(o.description) q.description=String(o.description).slice(0,150); p[k]=q; });
  return {type:"object",properties:p,required:((s&&s.required)||[]).filter(k=>p[k])};
}
/* Build agent tools from a connector's READ tools. Schemas come from the connector itself at run time. */
async function connTools(key,run){
  const c=CN(key), out=[];
  for(const t of c.tools){
    let desc="", schema={type:"object",properties:{}};
    try{ const d=await mcpCap.describeTool(c.server,t); if(d){ desc=d.description||""; if(d.inputSchema&&d.inputSchema.type==="object") schema=d.inputSchema; } }catch(e){}
    out.push({name:key+"_"+t, description:((desc||t)+" (read-only)").slice(0,900), inputSchema:trimSchema(schema),
      execute:async(input,ctx)=>{
        if(run.calls>=run.maxCalls) throw new Error("Tool budget for this run is used up. Answer with what you already have.");
        run.calls++; if(run.onCall) run.onCall(c,t,input);
        let r; try{ r=await mcpCap.callTool(c.server,t,input||{},{cache:false,signal:ctx&&ctx.signal}); }catch(e){ run.lastErr=e; throw new Error((e&&e.message)||"tool failed"); }
        run.ok++; const tx=resultTexts(r); run.sq+=squash(tx.flat)+"|"; tx.chunks.forEach(c=>run.chunks.push(c)); return tx.shown.slice(0,28000);
      }});
  }
  return out;
}
function newRun(max,onCall){ return {calls:0,ok:0,maxCalls:max||40,sq:"",chunks:[],lastErr:null,onCall}; }
function parseLoose(text){ const s=String(text||""); const a=s.indexOf("{"), b=s.lastIndexOf("}"); if(a<0||b<=a) return null; try{ return JSON.parse(s.slice(a,b+1)); }catch(e){ return null; } }
async function agentWithTools(prompt,tools,ctl,key,run,tier){
  if(!aiAvailable()) throw {code:"unavailable",message:"The Alchemist isn't available in this view"};
  let out;
  try{ out=await aiJson(prompt,{tools,tier:tier||"default",signal:ctl.signal,feature:key==="gmail"?"inbox":"research"}); }
  catch(e){ if(e&&e.code==="invalid_json"&&e.text){ out=parseLoose(e.text); if(!out) throw e; } else throw e; }
  if(run.calls>0&&run.ok===0&&run.lastErr) throw run.lastErr;
  return out||{};
}

const INBOX_MANIFEST="{\n  \"timeZone\": \"Etc/UTC\",\n  \"exceptionLogging\": \"STACKDRIVER\",\n  \"runtimeVersion\": \"V8\",\n  \"oauthScopes\": [\n    \"https://www.googleapis.com/auth/gmail.readonly\",\n    \"https://www.googleapis.com/auth/script.external_request\",\n    \"https://www.googleapis.com/auth/script.scriptapp\"\n  ]\n}";
const INBOX_TPL="/**\n * Reach Inbox Sync (read-only) \u2014 runs in YOUR Google account, reads YOUR Gmail, and tells Alchemist Reach\n * only what it found for the contacts you are tracking (who replied, which sends went out, which bounced).\n * Reach never gets access to your mailbox. This script can only READ mail: it asks Google for the read-only Gmail\n * permission, so it cannot send, delete, label, draft or change anything in your mailbox.\n *\n * What leaves your mailbox, per contact: the date, the subject, a short quote (up to 160 characters)\n * and, for replies only, the reply's own text (up to 1,200 characters, earlier quoted messages removed) plus\n * the last few messages before it in that thread (up to 500 characters each) so replies can be answered in context.\n * To stop it at any time: remove the key in Reach \u2192 Connections, or delete this script's trigger.\n *\n * Setup: (1) paste this whole file into a new project at script.google.com; (2) in Project Settings tick\n * \"Show appsscript.json manifest file in editor\", open appsscript.json and paste the manifest Reach shows you\n * (it limits the script to read-only Gmail); (3) press Run on \"setup\" and approve the permission once.\n * It then checks every hour.\n */\nvar REACH_URL = \"__ENDPOINT__\";\nvar REACH_KEY = \"__KEY__\";          // keep private \u2014 anyone with it can report to your Reach workspace\nvar BUDGET_MS = 4.5 * 60 * 1000;     // stay under Google's 6-minute limit; the next run continues where this one stopped\nvar GMAIL_API = \"https://gmail.googleapis.com/gmail/v1/users/me/\";\n\nfunction setup() {\n  ScriptApp.getProjectTriggers().forEach(function (t) {\n    if (t.getHandlerFunction() === \"syncReach\") ScriptApp.deleteTrigger(t);\n  });\n  ScriptApp.newTrigger(\"syncReach\").timeBased().everyHours(1).create();\n  PropertiesService.getScriptProperties().deleteProperty(\"cursor\");\n  syncReach();\n}\n\nfunction stop() {\n  ScriptApp.getProjectTriggers().forEach(function (t) {\n    if (t.getHandlerFunction() === \"syncReach\") ScriptApp.deleteTrigger(t);\n  });\n}\n\nfunction post_(payload) {\n  var res = UrlFetchApp.fetch(REACH_URL, {\n    method: \"post\", contentType: \"application/json\", muteHttpExceptions: true,\n    headers: { \"x-reach-key\": REACH_KEY }, payload: JSON.stringify(payload)\n  });\n  var code = res.getResponseCode(), out = {};\n  try { out = JSON.parse(res.getContentText()); } catch (e) {}\n  if (code !== 200 || !out.ok) throw new Error(\"Reach said: \" + (out.error || (\"HTTP \" + code)));\n  return out;\n}\n\n// ---- Gmail, read-only, through Google's Gmail API with this script's own read-only token ----\nfunction gmail_(path, params) {\n  var qs = \"\";\n  if (params) qs = \"?\" + Object.keys(params).map(function (k) { return encodeURIComponent(k) + \"=\" + encodeURIComponent(params[k]); }).join(\"&\");\n  var res = UrlFetchApp.fetch(GMAIL_API + path + qs, { headers: { Authorization: \"Bearer \" + ScriptApp.getOAuthToken() }, muteHttpExceptions: true });\n  var code = res.getResponseCode();\n  if (code !== 200) throw new Error(\"Gmail said HTTP \" + code);\n  return JSON.parse(res.getContentText());\n}\n\nfunction b64_(s) {\n  try { return Utilities.newBlob(Utilities.base64DecodeWebSafe(String(s || \"\"))).getDataAsString(\"UTF-8\"); } catch (e) { return \"\"; }\n}\nfunction header_(msg, name) {\n  var hs = (msg.payload && msg.payload.headers) || [];\n  for (var i = 0; i < hs.length; i++) if (String(hs[i].name).toLowerCase() === name) return String(hs[i].value || \"\");\n  return \"\";\n}\nfunction partText_(part, mime) {\n  if (!part) return \"\";\n  if (part.mimeType === mime && part.body && part.body.data) return b64_(part.body.data);\n  var ps = part.parts || [];\n  for (var i = 0; i < ps.length; i++) { var t = partText_(ps[i], mime); if (t) return t; }\n  return \"\";\n}\nfunction plainBody_(msg) {\n  var t = partText_(msg.payload, \"text/plain\");\n  if (t) return t;\n  var h = partText_(msg.payload, || threadsFor_(t.email, since);\n  var rep = null, bounce = null, sent = null;\n  threads.forEach(function (th) {\n    th.msgs.forEach(function (m) {\n      var ds = day_(m.dt);\n      if (ds < since) return;\n      var from = addrs_(m.from);\n      var subj = m.subject || \"\";\n      var raw = from.join(\" \");\n      var fromThem = from.indexOf(t.email) >= 0;\n      var isBounce = /mailer-daemon|postmaster/.test(raw);\n      var fromMe = from.some(function (a) { return me[a]; });\n      if (fromThem && !fromMe) {\n        if (/auto(matic)?[\\s\\-]?reply|out of office|autoreply|undeliverable/i.test(subj)) return;\n        if (!rep || m.dt > rep.dt) rep = { dt: m.dt, date: ds, subject: subj, text: ownText_(m.body), thread: th.id, th: th, id: m.id };\n      } else if (isBounce) {\n        if (String(m.body || \"\").toLowerCase().indexOf(t.email) >= 0)\n          if (!bounce || m.dt > bounce.dt) bounce = { dt: m.dt, date: ds, subject: subj, text: ownText_(m.body), thread: th.id, th: th, id: m.id };\n      } else if (fromMe) {\n        var to = addrs_(m.to + \" \" + m.cc);\n        if (to.indexOf(t.email) >= 0)\n          if (!sent || m.dt > sent.dt) sent = { dt: m.dt, date: ds, subject: subj, text: ownText_(m.body), thread: th.id, th: th, id: m.id };\n      }\n    });\n  });\n  var pick = null, type = \"\";\n  if (rep && rep.text.length >= 10) { pick = rep; type = \"replied\"; }\n  else if (bounce) { pick = bounce; type = \"bounced\"; }\n  else if (sent && t.phase === \"ready\") { pick = sent; type = \"sent\"; }\n  if (!pick) return null;\n  var quote = (type === \"bounced\" ? \"Delivery failed for \" + t.email : pick.text).replace(/\\s+/g, \" \").slice(0, 150);\n  if (quote.length < 10) quote = (\"Message \" + (type === \"sent\" ? \"sent to \" : \"from \") + t.email + \" on \" + pick.date).slice(0, 150);\n  var context = [];\n  if (type === \"replied\") {\n    try {\n      pick.th.msgs.forEach(function (mm) {\n        if (mm.id === pick.id || mm.dt > pick.dt) return;\n        var fm = addrs_(mm.from).some(function (a) { return me[a]; });\n        var tx = ownText_(mm.body).slice(0, 500);\n        if (tx.length >= 5) context.push({ who: fm ? \"us\" : \"them\", date: day_(mm.dt), text: tx });\n      });\n    } catch (e) {}\n    context = context.slice(-4);   // the last few messages before their reply, so Reach can answer in context\n  }\n  return { id: t.id, type: type, date: pick.date, subject: pick.subject.slice(0, 120), quote: quote, replyText: type === \"replied\" ? pick.text.slice(0, 1200) : \"\", context: context, threadId: String(pick.thread).slice(0, 60) };\n}\n\nfunction syncReach() {\n  var started = Date.now();\n  var props = PropertiesService.getScriptProperties();\n  var info = post_({ action: \"targets\" });\n  var targets = info.targets, since = info.since, me = mine_();\n  var i = Number(props.getProperty(\"cursor\") || 0);\n  if (i >= targets.length) i = 0;\n  var findings = [], checked = 0, errs = 0, lastErr = \"\", total = 0;\n  function flush() {\n    if (!findings.length && !checked) return;\n    post_({ action: \"ingest\", findings: findings, since: since, checked: checked });\n    findings = []; checked = 0;\n  }\n  for (; i < targets.length; i++) {\n    if (Date.now() - started > BUDGET_MS) { flush(); props.setProperty(\"cursor\", String(i)); return; }\n    var f = null, failed = false;\n    try { f = findFor_(targets[i], since, me); } catch (e) { failed = true; errs++; lastErr = String(e && e.message || e); }  // one bad search never stops the run\n    total++;\n    if (!failed) checked++;\n    if (f) findings.push(f);\n    if (findings.length >= 40) flush();\n  }\n  flush();\n  props.deleteProperty(\"cursor\");\n  // every contact failed (usually a missing permission): say so instead of reporting a quiet success\n  if (total > 0 && errs === total) throw new Error(\"Could not read Gmail: \" + lastErr + \". Check the appsscript.json permissions, then run setup again.\");\n}\n";

function sumByCur(items){ const m={}; items.forEach(([n,c])=>{ if(n==null) return; const k=c||"—"; m[k]=m[k]||{sum:0,n:0}; m[k].sum+=n; m[k].n++; }); return m; }
function fmtCur(c,n){ const sym={USD:"$",EUR:"€",GBP:"£"}[c]; const s=Math.round(n).toLocaleString(); return sym?sym+s:(c&&c!=="—"?c+" ":"")+s; }
function moneyBlock(m,avg){ const k=Object.keys(m); if(!k.length) return "—"; return k.map(c=>fmtCur(c,avg?m[c].sum/m[c].n:m[c].sum)).join(" · "); }

  const t=document.getElementById("pageTitle"),c=document.getElementById("pageCrumb"),a=document.getElementById("topActions"),v=document.getElementById("view");
  const I=ix(); const brand=state.currentBrandId?brandById(state.currentBrandId):null; if(brand) DP.brand=brand.id;
  t.textContent="Deals & pricing"; c.textContent=DP.brand?((brandById(DP.brand)||{}).name||""):"all brands"; a.innerHTML="";
  const inBrand=(d)=>!DP.brand||d.brandId===DP.brand; const q=DP.q.trim().toLowerCase();
  const hit=(d)=>!q||hayOf(d).includes(q);
  const made=state.deals.filter(d=>phaseOf(d)==="won"&&inBrand(d)&&hit(d));
  const nego=state.deals.filter(d=>{ const ph=phaseOf(d); return (ph==="deal"||(ph==="replied"&&(latestRate(d)||d.quotedRate)))&&inBrand(d)&&hit(d); });

/* =====================================================================
   OPTIONS LIBRARY + OPTION PROFILES
   One catalog of every creator / outlet / community UPM can approach, shared by every brand.
   - Library: searchable table, filters, pricing and response at a glance.
   - Profile: identity, links & contact (with how it was verified), price list (UPM deck /
     creator quotes / public rate cards), every deal across brands, response rate.
   Agency-only: a profile shows other clients' history and UPM's own pricing, so it is never
   rendered in client mode. A brand's own deals with an option still appear in that brand's
   Workbench and Deals page.

const OL={seg:"options",q:"",tz:"",plat:"",niche:"",lang:"",brand:"",flt:"",sort:{col:"",dir:"asc"},limit:120};

function optStats(o,pre){
  const I=ix(), ds=(I.byTarget.get((pre||"O:")+o.id)||[]);
  let sent=0, replied=0, won=0, days=[], last="", brands=new Set();
  ds.forEach(d=>{ const ph=phaseOf(d); brands.add(d.brandId);
    const sd=d.sentDate||d.lastSentDate; if(sd) sent++;
    const rep=!!d.repliedDate||ph==="replied"||ph==="deal"||ph==="won"; if(rep&&sd) replied++;
    if(ph==="won") won++;
    const sIso=toIso(d.sentDate); if(sIso&&d.repliedDate){ const rIso=toIso(d.repliedDate,+sIso.slice(0,4)); const n=rIso?daysBetween(sIso,rIso):null; if(n!=null&&n>=0&&n<400) days.push(n); }
    const cands=[d.lastSentDate,d.sentDate,d.repliedDate].map(x=>toIso(x,sIso?+sIso.slice(0,4):0)).concat(commsForDeal(d.id).map(c=>toIso(c.date))).filter(Boolean); cands.forEach(x=>{ if(x>last) last=x; }); });
  return {deals:ds,sent,replied,won,rate:sent?replied/sent:null,avgDays:days.length?Math.round(days.reduce((a,b)=>a+b,0)/days.length):null,last,brands:[...brands].filter(Boolean)};
}
function optPrices(o){ return (Array.isArray(o.prices)?o.prices:[]).filter(p=>p&&p.amount).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))); }
function optQuotes(o,pre){ const I=ix(), out=[]; (I.byTarget.get((pre||"O:")+o.id)||[]).forEach(d=>{ const rs=ratesForDeal(d.id); rs.forEach(r=>out.push({r,d}));
    /* quotes typed straight into the row (old sheet "Quoted Rate") count as a quote when no formal rate log exists */
    const qr=(d.quotedRate||"").toString().trim(); if(!rs.length&&qr) out.push({r:{amount:/[^\d.,\s]/.test(qr)?qr:qr+" (currency not recorded)",kind:"Quote",quotedDate:toIso(d.repliedDate,+(toIso(d.sentDate)||"0000").slice(0,4))||toIso(d.sentDate),note:d.confirmToSend&&/quot/i.test(d.confirmToSend)?String(d.confirmToSend).slice(0,200):""},d}); });
  return out.sort((a,b)=>String(b.r.quotedDate||"").localeCompare(String(a.r.quotedDate||""))); }

  const q=optQuotes(o); if(q.length) return {txt:q[0].r.amount,tag:"quote · "+fmtShort(q[0].r.quotedDate),kind:"quote"};
  if((o.rates||"").trim()) return {txt:o.rates,tag:"on file",kind:"list"}; return null; }
function socialLabel(u){ const s=String(u||"").toLowerCase();
  if(/youtu\.?be/.test(s)) return "YouTube"; if(/twitch\.tv/.test(s)) return "Twitch"; if(/(^|\/\/|\.)x\.com|twitter\.com/.test(s)) return "X"; if(/instagram\.com/.test(s)) return "Instagram";
  if(/tiktok\.com/.test(s)) return "TikTok"; if(/reddit\.com/.test(s)) return "Reddit"; if(/discord\.(gg|com)/.test(s)) return "Discord"; if(/t\.me\//.test(s)) return "Telegram";
  if(/facebook\.com|fb\.com/.test(s)) return "Facebook"; if(/linkedin\.com/.test(s)) return "LinkedIn"; if(/substack\.com|beehiiv|buttondown/.test(s)) return "Newsletter"; if(/^https?:/.test(s)) return "Website"; return "Link"; }
function optLinks(o){ const seen=new Set(), out=[];
  function add(u,label){ u=String(u||"").trim(); if(!u) return; const k=u.toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""); if(seen.has(k)) return; seen.add(k); out.push({u,label:label||socialLabel(u)}); }

function optOtherContact(o){ return String(o.contactOther||"").split(/[\n;]+/).map(x=>x.trim()).filter(x=>x&&!/^https?:\/\//i.test(x)&&!/^(t\.me|discord\.gg|www\.)/i.test(x)); }

/* ------------------------- duplicate check (every manual add path) ------------------------- */
const SOCIAL_RE=/(^|\.)(youtube\.com|youtu\.be|twitch\.tv|x\.com|twitter\.com|instagram\.com|tiktok\.com|reddit\.com|facebook\.com|fb\.com|linkedin\.com|t\.me|discord\.gg|discord\.com|substack\.com|medium\.com|linktr\.ee|beehiiv\.com)$/;
function urlKey(u){ u=String(u||"").trim().toLowerCase(); if(!u||u.indexOf(".")<0) return ""; try{ const x=new URL(/^https?:/.test(u)?u:"https://"+u), h=x.hostname.replace(/^www\./,""); if(SOCIAL_RE.test(h)){ const p=x.pathname.replace(/\/+$/,""); return p?h+p:""; } return h; }catch(e){ return ""; } }
function findExisting(kind,c){
  const nkey=(z)=>squash(z).replace(/^the(?=.{4})/,""), nm=nkey(c.name), em=String(c.email||"").trim().toLowerCase(), uk=[urlKey(c.link),urlKey(c.site)].filter(Boolean), lead=kind==="lead";
  return (lead?state.leads:state.options).find(x=>{
    if(nm&&nkey(lead?x.name:x.channelName)===nm) return true;
    const shared=!!(x.orderVia||x.inDeck||x.publicId||x.catalog==="upm-deck");   /* agency-routed rows all carry the agency's email */
    const xe=String(x.contactEmail||"").trim().toLowerCase(); if(em&&xe&&xe===em&&!shared) return true;
    const xk=[urlKey(x.contactLink),urlKey(x.website)].filter(Boolean); return uk.some(k=>xk.includes(k)); })||null;
}
function dupAsk(kind,ex){
  const key=kind+":"+ex.id; if(dupAsk.ok===key) return true; dupAsk.ok=key;
  const b=document.querySelector("#modalBox .mbody"); if(b){ let n=document.getElementById("dupNote"); if(!n){ n=document.createElement("div"); n.id="dupNote"; n.className="al warn"; n.style.margin="8px 0"; b.insertBefore(n,b.firstChild); }
    n.innerHTML='<span class="t"><b>“'+esc(kind==="lead"?ex.name:ex.channelName)+'” is already in your library.</b> <a href="#" id="dupOpen">Open it</a> to add the email or price there, or press the button again to add this as a separate entry.</span>';
    document.getElementById("dupOpen").onclick=function(e){ e.preventDefault(); closeModal(); if(kind==="lead") openLeadProfile(ex.id); else openOptionProfile(ex.id); };
    const sv=document.getElementById("mSave"); if(sv) sv.textContent="Add anyway"; }
  return false;
}

function openAddToCampaign(o){

  function wavesOf(bid){ return state.waves.filter(w=>w.brandId===bid&&(w.pipelineType||"coverage")==="coverage"&&w.status!=="Completed"); }
  openModal('<div class="mhead"><div><h3>Add '+esc(o.channelName)+' to a campaign</h3><div class="ikstep">Creates an unsent row — nothing is contacted.</div></div><button class="iconbtn" id="mClose">&times;</button></div><div class="mbody"><div class="field"><label>Brand</label><select id="acBrand">'+brands.map(b=>'<option value="'+esc(b.id)+'"'+(b.id===cur?" selected":"")+'>'+esc(b.name)+'</option>').join("")+'</select></div><div class="field"><label>Campaign</label><select id="acWave"></select></div><div id="acWarn" class="hint"></div></div>'+foot("Add to campaign"));
  wireClose();
  function fill(){ const bid=document.getElementById("acBrand").value; const ws=wavesOf(bid); document.getElementById("acWave").innerHTML=ws.length?ws.map(w=>'<option value="'+esc(w.id)+'">'+esc(w.name)+'</option>').join(""):'<option value="">No open coverage campaign for this brand</option>';
    const b=brandById(bid); const h=blockHit(b,{name:o.channelName,urls:[o.contactLink],emails:[o.contactEmail],niche:o.niche,type:o.type,platform:o.platform});
    const ex=(ix().byTarget.get("O:"+o.id)||[]).filter(d=>d.brandId===bid);
    document.getElementById("acWarn").innerHTML=(h?'<span style="color:var(--bad)">Looks like a '+esc(h.kind)+' for this brand ('+esc(h.term)+') — better not.</span> ':'')+(ex.length?'Already in '+ex.length+' campaign row'+(ex.length>1?'s':'')+' for this brand; adding again creates a duplicate.':''); }
  document.getElementById("acBrand").addEventListener("change",fill); fill();

}

/* =====================================================================
   PUBLIC OPTIONS LIBRARY
   Sanitized listings shared across workspaces. Only what an owner chose to publish is ever visible here:
   name, platform, niche, reach, prices and HOW TO ORDER. Never research notes, outreach history, brands,
   or anyone's private email. UPM deck options are ordered through UPM; an owner's own options through
   the owner's Public listing contact (Settings).
   ===================================================================== */
const PUB={rows:null,mine:null,loading:false,err:"",q:"",plat:"",niche:"",st:"live",limit:100,sort:{col:"",dir:"asc"}};
async function reachApi(){ try{ return await window.claude.use("reach"); }catch(e){ return null; } }
async function loadPublic(){
  if(PUB.loading) return; PUB.loading=true;
  const R=await reachApi();
  if(!R){ PUB.err="The public library isn't available here."; PUB.loading=false; PUB.rows=PUB.rows||[]; if(OL.seg==="public") renderOptionsPage(); return; }
  try{ PUB.rows=await R.publicOptions(viewerIsAdmin?{status:PUB.st}:{}); PUB.mine=await R.myPublished(); PUB.err=""; }catch(e){ PUB.err=(e&&e.message)||"Couldn't load the library."; PUB.rows=PUB.rows||[]; }
  PUB.loading=false; if(OL.seg==="public") renderOptionsPage();
}
function pubPrices(r){ return (r.listing&&Array.isArray(r.listing.prices)?r.listing.prices:[]).filter(p=>p&&p.amount); }
function pubGlance(r){ const p=pubPrices(r); if(!p.length) return ""; const nums=p.map(x=>({x,n:priceNum(x.amount)})).filter(y=>typeof y.n==="number"&&y.n>0).sort((a,b)=>a.n-b.n); return p.length>1&&nums.length?"from "+nums[0].x.amount:p[0].amount; }
function pubHave(r){ return (state.options||[]).some(o=>o.publicId===r.id); }
function olTabs(){ return '<div class="vtabs" style="margin-bottom:10px"><button class="vtab" data-seg="options">My options <span class="n">'+state.options.length+'</span></button><button class="vtab" data-seg="leads">Leads &amp; intros <span class="n">'+state.leads.length+'</span></button><button class="vtab on" data-seg="public">Public library'+(PUB.rows?' <span class="n">'+PUB.rows.length+'</span>':'')+'</button></div>'; }

function renderPublicLibrary(){
  const t=document.getElementById("pageTitle"),c=document.getElementById("pageCrumb"),a=document.getElementById("topActions"),v=document.getElementById("view");
  t.textContent="Public library"; c.textContent="Options other workspaces and UPM have shared · order through the contact shown";
  a.innerHTML=viewerIsAdmin?'':'';
  if(PUB.rows===null){ v.innerHTML=olTabs()+'<div class="empty"><div class="big">Loading the public library…</div></div>'; v.querySelectorAll("[data-seg]").forEach(b=>b.addEventListener("click",()=>{ OL.seg=b.dataset.seg; renderOptionsPage(); })); loadPublic(); return; }
  const rows0=PUB.rows;
  const uniq=(f)=>Array.from(new Set(rows0.map(r=>String(f(r)||"").trim()).filter(Boolean))).sort((x,y)=>x.localeCompare(y));
  const sel=(list,cur,all)=>'<option value="">'+all+'</option>'+list.map(x=>'<option value="'+esc(x)+'"'+(cur===x?" selected":"")+'>'+esc(x)+'</option>').join("");
  v.innerHTML=olTabs()
    +VERIFY_BANNER
    +(PUB.err?'<div class="al bad" style="margin-bottom:10px"><span class="t">'+esc(PUB.err)+'</span></div>':'')
    +'<div class="wbfilters" style="padding-top:0"><input type="search" id="pbQ" placeholder="Search name, niche, platform…" value="'+esc(PUB.q)+'"><select id="pbPlat">'+sel(uniq(r=>r.listing.platform),PUB.plat,"All platforms")+'</select><select id="pbNiche">'+sel(uniq(r=>r.listing.niche||r.listing.deckCategories),PUB.niche,"All niches")+'</select>'
    +(viewerIsAdmin?'<select id="pbSt">'+[["live","Live"],["pending","Awaiting approval"],["hidden","Hidden"]].map(x=>'<option value="'+x[0]+'"'+(PUB.st===x[0]?" selected":"")+'>'+x[1]+'</option>').join("")+'</select>':'')+'</div>'
    +'<div id="pbBody"></div>';
  const body=document.getElementById("pbBody"), os=PUB.sort;
  function draw(){
    const q=PUB.q.trim().toLowerCase();
    let rows=rows0.filter(r=>{ const l=r.listing||{}; if(PUB.plat&&l.platform!==PUB.plat) return false; if(PUB.niche&&(l.niche||l.deckCategories)!==PUB.niche) return false; if(q&&![l.name,l.platform,l.type,l.niche,l.deckCategories,l.language,l.sku,r.owner_name].filter(Boolean).join(" ").toLowerCase().includes(q)) return false; return true; });
    const acc={name:r=>r.listing.name||"",plat:r=>r.listing.platform||"",niche:r=>r.listing.niche||r.listing.deckCategories||"",reach:r=>priceNum(r.listing.followers||r.listing.monthlyTraffic||0),price:r=>{ const g=pubGlance(r); return g?priceNum(g.replace(/^from /,"")):""; },by:r=>r.owner_name||""};

    const total=rows.length, shown=rows.slice(0,PUB.limit);

      +shown.map(r=>{ const l=r.listing, g=pubGlance(r), have=pubHave(r), reach=l.followers?fmtFollowers(l.followers):(l.monthlyTraffic?fmtFollowers(l.monthlyTraffic)+"/mo":"—");
        return '<tr data-pub="'+esc(r.id)+'"><td><b>'+esc(l.name)+'</b>'+(l.type?'<div class="mini">'+esc(l.type)+(l.sku?" · "+esc(l.sku):"")+'</div>':'')+'</td><td>'+esc(l.platform||"—")+'</td><td class="ellipsis" style="max-width:150px">'+esc(l.niche||l.deckCategories||"—")+'</td><td class="num">'+esc(reach)+'</td><td>'+(g?'<b>'+esc(g)+'</b>':'<span class="mini">—</span>')+'</td><td>'+esc(r.owner_name)+(r.status!=="live"?' <span class="pill p-neutral">'+esc(r.status)+'</span>':'')+'</td><td>'+(have?'<span class="mini">In my options</span>':'<button class="btn tiny" data-addpub="'+esc(r.id)+'">+ Add</button>')+'</td></tr>'; }).join("")+'</tbody></table></div>'
      +(total>shown.length?'<div style="text-align:center;margin:12px"><button class="btn" id="pbMore">Show more ('+(total-shown.length)+' hidden)</button></div>':'')
      :'<div class="empty"><div class="big">'+(PUB.loading?"Loading…":"Nothing shared here yet")+'</div>'+(viewerIsAdmin&&PUB.st!=="live"?"Nothing is "+esc(PUB.st)+" right now.":"Share one of your own options from its profile, or try another filter.")+'</div>';
    wireSort(body,os,draw);

    body.querySelectorAll("[data-addpub]").forEach(b=>b.addEventListener("click",()=>addPublicToMine(b.dataset.addpub,b)));
    const mo=document.getElementById("pbMore"); if(mo) mo.addEventListener("click",()=>{ PUB.limit+=100; draw(); });
  }
  draw();
  v.querySelectorAll("[data-seg]").forEach(b=>b.addEventListener("click",()=>{ OL.seg=b.dataset.seg; OL.sort={col:"",dir:"asc"}; renderOptionsPage(); }));
  let qT=0; document.getElementById("pbQ").addEventListener("input",(e)=>{ PUB.q=e.target.value; PUB.limit=100; clearTimeout(qT); qT=setTimeout(draw,150); });

}
